<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>مصاريفي</title>
<meta name="theme-color" content="#1A1520" id="themeMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── theme tokens ───────────────────────────────── */
:root, body.dark{
  --ink:#1A1520; --ink2:#241C2D; --ink3:#332741;
  --chalk:#EDE9F2; --dim:#9287A0;
  --gold:#E0A64B; --mint:#4FD1A5; --iris:#8B8CF5; --red:#F2726F;
  --onAcc:#241C09; --shadow:0 8px 26px rgba(0,0,0,.45);
  --scrim:rgba(10,7,14,.7);
}
body.light{
  --ink:#F7F4EF; --ink2:#FFFFFF; --ink3:#E4DCD1;
  --chalk:#241C2D; --dim:#7A6F84;
  --gold:#A96F12; --mint:#0E8F63; --iris:#4F50C4; --red:#C43B37;
  --onAcc:#FFFFFF; --shadow:0 6px 20px rgba(40,25,60,.13);
  --scrim:rgba(36,28,45,.45);
}
:root{
  --ar:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --pad:16px; --r:14px; --accent:var(--gold);
}
body.k-inc{--accent:var(--mint)}
body.k-trf{--accent:var(--iris)}
body.k-ref{--accent:var(--mint)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--chalk);font-family:var(--ar);font-size:15px;line-height:1.5;
     -webkit-font-smoothing:antialiased;overscroll-behavior:none;
     transition:background .2s,color .2s}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--chalk)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.perf{height:1px;background-image:linear-gradient(90deg,var(--ink3) 0 5px,transparent 5px 10px);background-size:10px 1px}
.noscroll::-webkit-scrollbar{display:none}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.scroll{padding:0 var(--pad) 26px}

.rail{display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:calc(env(safe-area-inset-top) + 11px) var(--pad) 10px;border-bottom:1px solid var(--ink3);flex:none}
.rail h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.rail .sub{font-size:11.5px;color:var(--dim);font-weight:400}
.rail .mtd{font-size:11px;color:var(--dim);text-align:end;flex:none;line-height:1.35}
.rail .mtd b{display:block;color:var(--chalk);font-weight:600;font-size:15px;margin-top:1px}
.rail .act{font-size:12px;color:var(--gold);font-weight:600}
.rail .duebtn{display:block;font-size:11.5px;font-weight:600;color:var(--gold);margin-top:3px;text-align:start}
.rail .duebtn.late{color:var(--red)}
.rail .duebtn[hidden]{display:none}

.kinds{display:flex;flex:none;border-bottom:1px solid var(--ink3);position:relative}
.kinds button{flex:1;padding:10px 2px;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap}
.kinds button[aria-pressed="true"]{color:var(--chalk)}
.kinds .ind{position:absolute;bottom:-1px;height:2px;background:var(--accent);
            transition:transform .2s cubic-bezier(.2,.9,.3,1),width .2s;right:0}

.readout{flex:none;padding:16px var(--pad) 11px;text-align:center}
.readout .amt{font-family:var(--mono);font-weight:600;font-size:clamp(32px,11.5vw,48px);letter-spacing:-.03em;
              line-height:1;font-variant-numeric:tabular-nums;direction:ltr;display:block}
body.k-inc .readout .amt,body.k-ref .readout .amt{color:var(--mint)}
body.k-trf .readout .amt{color:var(--iris)}
.readout .amt.zero{color:var(--ink3)}
.readout .cur{font-size:.42em;color:var(--dim);font-weight:400;margin-inline-start:.3em;letter-spacing:0}
.readout .tag{margin-top:8px;font-size:12.5px;color:var(--dim);min-height:19px;padding:0 6px}
.readout .tag b{font-weight:600}

.striplbl{font-size:10px;color:var(--dim);padding:0 var(--pad) 4px;flex:none;letter-spacing:.03em}
.strip{display:flex;gap:7px;padding:0 var(--pad) 9px;flex:none;overflow-x:auto}
.c{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
   border:1.5px solid var(--ink3);background:var(--ink2);font-size:13px;color:var(--dim);
   transition:border-color .14s,color .14s}
.c em{font-style:normal;font-size:15px;line-height:1}
.c[aria-pressed="true"]{border-color:var(--accent);color:var(--chalk);
   background:color-mix(in srgb,var(--accent) 12%,transparent)}
.c .bal{font-family:var(--mono);font-size:11px;opacity:.75;direction:ltr}
.q{flex:none;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;
   background:var(--ink2);border:1px solid var(--ink3);font-size:12.5px;color:var(--dim)}
.q em{font-style:normal;font-size:14px}
.q b{font-family:var(--mono);color:var(--chalk);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.q:active{background:var(--ink3)}

/* keypad — forced LTR so 1 2 3 read left→right like a phone */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 var(--pad);flex:none;direction:ltr}
.k{padding:13px 0;border-radius:12px;background:var(--ink2);font-family:var(--mono);font-size:21px;
   font-weight:500;transition:background .1s}
.k:active{background:var(--ink3)}
.k.fn{font-family:var(--ar);font-size:17px;color:var(--dim)}

.savebar{padding:10px var(--pad) 8px;flex:none;display:flex;gap:7px}
.save{flex:1;padding:15px;border-radius:var(--r);background:var(--accent);color:var(--onAcc);
      font-weight:700;font-size:16px;transition:opacity .14s,transform .08s}
.save:active{transform:scale(.985)}
.save:disabled{opacity:.28}
.mini{width:48px;border-radius:var(--r);background:var(--ink2);border:1px solid var(--ink3);
      font-size:18px;color:var(--dim);display:grid;place-items:center;flex:none}
.mini.has{color:var(--accent);border-color:var(--accent)}

nav{display:grid;flex:none;border-top:1px solid var(--ink3);background:var(--ink);
    padding-bottom:env(safe-area-inset-bottom)}
nav.n4{grid-template-columns:repeat(4,1fr)}
nav.n5{grid-template-columns:repeat(5,1fr)}
nav button{padding:9px 0 8px;font-size:10.5px;color:var(--dim);display:flex;flex-direction:column;
           align-items:center;gap:3px}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
               stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}

.searchbar{padding:12px var(--pad) 0;flex:none}
.searchbar input{width:100%;padding:11px 13px;border-radius:11px;background:var(--ink2);border:1.5px solid var(--ink3)}
.searchbar input:focus{border-color:var(--gold);outline:none}

.daygrp{margin-top:18px}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px}
.dayhd .d{font-size:12px;color:var(--dim);font-weight:500}
.dayhd .t{font-size:13px;font-weight:600}
.roll{background:var(--ink2);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:12px 13px;width:100%;text-align:start}
.row:active{background:var(--ink3)}
.row em{font-style:normal;font-size:19px;line-height:1;flex:none;width:24px;text-align:center}
.row .meta{flex:1;min-width:0}
.row .nm{font-size:14px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nt{font-size:11.5px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-family:var(--mono);font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;
          direction:ltr;flex:none}
.row .val.plus{color:var(--mint)}
.row .val.trf{color:var(--iris)}
.pill{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;flex:none;
      background:var(--ink3);color:var(--dim);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.print{animation:feed .34s cubic-bezier(.2,.9,.3,1)}
@keyframes feed{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0 4px}
.mnav button{width:36px;height:36px;border-radius:10px;background:var(--ink2);font-size:16px;color:var(--dim)}
.mnav button:disabled{opacity:.3}
.mnav .lbl{font-size:14px;font-weight:600}
.hero{padding:16px 0 18px;text-align:center}
.hero .cap{font-size:11.5px;color:var(--dim);margin-bottom:8px;letter-spacing:.02em}
.hero .big{font-family:var(--mono);font-size:clamp(31px,10vw,41px);font-weight:600;letter-spacing:-.03em;
           line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.hero .big .cur{font-size:.4em;color:var(--dim);font-weight:400;margin-inline-start:.25em}
.hero .pos{color:var(--mint)}.hero .neg{color:var(--red)}
.hero .legs{margin-top:12px;font-size:12.5px;color:var(--dim);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hero .legs b{color:var(--chalk);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.hero .cmp{margin-top:9px;font-size:12px;color:var(--dim)}
.up{color:var(--red)}.down{color:var(--mint)}

.card{background:var(--ink2);border-radius:var(--r);padding:15px;margin-top:12px}
.card h3{margin:0 0 13px;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.02em;
         display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 button{font-size:11.5px;color:var(--gold);font-weight:600;flex:none}
.card .foot{margin-top:12px;font-size:12px;color:var(--dim);text-align:center;line-height:1.65}
.card .foot b{color:var(--chalk);font-weight:600}
.card .foot .neg{color:var(--red)} .card .foot .pos{color:var(--mint)}
.card.warn{border:1px solid color-mix(in srgb,var(--red) 45%,transparent);
           background:color-mix(in srgb,var(--red) 9%,var(--ink2))}

.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--ink3);gap:2px}
.split i{display:block}
.splegend{display:flex;justify-content:space-between;margin-top:11px;font-size:12.5px;gap:10px}
.splegend span{display:flex;align-items:center;gap:6px;color:var(--dim);min-width:0}
.splegend b{font-family:var(--mono);color:var(--chalk);font-weight:600;font-variant-numeric:tabular-nums}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

.brow{margin-bottom:13px}
.brow:last-child{margin-bottom:0}
.brow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-size:13px}
.brow .top .l{display:flex;align-items:center;gap:6px;min-width:0}
.brow .top .l span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .top .r{font-family:var(--mono);font-weight:500;flex:none;font-variant-numeric:tabular-nums;direction:ltr}
.brow .top .pct{color:var(--dim);font-size:11.5px;flex:none}
.bar{height:6px;border-radius:3px;background:var(--ink3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gold)}
.bar.mintbar i{background:var(--mint)}
.bar.irisbar i{background:var(--iris)}
.bar.over i{background:var(--red)}
.bar.tall{height:9px;border-radius:4px}
.bud{font-size:11px;color:var(--dim);margin-top:4px}
.bud.over{color:var(--red)}

.days{display:flex;align-items:flex-end;gap:2px;height:74px;direction:ltr}
.days i{flex:1;background:var(--ink3);border-radius:2px 2px 0 0;min-height:2px}
.days i.hot{background:var(--gold)}
.dayax{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;color:var(--dim);
       direction:ltr;font-family:var(--mono)}
.yr{display:flex;align-items:flex-end;gap:5px;height:88px;direction:ltr}
.yr .mo{flex:1;display:flex;align-items:flex-end;gap:1.5px;height:100%}
.yr .mo i{flex:1;border-radius:2px 2px 0 0;min-height:2px;background:var(--ink3)}
.yr .mo i.e{background:var(--gold)} .yr .mo i.i{background:var(--mint)}
.yr .mo.cur i.e{box-shadow:0 0 0 1px var(--chalk) inset}
.yrax{display:flex;gap:5px;margin-top:7px;direction:ltr}
.yrax span{flex:1;text-align:center;font-size:9px;color:var(--dim)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--ink2);border-radius:var(--r);padding:14px}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;
         direction:ltr;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--dim);margin-top:5px}

.sec{margin-top:20px}
.sec>h2{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.02em;
        display:flex;justify-content:space-between;align-items:center}
.sec>h2 button{font-size:11.5px;color:var(--gold);font-weight:600}
.list{background:var(--ink2);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:11px;padding:12px 13px;width:100%;text-align:start}
.item em{font-style:normal;font-size:18px;width:24px;text-align:center;flex:none}
.item .nm{flex:1;font-size:14px;min-width:0}
.item .nm small{display:block;font-size:11.5px;color:var(--dim)}
.item .hint{font-size:12.5px;color:var(--dim);font-family:var(--mono);direction:ltr;flex:none;
            font-variant-numeric:tabular-nums}
.item .chev{color:var(--dim);font-size:13px;flex:none}
.item:active{background:var(--ink3)}
.item.done .nm{opacity:.45;text-decoration:line-through}
.ghost{width:100%;padding:13px;border-radius:var(--r);border:1.5px dashed var(--ink3);color:var(--dim);
       font-size:14px;font-weight:500;margin-top:10px}
.danger{color:var(--red)}
.banner{background:color-mix(in srgb,var(--gold) 13%,transparent);
        border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);
        border-radius:var(--r);padding:13px;font-size:13px;line-height:1.65;margin-top:16px}
.banner b{color:var(--gold)}
#memWarn{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--red);color:#fff;
         padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;font-size:12.5px;line-height:1.6;text-align:center}
#memWarn[hidden]{display:none}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.duo .box{background:var(--ink2);border-radius:var(--r);padding:14px;text-align:center}
.duo .box .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;
             direction:ltr;line-height:1.1}
.duo .box .l{font-size:11.5px;color:var(--dim);margin-top:5px}
.duo .out .v{color:var(--mint)} .duo .inn .v{color:var(--red)}

.tabs{display:flex;gap:7px;padding:14px 0 2px;flex:none;overflow-x:auto}
.tabs button{flex:none;padding:8px 14px;border-radius:999px;background:var(--ink2);
             border:1.5px solid var(--ink3);font-size:13px;font-weight:600;color:var(--dim)}
.tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--chalk);
             background:color-mix(in srgb,var(--gold) 12%,transparent)}

.worth{text-align:center;padding:20px 0 6px}
.worth .cap{font-size:11.5px;color:var(--dim);margin-bottom:7px}
.worth .v{font-family:var(--mono);font-size:clamp(30px,10vw,40px);font-weight:600;letter-spacing:-.03em;
          direction:ltr;font-variant-numeric:tabular-nums;line-height:1}
.worth .v .cur{font-size:.4em;color:var(--dim);font-weight:400;margin-inline-start:.25em}
.worth .sub{font-size:12px;color:var(--dim);margin-top:9px}

.empty{padding:44px 20px;text-align:center;color:var(--dim)}
.empty .h{font-size:15px;font-weight:600;color:var(--chalk);margin-bottom:6px}
.empty .p{font-size:13px;line-height:1.65}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink2);border-radius:20px 20px 0 0;
       padding:20px var(--pad) calc(env(safe-area-inset-bottom) + 20px);transform:translateY(102%);
       transition:transform .24s cubic-bezier(.2,.9,.3,1);max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.sheet h2{margin:0 0 6px;font-size:16px;font-weight:600}
.sheet .lede{margin:0 0 15px;font-size:12.5px;color:var(--dim);line-height:1.65}
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:12px;border-radius:11px;background:var(--ink);
       border:1.5px solid var(--ink3);resize:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);outline:none}
.f .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;gap:7px}
.seg button{flex:1;padding:11px 4px;border-radius:11px;background:var(--ink);border:1.5px solid var(--ink3);
            font-size:13px;font-weight:600;color:var(--dim)}
.seg button[aria-pressed="true"]{border-color:var(--gold);color:var(--chalk);
            background:color-mix(in srgb,var(--gold) 12%,transparent)}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.5;padding:11px;
     background:var(--ink);border-radius:11px;border:1.5px solid var(--ink3)}
.chk input{width:19px;height:19px;flex:none;margin:1px 0 0;accent-color:var(--gold)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 0}
.kv b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.kv.big{font-size:15px}
.acts{display:flex;gap:9px;margin-top:17px}
.acts button{flex:1;padding:14px;border-radius:var(--r);font-weight:600;font-size:15px}
.acts .go{background:var(--gold);color:var(--onAcc)}
.acts .no{background:var(--ink3);color:var(--chalk)}
.acts .del{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mgrid button{padding:9px 2px;border-radius:10px;background:var(--ink);border:1.5px solid var(--ink3);
              font-size:11.5px;color:var(--dim);text-align:center}
.mgrid button.paid{border-color:var(--mint);color:var(--mint);
              background:color-mix(in srgb,var(--mint) 12%,transparent)}
.mgrid button.late{border-color:var(--red);color:var(--red)}
.mgrid button.part{border-color:var(--gold);color:var(--gold)}

#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-160%);
       z-index:60;background:var(--chalk);color:var(--ink);padding:11px 14px 13px;border-radius:8px 8px 3px 3px;
       font-size:13px;font-weight:600;box-shadow:var(--shadow);
       transition:transform .28s cubic-bezier(.2,.9,.3,1);max-width:calc(100vw - 28px);
       display:flex;align-items:center;gap:10px;white-space:nowrap}
#toast::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;
       background-image:radial-gradient(circle at 3px 4px,transparent 2.4px,var(--chalk) 2.5px);

<script>
'use strict';

/* ═══════ storage ═══════ */
const Store = (() => {
  const NAME='masareef', VER=3,
        STORES=['tx','cats','recur','meta','debt','recon','acct','plan','rent'];
  let db=null, mem=null;
  function memInit(){ mem={}; STORES.forEach(s=>mem[s]=new Map()); }
  function open(){
    return new Promise(res=>{
      let idb; try{ idb=indexedDB; }catch(e){ idb=null; }
      if(!idb){ memInit(); return res(false); }
      let done=false;
      /* slow phones can take seconds to open the database — wait generously, and if it
         opens after we gave up, move anything typed meanwhile into it and reload */
      const t=setTimeout(()=>{ if(!done){done=true;memInit();res(false);} },10000);
      let rq; try{ rq=idb.open(NAME,VER); }catch(e){ clearTimeout(t); memInit(); return res(false); }
      rq.onupgradeneeded=e=>{ const d=e.target.result;
        STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'}); }); };
      rq.onsuccess=e=>{
        if(!done){ done=true; clearTimeout(t); db=e.target.result; return res(true); }
        const late=e.target.result, tx=late.transaction(STORES,'readwrite');
        STORES.forEach(s=>mem[s].forEach(v=>tx.objectStore(s).put(v)));
        tx.oncomplete=()=>location.reload();
      };
      /* onblocked: another tab holds an older version — success follows once it closes */
      rq.onerror=()=>{ if(done)return; done=true; clearTimeout(t); memInit(); res(false); };
    });
  }
  /* ask the browser not to evict our data under storage pressure */
  async function persist(){
    try{
      if(!navigator.storage||!navigator.storage.persist) return null;
      return (await navigator.storage.persisted()) || (await navigator.storage.persist());
    }catch(e){ return null; }
  }
  /* several writes in one transaction: all land or none do.
     ops: ['put',store,value] | ['del',store,id] | ['clear',store] */
  function batch(ops){
    if(!ops.length) return Promise.resolve();
    if(!db){
      for(const [op,s,v] of ops){ if(op==='put') mem[s].set(v.id,v); else if(op==='del') mem[s].delete(v); else mem[s].clear(); }
      return Promise.resolve();
    }
    return new Promise((res,rej)=>{
      const tx=db.transaction([...new Set(ops.map(o=>o[1]))],'readwrite');
      tx.oncomplete=()=>res();
      tx.onerror=tx.onabort=()=>rej(tx.error);
      /* a bad record throws synchronously — abort so the writes queued before it don't commit */
      try{ for(const [op,s,v] of ops){ const st=tx.objectStore(s); if(op==='put') st.put(v); else if(op==='del') st.delete(v); else st.clear(); } }
      catch(e){ try{ tx.abort(); }catch(_){} rej(e); }
    });
  }
  const t=(s,m)=>db.transaction(s,m).objectStore(s);
  const all=s=>db?new Promise((res,rej)=>{const r=t(s,'readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}):Promise.resolve([...mem[s].values()]);
  const put=(s,v)=>db?new Promise((res,rej)=>{const r=t(s,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error);}):(mem[s].set(v.id,v),Promise.resolve(v));
  const del=(s,id)=>db?new Promise((res,rej)=>{const r=t(s,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}):(mem[s].delete(id),Promise.resolve());
  const clear=s=>db?new Promise((res,rej)=>{const r=t(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}):(mem[s].clear(),Promise.resolve());
  return {open,persist,batch,all,put,del,clear,get persistent(){return !!db}};
})();

/* ═══════ state ═══════ */
const S = {
  tx:[], cats:[], accts:[], recur:[], debts:[], recons:[], plans:[], rents:[],
  settings:{cur:'ج', monthBudget:0, currencies:[], lastBackup:0, mode:'simple', theme:'dark'},
  draft:{kind:'exp',amt:'',cat:null,acct:null,toAcct:null,note:'',date:null,ccy:null},
  lastCat:{exp:null,inc:null,ref:null},
  repMonth:null, filter:{cat:'',acct:'',kind:''}, search:'', walTab:'acc'
};
const PRO=()=>S.settings.mode==='pro';

const DEF_EXP=[
  {emoji:'🍽',name:'أكل وشرب',fixed:false},{emoji:'🚕',name:'مواصلات',fixed:false},
  {emoji:'🏠',name:'بيت ومعيشة',fixed:true},{emoji:'🧸',name:'الولد',fixed:false},
  {emoji:'⚡',name:'فواتير',fixed:true},{emoji:'💊',name:'صحة',fixed:false},
  {emoji:'🎮',name:'ترفيه',fixed:false},{emoji:'🛍',name:'تسوق',fixed:false},
  {emoji:'💠',name:'أخرى',fixed:false}];
const DEF_INC=[
  {emoji:'💼',name:'المرتب'},{emoji:'📈',name:'عمولات'},
  {emoji:'🏘',name:'إيجار الشقة'},{emoji:'💠',name:'دخل آخر'}];
const DEF_ACCT=[
  {emoji:'💵',name:'كاش',type:'cash'},
  {emoji:'💳',name:'فيزا',type:'bank'}];

const KINDS={
  exp:{label:'مصروف',save:'سجّل المصروف'},
  inc:{label:'دخل',save:'سجّل الدخل'},
  trf:{label:'تحويل',save:'سجّل التحويل'},
  ref:{label:'مرتجع',save:'سجّل المرتجع'}
};
const kindList=()=>PRO()?['exp','inc','trf','ref']:['exp','inc'];

/* ═══════ helpers ═══════ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const money=n=>nf.format(Math.round(n*100)/100);
const money0=n=>nf.format(Math.round(n));
const AR_DAYS=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_M3=['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];
const mKey=s=>s.slice(0,7);
const today=()=>iso(new Date());
const catOf=id=>S.cats.find(c=>c.id===id)||{id:'',emoji:'💠',name:'بدون تصنيف',kind:'exp',budget:0,fixed:false};
const acctOf=id=>S.accts.find(a=>a.id===id)||{id:'',emoji:'💠',name:'—',type:'cash',opening:0};
const catsOf=k=>S.cats.filter(c=>c.kind===(k==='ref'?'exp':k));
const liveAccts=()=>S.accts.filter(a=>!a.archived);
/* live accounts, plus the selected one even if it's closed so editing never silently moves it */
const acctOpts=sel=>{
  const list=liveAccts().slice(), own=S.accts.find(a=>a.id===sel);
  if(own&&own.archived) list.push(own);
  return list.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.emoji} ${esc(a.name)}${a.archived?' (مقفول)':''}</option>`).join('');
};
const defAcct=()=>(liveAccts().find(a=>a.type==='cash')||liveAccts()[0]||{id:''}).id;
const viaLabel=id=>{ const a=S.accts.find(x=>x.id===id); return a?`${a.emoji} ${esc(a.name)}`:''; };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ccyOf=code=>S.settings.currencies.find(c=>c.code===code);
const sortTx=()=>S.tx.sort((a,b)=> b.date.localeCompare(a.date) || b.at-a.at );

function dayLabel(s){
  const d=parseISO(s),t=new Date();t.setHours(0,0,0,0);
  const diff=Math.round((t-d)/864e5);
  if(diff===0)return 'النهاردة'; if(diff===1)return 'امبارح'; if(diff===2)return 'أول امبارح';
  return `${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]}`;
}
const monthLabel=k=>{const[y,m]=k.split('-').map(Number);return `${AR_MONTHS[m-1]} ${y}`;};
const inMonth=(k,kind)=>S.tx.filter(t=>mKey(t.date)===k && (!kind||t.kind===kind));
const sum=a=>a.reduce((s,t)=>s+t.amount,0);
/* net expense for a month = expenses minus refunds */
const expNet=k=>sum(inMonth(k,'exp'))-sum(inMonth(k,'ref'));
const incNet=k=>sum(inMonth(k,'inc'));

/* every account movement that isn't a tx: debts lent, borrowed and repaid */
const debtMoves=()=>S.debts.flatMap(debtFlows);
function balance(id){
  return S.tx.reduce((b,t)=>b+txDelta(t,id),acctOf(id).opening||0)
    +debtMoves().reduce((b,f)=>b+(f.acct===id?f.amount:0),0);
}
const netWorth=()=>liveAccts().reduce((s,a)=>s+balance(a.id),0);

function toast(html,undo){
  const t=$('#toast');
  t.innerHTML=`<span>${html}</span>`;
  if(undo){
    const b=document.createElement('button');
    b.className='undo'; b.textContent='تراجع';
    b.onclick=()=>{ t.classList.remove('on'); undo(); };
    t.appendChild(b);
  }
  t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),undo?4200:1900);
  if(navigator.vibrate) try{navigator.vibrate(12)}catch(e){}
}
function sheet(html){
  const sh=$('#sheet'); sh.innerHTML=html;
  $('#scrim').classList.add('on'); sh.classList.add('on');
  const f=sh.querySelector('input:not([type=checkbox]),select,textarea');
  if(f) setTimeout(()=>f.focus(),260);
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').addEventListener('click',closeSheet);
window.closeSheet=closeSheet;
const saveSettings=()=>Store.put('meta',{id:'settings',v:S.settings});

/* ═══════ theme ═══════ */
const mq=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t=S.settings.theme;
  const dark = t==='dark' || (t==='auto' && mq.matches);
  document.body.classList.toggle('dark',dark);
  document.body.classList.toggle('light',!dark);
  $('#themeMeta').setAttribute('content',dark?'#1A1520':'#F7F4EF');
}
mq.addEventListener('change',()=>{ if(S.settings.theme==='auto') applyTheme(); });

/* ═══════ mode ═══════ */
function applyMode(){
  const pro=PRO();
  $('#nav').className=pro?'n5':'n4';
  $('#navWal').hidden=!pro;
  buildKinds();
  if(!pro && (S.draft.kind==='trf'||S.draft.kind==='ref')) setKind('exp');
  if(!pro && $('#v-wal').classList.contains('on')) go('entry');
}

/* ═══════ boot ═══════ */
(async function boot(){
  await Store.open();
  const st=(await Store.all('meta')).find(m=>m.id==='settings');
  if(st) S.settings={...S.settings,...st.v};
  if(!Array.isArray(S.settings.currencies)) S.settings.currencies=[];
  if(!['simple','pro'].includes(S.settings.mode)) S.settings.mode='simple';
  if(!['dark','light','auto'].includes(S.settings.theme)) S.settings.theme='dark';
  applyTheme();

  S.cats=await Store.all('cats');
  S.accts=await Store.all('acct');
  S.recur=await Store.all('recur');
  S.debts=await Store.all('debt');
  S.plans=await Store.all('plan');
  S.rents=await Store.all('rent');
  S.recons=(await Store.all('recon')).sort((a,b)=>a.date.localeCompare(b.date));
  S.tx=await Store.all('tx');

  /* ── migrations ── */
  for(const c of S.cats){
    let ch=false;
    if(!c.kind){ c.kind='exp'; ch=true; }
    if(c.kind==='exp' && typeof c.fixed!=='boolean'){
      c.fixed=['فواتير','بيت ومعيشة'].includes(c.name); ch=true;
    }
    if(ch) await Store.put('cats',c);
  }
  if(!catsOf('exp').length)
    for(let i=0;i<DEF_EXP.length;i++){ const c={id:uid(),...DEF_EXP[i],kind:'exp',order:i,budget:0}; S.cats.push(c); await Store.put('cats',c); }
  if(!catsOf('inc').length)
    for(let i=0;i<DEF_INC.length;i++){ const c={id:uid(),...DEF_INC[i],kind:'inc',order:i,budget:0}; S.cats.push(c); await Store.put('cats',c); }
  S.cats.sort((a,b)=>a.order-b.order);

  if(!S.accts.length){
    for(let i=0;i<DEF_ACCT.length;i++){
      const a={id:uid(),...DEF_ACCT[i],opening:0,order:i,archived:false};
      S.accts.push(a); await Store.put('acct',a);
    }
  }
  S.accts.sort((a,b)=>a.order-b.order);
  const aCash=S.accts.find(a=>a.type==='cash')||S.accts[0];
  const aBank=S.accts.find(a=>a.type==='bank')||S.accts[S.accts.length-1];

  for(const t of S.tx){
    let ch=false;
    if(!t.kind){ t.kind='exp'; ch=true; }
    if(!t.acct){ t.acct = t.method==='card'? aBank.id : aCash.id; ch=true; }
    if(ch) await Store.put('tx',t);
  }
  sortTx();
  for(const r of S.recur){
    let ch=false;
    if(!r.kind){ r.kind='exp'; ch=true; }
    if(!r.acct){ r.acct = r.method==='card'? aBank.id : aCash.id; ch=true; }
    if(ch) await Store.put('recur',r);
  }
  for(const r of S.recons){ if(!r.acct){ r.acct=aCash.id; await Store.put('recon',r); } }

  S.lastCat.exp=catsOf('exp')[0].id;
  S.lastCat.ref=S.lastCat.exp;
  S.lastCat.inc=catsOf('inc')[0].id;
  S.draft.cat=S.lastCat.exp;
  S.draft.acct=aCash.id;
  S.draft.toAcct=aBank.id;
  S.draft.date=today();
  S.repMonth=today().slice(0,7);

  await runRecurring();
  lastDay=today();
  buildKeys(); applyMode(); renderAccts(); renderCats(); renderQuick(); renderRail(); renderReadout();

  if(!Store.persistent){ $('#memWarn').hidden=false; return; }
  persisted=await Store.persist();
  const nag=backupNag(); if(nag) setTimeout(()=>toast(nag),1200);
})();

/* null = browser can't tell us, true/false = whether our data is safe from eviction */
let persisted=null;

/* backup reminder: a month without one, or 100+ entries logged since the last */
function backupNag(){
  if(S.tx.length<=15) return '';
  const last=S.settings.lastBackup||0;
  if(Date.now()-last>30*864e5) return 'عدّى شهر من غير نسخة احتياطية';
  const n=S.tx.filter(t=>(t.at||0)>last).length;
  return n>=100?`سجّلت ${n} حركة من آخر نسخة احتياطية`:'';
}

async function runRecurring(){
  /* catch up on months the app wasn't opened in, but never more than 12 back */
  const now=new Date(), ops=[], made=[];
  for(const r of S.recur){
    const due=recurringDue(r,now);
    if(!due.length) continue;
    for(const d of due){
      const t={id:uid(),kind:r.kind||'exp',amount:r.amount,cat:r.cat,acct:r.acct,note:r.note||'',
        date:d.date,at:Date.now(),auto:1,rec:r.id};
      ops.push(['put','tx',t]); made.push(t);
    }
    const last=due[due.length-1];
    ops.push(['put','recur',(r.freq||'month')==='month'?{...r,lastMonth:last.month}:{...r,lastDate:last.date}]);
  }
  if(!ops.length) return;
  /* posting and lastMonth land together, so a crash can't double-post or skip */
  await Store.batch(ops);
  for(const [,s,v] of ops) if(s==='recur') Object.assign(S.recur.find(r=>r.id===v.id),v);
  S.tx.push(...made); sortTx();
  toast(`سُجّل <b>${made.length}</b> بند ثابت`);
}

/* PWAs stay alive in the background for days — when resumed on a new day,
   roll the draft date forward and post any fixed items that came due */
let lastDay=null;
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible' || !lastDay) return;
  const d=today(); if(d===lastDay) return;
  if(S.draft.date===lastDay) S.draft.date=d;
  lastDay=d;
  await runRecurring();
  renderRail(); renderQuick(); renderAccts(); renderReadout();
});

/* ═══════ ENTRY ═══════ */
function buildKinds(){
  const list=kindList(), box=$('#kinds');
  box.querySelectorAll('button').forEach(b=>b.remove());
  list.forEach(k=>{
    const b=document.createElement('button');

    box.insertBefore(b,$('#kInd'));
  });

}
function moveInd(){
  const list=kindList(), i=Math.max(0,list.indexOf(S.draft.kind));
  const w=100/list.length;
  $('#kInd').style.width=w+'%';
  $('#kInd').style.transform=`translateX(${-i*100}%)`;
}
function setKind(k){
  S.draft.kind=k;
  document.body.classList.remove('k-inc','k-trf','k-ref');
  if(k!=='exp') document.body.classList.add('k-'+k);
  $('#kinds').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  moveInd();
  if(k!=='trf') S.draft.cat=S.lastCat[k]||catsOf(k)[0].id;
  $('#save').textContent=KINDS[k].save;
  const trf=k==='trf';
  $('#toLbl').hidden=!trf; $('#toAccts').hidden=!trf;
  $('#cats').hidden=trf; $('#catLbl').hidden=trf||!PRO();
  $('#acctLbl').textContent=trf?'من':'الحساب';
  renderAccts(); renderCats(); renderQuick(); renderReadout();
}

function buildKeys(){
  $('#keys').innerHTML=['1','2','3','4','5','6','7','8','9','.','0','⌫']
    .map(k=>`<button class="k${k==='⌫'||k==='.'?' fn':''}" data-k="${k}">${k}</button>`).join('');
  $('#keys').addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(b) press(b.dataset.k); });
}
function press(k){
  let a=S.draft.amt;
  if(k==='⌫') a=a.slice(0,-1);
  else if(k==='.'){ if(!a.includes('.')) a=(a||'0')+'.'; }
  else{
    if(a.includes('.')&&a.split('.')[1].length>=2) return;
    if(a.replace('.','').length>=9) return;
    a=(a==='0'?k:a+k);
  }
  S.draft.amt=a; renderReadout();
  if(navigator.vibrate) try{navigator.vibrate(6)}catch(e){}
}

function renderReadout(){
  const a=S.draft.amt, el=$('#amt'), k=S.draft.kind;

  const symbol=cc?cc.symbol:S.settings.cur;

  if(k==='trf'){
    tag=`${acctOf(S.draft.acct).emoji} <b>${esc(acctOf(S.draft.acct).name)}</b> ← ${acctOf(S.draft.toAcct).emoji} <b>${esc(acctOf(S.draft.toAcct).name)}</b>`;
  }else{

/* quick-repeat chips */
function quickList(){
  const k=S.draft.kind;
  if(k==='trf'||k==='ref') return [];
  const cut=iso(new Date(Date.now()-90*864e5));
  const map=new Map();
  S.tx.filter(t=>t.kind===k && t.date>=cut && !t.auto && !t.ccy).forEach(t=>{
    const key=t.cat+'|'+t.amount+'|'+t.acct;
    const e=map.get(key)||{cat:t.cat,amount:t.amount,acct:t.acct,note:t.note,n:0,last:''};
    e.n++; if(t.date>e.last){e.last=t.date;e.note=t.note;}
    map.set(key,e);
  });
  return [...map.values()].filter(e=>e.n>=2)
    .sort((a,b)=> b.n-a.n || b.last.localeCompare(a.last)).slice(0,5);
}
function renderQuick(){
  const list=quickList(), box=$('#quick'), lbl=$('#quickLbl');
  if(!list.length){ box.hidden=true; lbl.hidden=true; return; }
  box.hidden=false; lbl.hidden=false;
  box.innerHTML=list.map((e,i)=>{
    const c=catOf(e.cat);
    return `<button class="q" data-q="${i}"><em>${c.emoji}</em><b>${money(e.amount)}</b></button>`;
  }).join('');
  box._list=list;
}
$('#quick').addEventListener('click',async e=>{
  const b=e.target.closest('[data-q]'); if(!b) return;
  const q=$('#quick')._list[+b.dataset.q]; if(!q) return;
  await commit({kind:S.draft.kind,amount:q.amount,cat:q.cat,acct:q.acct,note:q.note||'',date:today()});
});

async function commit(t){
  const rec={id:uid(),at:Date.now(),...t};
  await Store.put('tx',rec);
  const mk=mKey(rec.date), c=rec.kind==='exp'?catOf(rec.cat):null;
  const catSpent=()=>sum(inMonth(mk,'exp').filter(x=>x.cat===rec.cat))-sum(inMonth(mk,'ref').filter(x=>x.cat===rec.cat));
  const b0=c?catSpent():0, m0=c?expNet(mk):0;
  S.tx.push({...rec,_new:1}); sortTx();
  const warn=c?budgetWarn(c,b0,catSpent(),m0,expNet(mk),budgetFor(mk)):'';
  let label;
  if(rec.kind==='trf') label=`${acctOf(rec.acct).emoji}→${acctOf(rec.toAcct).emoji}`;
  else label=catOf(rec.cat).emoji;
  const sign=(rec.kind==='inc'||rec.kind==='ref')?'+':'';
  toast(`${label} <span class="a">${sign}${money(rec.amount)}</span> ${esc(S.settings.cur)}${warn}`,
    async()=>{ await Store.del('tx',rec.id); S.tx=S.tx.filter(x=>x.id!==rec.id);
      renderRail(); renderQuick(); renderAccts(); toast('اتراجعنا'); });
  renderRail(); renderQuick(); renderAccts(); renderReadout();
}

/* a line for the save toast when this expense pushed its category (or the month) past 80% / 100% of budget */
function budgetWarn(c,b0,b1,m0,m1,B){
  const line=t=>`<br><small style="color:var(--red);font-weight:600">${t}</small>`;
  const cc=budgetCross(b0,b1,c.budget);
  if(cc==='over') return line(`⚠ ${esc(c.emoji+' '+c.name)}: عدّيت الميزانية بـ ${money0(b1-c.budget)}`);
  if(cc==='near') return line(`${esc(c.emoji+' '+c.name)}: صرفت ${Math.round(b1/c.budget*100)}% من الميزانية`);
  const mc=budgetCross(m0,m1,B);
  if(mc==='over') return line(`⚠ عدّيت ميزانية الشهر بـ ${money0(m1-B)}`);
  if(mc==='near') return line(`صرفت ${Math.round(m1/B*100)}% من ميزانية الشهر`);
  return '';
}

/* reserved = planned expenses still due this month */
function reservedThisMonth(){
  const mk=today().slice(0,7);
  return S.plans.filter(p=>!p.done && mKey(p.date)===mk && p.date>=today())
                .reduce((s,p)=>s+p.amount,0);
}
function budgetFor(mk){
  const b=S.settings.monthBudget||0;
  return b===-1 ? incNet(mk) : b;
}
function renderRail(){
  const now=new Date(), mk=today().slice(0,7), cur=esc(S.settings.cur);
  $('#today').textContent=`${AR_DAYS[now.getDay()]} ${now.getDate()} ${AR_MONTHS[now.getMonth()]}`;
  const E=expNet(mk), I=incNet(mk);
  const dayT=sum(S.tx.filter(t=>t.date===today()&&t.kind==='exp'))-sum(S.tx.filter(t=>t.date===today()&&t.kind==='ref'));
  $('#todaySub').innerHTML=dayT?`النهاردة <span class="num">${money(dayT)}</span> ${cur}`:'مسجّلتش مصاريف النهاردة';

  const B=budgetFor(mk);
  if(B>0){
    const res=PRO()?reservedThisMonth():0;
    const left=B-E-res, days=dim(now.getFullYear(),now.getMonth()+1)-now.getDate()+1;
    const perDay=left/days;
    $('#mtdBox').innerHTML=`متاح النهاردة<b class="num" style="color:${perDay>=0?'var(--chalk)':'var(--red)'}">${money0(perDay)} <span style="font-size:11px;color:var(--dim)">${cur}</span></b>`;
  }else if(PRO()){
    const w=netWorth();
    $('#mtdBox').innerHTML=`إجمالي فلوسك<b class="num" style="color:${w>=0?'var(--chalk)':'var(--red)'}">${money0(w)} <span style="font-size:11px;color:var(--dim)">${cur}</span></b>`;
  }else if(I>0){
    const net=I-E;
    $('#mtdBox').innerHTML=`فاضل من الشهر<b class="num" style="color:${net>=0?'var(--mint)':'var(--red)'}">${money0(net)} <span style="font-size:11px;color:var(--dim)">${cur}</span></b>`;
  }else{
    $('#mtdBox').innerHTML=`مصاريف الشهر<b class="num">${money0(E)} <span style="font-size:11px;color:var(--dim)">${cur}</span></b>`;
  }
  renderDue();
}

/* ═══════ HISTORY ═══════ */
function matches(t,q){
  if(!q) return true;
  q=normDigits(q.trim().toLowerCase());
  return String(t.amount).includes(q) || (t.note||'').toLowerCase().includes(q)
      || catOf(t.cat).name.toLowerCase().includes(q) || acctOf(t.acct).name.toLowerCase().includes(q)
      || t.date.includes(q);
}
function renderLog(){
  let list=S.tx;
  if(S.filter.kind) list=list.filter(t=>t.kind===S.filter.kind);
  if(S.filter.cat) list=list.filter(t=>t.cat===S.filter.cat);
  if(S.filter.acct) list=list.filter(t=>t.acct===S.filter.acct||t.toAcct===S.filter.acct);
  if(S.search) list=list.filter(t=>matches(t,S.search));
  const active=S.filter.cat||S.filter.acct||S.filter.kind;
  $('#logFilter').textContent=active?'إلغاء التصفية':'تصفية';
  const tot=sum(list.filter(t=>t.kind==='exp'))-sum(list.filter(t=>t.kind==='ref'));
  $('#logSub').innerHTML=list.length
    ?`${list.length} حركة${S.search||active?` · <span class="num">${money0(tot)}</span> ${esc(S.settings.cur)} مصاريف`:''}`
    :'فاضي';

  if(!list.length){
    $('#logBody').innerHTML=`<div class="empty"><div class="h">مفيش حركات هنا</div>
      <div class="p">${S.search?'مفيش نتايج للبحث ده.':active?'مفيش نتايج للتصفية دي.':'أول حاجة تسجلها هتظهر في المكان ده.'}</div></div>`;
    return;
  }
  const g={}; list.forEach(t=>{(g[t.date]=g[t.date]||[]).push(t);});
  $('#logBody').innerHTML=Object.keys(g).sort((a,b)=>b.localeCompare(a)).map(d=>{
    const day=g[d];
    const dE=sum(day.filter(t=>t.kind==='exp'))-sum(day.filter(t=>t.kind==='ref'));
    const dI=sum(day.filter(t=>t.kind==='inc'));
    const net=dI-dE, anyInc=day.some(t=>t.kind==='inc');
    const rows=day.map(t=>{
      const isTrf=t.kind==='trf';
      const icon=isTrf?'⇄':catOf(t.cat).emoji;
      const name=isTrf?`${acctOf(t.acct).name} ← ${acctOf(t.toAcct).name}`:catOf(t.cat).name;
      const bits=[t.note, t.ccy?`${money(t.raw)} ${t.ccy}`:'', t.auto?'ثابت':'', t.kind==='ref'?'مرتجع':''].filter(Boolean);
      const cls=t.kind==='inc'||t.kind==='ref'?' plus':isTrf?' trf':'';
      const sign=t.kind==='inc'||t.kind==='ref'?'+':'';
      return `<button class="row${t._new?' print':''}" data-tx="${t.id}">
        <em>${icon}</em>
        <span class="meta"><span class="nm">${esc(name)}</span>${bits.length?`<span class="nt">${esc(bits.join(' · '))}</span>`:''}</span>
        ${isTrf?'':`<span class="pill">${esc(acctOf(t.acct).name)}</span>`}
        <span class="val${cls}">${sign}${money(t.amount)}</span></button>`;
    }).join('<div class="perf"></div>');
    const totTxt=anyInc?(net>=0?'+'+money(net):money(net)):money(dE);
    return `<div class="daygrp"><div class="dayhd"><span class="d">${dayLabel(d)}</span>
      <span class="t num"${anyInc?` style="color:${net>=0?'var(--mint)':'var(--red)'}"`:''}>${totTxt} <span style="font-size:11px;color:var(--dim)">${esc(S.settings.cur)}</span></span></div>
      <div class="roll">${rows}</div></div>`;
  }).join('');
  S.tx.forEach(t=>delete t._new);
}

  /* always offer the tx's own kind and accounts, even if hidden (simple mode / closed account),

    <div class="f"><div class="row2">
      <div><label>المبلغ (${esc(S.settings.cur)})</label><input id="eAmt" type="number" inputmode="decimal" step="0.01" value="${t.amount}"></div>
      <div><label>التاريخ</label><input id="eDate" type="date" value="${t.date}"></div>
    </div></div>
    <div class="f"><label>النوع</label><select id="eKind">${kOpts}</select></div>
    <div class="f" id="eCatWrap"${isTrf?' hidden':''}><label>التصنيف</label><select id="eCat">
      ${catsOf(t.kind==='ref'?'exp':t.kind).map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select></div>
    <div class="f"><label>${isTrf?'من حساب':'الحساب'}</label><select id="eAcct">${acctOpts(t.acct)}</select></div>
    <div class="f" id="eToWrap"${isTrf?'':' hidden'}><label>إلى حساب</label><select id="eTo">${acctOpts(t.toAcct)}</select></div>
    <div class="f"><label>ملاحظة</label><input id="eNote" maxlength="80" value="${esc(t.note||'')}"></div>
    <div class="acts"><button class="del" id="eDel">حذف</button>
      <button class="go" id="eOk">حفظ التعديل</button></div>`);
  $('#eKind').onchange=e=>{
    const k=e.target.value, trf=k==='trf';
    $('#eCatWrap').hidden=trf; $('#eToWrap').hidden=!trf;
    if(!trf) $('#eCat').innerHTML=catsOf(k==='ref'?'exp':k)
      .map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('');
  };
  $('#eOk').onclick=async()=>{
    const a=Number($('#eAmt').value); if(!(a>0)){ $('#eAmt').focus(); return; }
    const k=$('#eKind').value;
    /* validate before touching t, so a rejected edit doesn't leave memory out of sync with the DB */
    if(k==='trf' && $('#eTo').value===$('#eAcct').value){ toast('الحسابين نفس الحساب'); return; }
    /* amount is edited in base currency — the original foreign amount no longer applies */
    if(t.ccy && a!==t.amount){ delete t.ccy; delete t.raw; delete t.rate; }
    Object.assign(t,{amount:a,date:$('#eDate').value||t.date,kind:k,acct:$('#eAcct').value,
      note:$('#eNote').value.trim()});
    if(k==='trf'){ t.toAcct=$('#eTo').value; delete t.cat; }
    else { t.cat=$('#eCat').value; delete t.toAcct; }
    await Store.put('tx',t); sortTx();
    closeSheet(); renderLog(); renderRail(); renderAccts(); toast('اتعدل');
  };
  $('#eDel').onclick=async()=>{
    await Store.del('tx',t.id); S.tx=S.tx.filter(x=>x.id!==t.id);
    closeSheet(); renderLog(); renderRail(); renderAccts(); renderQuick();
    toast('اتحذف',async()=>{ await Store.put('tx',t); S.tx.push(t); sortTx();
      renderLog(); renderRail(); renderAccts(); renderQuick(); toast('رجعت'); });
  };
}

/* ═══════ anomalies ═══════ */
function anomalies(mk){
  const out=[];
  const prevs=[]; let k=mk;
  for(let i=0;i<6;i++){ k=prevMonth(k); prevs.push(k); }
  for(const c of catsOf('exp')){
    const cur=sum(inMonth(mk,'exp').filter(t=>t.cat===c.id))-sum(inMonth(mk,'ref').filter(t=>t.cat===c.id));
    if(cur<=0) continue;
    const hist=prevs.map(m=>sum(inMonth(m,'exp').filter(t=>t.cat===c.id))-sum(inMonth(m,'ref').filter(t=>t.cat===c.id)))
                    .filter(v=>v>0);
    if(hist.length<3) continue;
    const avg=hist.reduce((s,v)=>s+v,0)/hist.length;
    const pct=(cur-avg)/avg*100;
    if(pct>=35 && cur-avg>=50) out.push({c,cur,avg,pct});
  }
  return out.sort((a,b)=>b.pct-a.pct).slice(0,3);
}

function renderRep(){
  const mk=S.repMonth, cur=esc(S.settings.cur), thisM=today().slice(0,7);
  const all=inMonth(mk);
  const exp=inMonth(mk,'exp'), ref=inMonth(mk,'ref'), inc=inMonth(mk,'inc');
  const E=expNet(mk), I=incNet(mk), pE=expNet(prevMonth(mk));
  const B=budgetFor(mk);
  const [Y,M]=mk.split('-').map(Number), D=dim(Y,M);
  const isThis=mk===thisM, now=new Date();
  const dLeft=isThis?D-now.getDate()+1:0, dPast=daysElapsed(mk,now);

  const nav=`<div class="mnav">
    <button id="rNext" ${mk>=thisM?'disabled':''} aria-label="بعده">‹</button>
    <span class="lbl">${monthLabel(mk)}</span>
    <button id="rPrev" aria-label="قبله">›</button></div>`;

  if(!all.length){
    $('#repBody').innerHTML=nav+`<div class="empty"><div class="h">مفيش حركات في ${monthLabel(mk)}</div>
      <div class="p">سجّل مصروف أو دخل وهيبان هنا فوراً.</div></div>`+(PRO()?yearCard():'');

  }

  let cmp='مفيش شهر سابق للمقارنة';
  if(pE>0){
    const p=((E-pE)/pE)*100, up=p>=0;
    cmp=`المصاريف <span class="${up?'up':'down'}">${up?'▲':'▼'} <b>${Math.abs(p).toFixed(0)}%</b></span> عن ${monthLabel(prevMonth(mk))} (<span class="num">${money0(pE)}</span>)`;
  }
  const net=I-E;
  const hero = I>0
    ? `<div class="hero"><div class="cap">صافي الشهر</div>
        <div class="big ${net>=0?'pos':'neg'}">${net>=0?'+':''}${money(net)}<span class="cur">${cur}</span></div>
        <div class="legs"><span>دخل <b>${money0(I)}</b></span><span>مصاريف <b>${money0(E)}</b></span></div>
        <div class="cmp">${cmp}</div></div>`
    : `<div class="hero"><div class="cap">إجمالي المصاريف</div>
        <div class="big">${money(E)}<span class="cur">${cur}</span></div>
        <div class="cmp">${cmp}</div></div>`;

  /* anomaly alerts */
  let anom='';
  if(PRO()){
    const list=anomalies(mk);
    if(list.length) anom=`<div class="card warn"><h3>انتبه</h3>${list.map(a=>
      `<div style="font-size:13px;line-height:1.7;margin-bottom:6px">${a.c.emoji} <b>${esc(a.c.name)}</b> أعلى
       <b style="color:var(--red)">${a.pct.toFixed(0)}%</b> من متوسط الشهور اللي فاتت
       (<span class="num">${money0(a.cur)}</span> مقابل <span class="num">${money0(a.avg)}</span>)</div>`).join('')}</div>`;
  }

  const res=isThis&&PRO()?reservedThisMonth():0;
  const budCard = B>0? `<div class="card"><h3>الميزانية<button id="bEdit">تعديل</button></h3>
      <div class="bar tall${E>B?' over':''}"><i style="width:${Math.min(E/B*100,100)}%"></i></div>
      <div class="foot">صرفت <b>${money0(E)}</b> من <b>${money0(B)}</b> ${cur} — ${E<=B?`فاضل <b class="pos">${money0(B-E)}</b>`:`زيادة <b class="neg">${money0(E-B)}</b>`}
      ${res>0?`<br>محجوز <b>${money0(res)}</b> ${cur} لمصاريف قادمة`:''}
      ${isThis?`<br>${dLeft} يوم فاضل · متاح <b>${money0((B-E-res)/dLeft)}</b> ${cur} في اليوم`:''}
      <br>بالمعدل الحالي الشهر بيقفل على <b>${money0(E/dPast*D)}</b> ${cur}</div></div>`
    : `<div class="card"><h3>الميزانية</h3><div class="foot" style="margin:0">محددتش ميزانية شهرية.
        <button id="bEdit" style="color:var(--gold);font-weight:600">حدّدها</button> وهتشوف «متاح النهاردة كام».</div></div>`;

  const mx=Math.max(I,E,1), ratio=I>0?E/I*100:0;
  const ie = I>0? `<div class="card"><h3>الدخل والمصاريف</h3>
      <div class="brow"><div class="top"><span class="l"><i class="sw" style="background:var(--mint)"></i><span class="t">الدخل</span></span>
        <span class="r">${money(I)}</span></div><div class="bar mintbar"><i style="width:${I/mx*100}%"></i></div></div>
      <div class="brow"><div class="top"><span class="l"><i class="sw" style="background:var(--gold)"></i><span class="t">المصاريف</span></span>
        <span class="r">${money(E)}</span></div><div class="bar"><i style="width:${E/mx*100}%"></i></div></div>
      <div class="foot">صرفت <b>${ratio.toFixed(0)}%</b> من دخل الشهر${net>=0?` — ووفّرت <b class="pos">${money0(net)}</b> ${cur}`:` — وزيادة <b class="neg">${money0(-net)}</b> ${cur}`}</div></div>` : '';

  /* fixed vs variable */
  let fv='';
  if(E>0){
    const catNet=id=>sum(exp.filter(t=>t.cat===id))-sum(ref.filter(t=>t.cat===id));
    let F=0,V=0;
    catsOf('exp').forEach(c=>{ const v=catNet(c.id); if(v>0){ if(c.fixed) F+=v; else V+=v; } });
    const tot=F+V;
    if(tot>0) fv=`<div class="card"><h3>ملتزم مقابل اختياري<button id="fvEdit">تعديل</button></h3>
      <div class="split"><i style="width:${F/tot*100}%;background:var(--iris)"></i><i style="width:${V/tot*100}%;background:var(--gold)"></i></div>
      <div class="splegend">
        <span><i class="sw" style="background:var(--iris)"></i>ملتزم <b>${money0(F)}</b> <small style="color:var(--dim)">${(F/tot*100).toFixed(0)}%</small></span>
        <span><i class="sw" style="background:var(--gold)"></i>اختياري <b>${money0(V)}</b> <small style="color:var(--dim)">${(V/tot*100).toFixed(0)}%</small></span>
      </div>
      <div class="foot">لو ضغطت على الاختياري بالكامل تقدر توفّر لحد <b>${money0(V)}</b> ${cur} في الشهر.</div></div>`;
  }

  /* per account */
  let acc='';
  if(E>0){
    const list=liveAccts().map(a=>({a,v:sum(exp.filter(t=>t.acct===a.id))-sum(ref.filter(t=>t.acct===a.id))}))
                          .filter(x=>x.v>0).sort((x,y)=>y.v-x.v);

        <div class="bar${a.type==='bank'?' irisbar':' mintbar'}"><i style="width:${v/list[0].v*100}%"></i></div></div>`).join('')}</div>`;
  }

  function breakdown(rowsP,rowsN,total,mint){
    const by={};
    rowsP.forEach(t=>{by[t.cat]=(by[t.cat]||0)+t.amount;});
    (rowsN||[]).forEach(t=>{by[t.cat]=(by[t.cat]||0)-t.amount;});
    const list=Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    if(!list.length) return '';
    const max=list[0][1];
    return list.map(([id,v])=>{
      const c=catOf(id), pct=total?v/total*100:0;
      const hasB=!mint&&c.budget>0, over=hasB&&v>c.budget;
      return `<div class="brow">
        <div class="top"><span class="l"><em style="font-style:normal">${c.emoji}</em><span class="t">${esc(c.name)}</span>
          <span class="pct">${pct.toFixed(0)}%</span></span><span class="r">${money(v)}</span></div>
        <div class="bar${mint?' mintbar':''}${over?' over':''}"><i style="width:${hasB?Math.min(v/c.budget*100,100):v/max*100}%"></i></div>
        ${hasB?`<div class="bud${over?' over':''}">ميزانية ${money0(c.budget)} ${cur} — ${over?`زيادة ${money0(v-c.budget)}`:`فاضل ${money0(c.budget-v)}`}</div>`:''}
      </div>`;
    }).join('');
  }

  const daily=Array(D).fill(0);
  exp.forEach(t=>{daily[parseISO(t.date).getDate()-1]+=t.amount;});
  ref.forEach(t=>{daily[parseISO(t.date).getDate()-1]-=t.amount;});
  const maxD=Math.max(...daily,1), logged=daily.filter(v=>v>0).length;
  const top5=[...exp].sort((a,b)=>b.amount-a.amount).slice(0,5);

  $('#repBody').innerHTML = nav + hero + anom + budCard + ie + fv + (PRO()?acc+reconCard(mk):'') + `
    <div class="stats">
      <div class="stat"><div class="v">${money0(E/dPast)}</div><div class="l">متوسط مصروف يومي</div></div>
      <div class="stat"><div class="v">${logged}<span style="font-size:13px;color:var(--dim)"> / ${D}</span></div><div class="l">أيام فيها مصاريف</div></div>
      <div class="stat"><div class="v">${exp.length}</div><div class="l">عدد المصاريف</div></div>
      <div class="stat"><div class="v">${exp.length?money0(sum(exp)/exp.length):0}</div><div class="l">متوسط المصروف</div></div>
    </div>

    ${I>0?`<div class="card"><h3>دخلك بالتصنيف</h3>${breakdown(inc,null,I,true)}</div>`:''}
    ${E>0?`<div class="card"><h3>مصاريف يوم بيوم</h3>
      <div class="days">${daily.map(v=>`<i class="${v===maxD&&v>0?'hot':''}" style="height:${Math.max(v,0)/maxD*100}%"></i>`).join('')}</div>
      <div class="dayax"><span>1</span><span>${Math.ceil(D/2)}</span><span>${D}</span></div></div>`:''}
    ${top5.length?`<div class="card"><h3>أكبر ${top5.length} مصاريف</h3><div class="roll" style="background:transparent">
      ${top5.map(t=>{const c=catOf(t.cat);return `<div class="row" style="padding:9px 0">
        <em>${c.emoji}</em><span class="meta"><span class="nm">${esc(t.note||c.name)}</span>
        <span class="nt">${dayLabel(t.date)} · ${esc(acctOf(t.acct).name)}</span></span>
        <span class="val">${money(t.amount)}</span></div>`;}).join('<div class="perf"></div>')}
      </div></div>`:''}` + (PRO()?yearCard():'');
  bindRepNav();
  const be=$('#bEdit'); if(be) be.onclick=budgetSheet;
  const fe=$('#fvEdit'); if(fe) fe.onclick=fixedSheet;
  const rb=$('#reconBtn'); if(rb) rb.onclick=()=>reconSheet(null);
}

function yearCard(){
  const months=[]; let k=S.repMonth;
  for(let i=0;i<12;i++){ months.unshift(k); k=prevMonth(k); }
  const data=months.map(m=>({m,e:expNet(m),i:incNet(m)}));
  const max=Math.max(...data.map(d=>Math.max(d.e,d.i)),1);
  if(!data.some(d=>d.e||d.i)) return '';
  const nz=data.filter(d=>d.e>0);
  const avg=nz.length?nz.reduce((s,d)=>s+d.e,0)/nz.length:0;
  return `<div class="card"><h3>آخر ١٢ شهر</h3>
    <div class="yr">${data.map(d=>`<div class="mo${d.m===S.repMonth?' cur':''}">
      <i class="e" style="height:${Math.max(d.e,0)/max*100}%"></i><i class="i" style="height:${d.i/max*100}%"></i></div>`).join('')}</div>
    <div class="yrax">${data.map((d,i)=>`<span>${i%2===0?AR_M3[+d.m.slice(5)-1]:''}</span>`).join('')}</div>
    <div class="splegend" style="justify-content:center;gap:18px">
      <span><i class="sw" style="background:var(--gold)"></i>مصاريف</span>
      <span><i class="sw" style="background:var(--mint)"></i>دخل</span></div>
    ${avg?`<div class="foot">متوسط مصاريفك الشهري <b>${money0(avg)}</b> ${esc(S.settings.cur)}</div>`:''}</div>`;
}

/* ═══════ reconciliation ═══════ */
function lastRecon(acct){
  const l=S.recons.filter(r=>r.acct===acct);
  return l.length?l[l.length-1]:null;
}
function expectedFor(acct){
  const L=lastRecon(acct);
  if(!L) return null;
  const d=S.tx.filter(t=>afterRecon(t,L)).reduce((s,t)=>s+txDelta(t,acct),0)
    +debtMoves().filter(f=>f.acct===acct&&afterRecon(f,L)).reduce((s,f)=>s+f.amount,0);
  return {base:L.cash, from:L.date, delta:d, expected:L.cash+d};
}
function reconCard(mk){
  if(mk!==today().slice(0,7)) return '';
  const a=S.accts.find(x=>x.type==='cash'&&!x.archived);
  if(!a) return '';
  const e=expectedFor(a.id), cur=esc(S.settings.cur);
  if(!e) return `<div class="card"><h3>تسوية الكاش<button id="reconBtn">ابدأ</button></h3>
    <div class="foot" style="margin:0">اكتب الكاش اللي معاك فعلاً مرة واحدة، وبعدها أي تسوية هتوريك الفرق بين المتوقع والحقيقي — وهو اللي نسيت تسجّله.</div></div>`;
  return `<div class="card"><h3>تسوية ${esc(a.name)}<button id="reconBtn">تسوية جديدة</button></h3>
    <div class="kv"><span>آخر تسوية (${dayLabel(e.from)})</span><b>${money0(e.base)} ${cur}</b></div>
    <div class="perf"></div><div class="kv"><span>الحركة بعدها</span><b style="color:${e.delta>=0?'var(--mint)':'var(--chalk)'}">${e.delta>=0?'+':''}${money0(e.delta)}</b></div>
    <div class="perf"></div><div class="kv big"><span>المفروض معاك</span><b>${money0(e.expected)} ${cur}</b></div></div>`;
}
function reconSheet(acctId){
  const acct=acctId||(S.accts.find(x=>x.type==='cash'&&!x.archived)||liveAccts()[0]).id;
  const a=acctOf(acct), e=expectedFor(acct), cur=esc(S.settings.cur);
  const pick=liveAccts().length>1?`<div class="f"><label>الحساب</label><select id="rcAcct">
    ${liveAccts().map(x=>`<option value="${x.id}" ${x.id===acct?'selected':''}>${x.emoji} ${esc(x.name)}</option>`).join('')}</select></div>`:'';
  if(!e){
    sheet(`<h2>رصيد افتتاحي — ${esc(a.name)}</h2>
      <p class="lede">عدّ اللي معاك دلوقتي في الحساب ده واكتبه. دي نقطة البداية للتسويات الجاية.</p>
      ${pick}
      <div class="f"><label>الرصيد الحالي (${cur})</label>
        <input id="rcAmt" type="number" inputmode="decimal" step="1" placeholder="مثلاً 2500"></div>
      <div class="acts"><button class="no" onclick="closeSheet()">إلغاء</button>
        <button class="go" id="rcOk">حفظ</button></div>`);
    if($('#rcAcct')) $('#rcAcct').onchange=ev=>{ closeSheet(); setTimeout(()=>reconSheet(ev.target.value),120); };
    $('#rcOk').onclick=async()=>{
      const v=Number($('#rcAmt').value);
      if($('#rcAmt').value===''||!(v>=0)){ $('#rcAmt').focus(); return; }
      const r={id:uid(),date:today(),at:Date.now(),acct,cash:v,expected:v,diff:0};
      await Store.put('recon',r); S.recons.push(r);
      closeSheet(); renderRep(); renderWal(); toast('اتسجل الرصيد');
    };
    return;
  }
  sheet(`<h2>تسوية — ${esc(a.name)}</h2>
    <p class="lede">عدّ اللي معاك فعلاً. الفرق هو اللي نسيت تسجّله.</p>
    ${pick}
    <div class="kv"><span>المفروض معاك</span><b>${money0(e.expected)} ${cur}</b></div>
    <div class="f" style="margin-top:13px"><label>معاك فعلاً (${cur})</label>
      <input id="rcAmt" type="number" inputmode="decimal" step="1"></div>
    <div id="rcOut"></div>
    <div class="acts"><button class="no" onclick="closeSheet()">إلغاء</button>
      <button class="go" id="rcOk">حفظ التسوية</button></div>`);
  if($('#rcAcct')) $('#rcAcct').onchange=ev=>{ closeSheet(); setTimeout(()=>reconSheet(ev.target.value),120); };
  const upd=()=>{
    const v=Number($('#rcAmt').value), out=$('#rcOut');
    if($('#rcAmt').value===''||!(v>=0)){ out.innerHTML=''; return; }
    const d=v-e.expected;
    if(Math.abs(d)<0.5){ out.innerHTML=`<div class="chk" style="border-color:var(--mint)">مطابق تماماً. تسجيلك مضبوط.</div>`; return; }
    out.innerHTML=`<div class="kv"><span>${d<0?'ناقص':'زيادة'}</span><b style="color:${d<0?'var(--red)':'var(--mint)'}">${money0(Math.abs(d))} ${cur}</b></div>
      <label class="chk"><input type="checkbox" id="rcAdj" checked>
      <span>سجّل الفرق كـ${d<0?' «مصاريف مش مسجلة»':' «دخل مش مسجل»'} علشان الحساب يتظبط</span></label>
      <p class="lede" style="margin:10px 0 0">لو الفرق ده سحب من الماكينة أو تحويل، اقفل هنا وسجّله من تاب «تحويل».</p>`;
  };
  $('#rcAmt').oninput=upd;
  $('#rcOk').onclick=async()=>{
    const v=Number($('#rcAmt').value);
    if($('#rcAmt').value===''||!(v>=0)){ $('#rcAmt').focus(); return; }
    const d=v-e.expected;
    if(Math.abs(d)>=0.5 && $('#rcAdj') && $('#rcAdj').checked){
      const kind=d<0?'exp':'inc';
      const nm=kind==='exp'?'مش مسجل':'دخل مش مسجل';
      let c=S.cats.find(x=>x.kind===kind && x.name===nm);
      if(!c){ c={id:uid(),emoji:'❓',name:nm,kind,order:S.cats.length,budget:0,fixed:false};
        S.cats.push(c); await Store.put('cats',c); }
      const t={id:uid(),kind,amount:Math.abs(d),cat:c.id,acct,note:'فرق تسوية',date:today(),at:Date.now()};
      await Store.put('tx',t); S.tx.push(t); sortTx();
    }
    const r={id:uid(),date:today(),at:Date.now(),acct,cash:v,expected:e.expected,diff:d};
    await Store.put('recon',r); S.recons.push(r);
    closeSheet(); renderCats(); renderRep(); renderRail(); renderWal();
    toast(Math.abs(d)<0.5?'مطابق تماماً':`فرق <span class="a">${money0(Math.abs(d))}</span> ${cur}`);
  };
}

function walRent(){
  const cur=esc(S.settings.cur);
  if(!S.rents.length) return `<div class="empty"><div class="h">مفيش عقود إيجار</div>
      <div class="p">سجّل الشقة والساكن والإيجار الشهري، وعلّم الشهور المدفوعة — والتطبيق يحسب المتأخر.</div></div>
    <button class="ghost" id="addRent">+ عقد إيجار</button>`;
  const now=new Date();
  let due=0, coll=0;
  const cards=S.rents.map(r=>{
    const ms=months12(r.start,now);
    const overdue=m=>rentOverdue(m,r.dueDay,now);
    const late=ms.filter(m=>overdue(m) && rentLeft(r,m)>0);
    const lateAmt=late.reduce((s,m)=>s+rentLeft(r,m),0);
    due+=lateAmt;
    coll+=ms.reduce((s,m)=>s+rentPaid(r,m),0);
    return `<div class="card"><h3>${esc(r.tenant)}${r.unit?' — '+esc(r.unit):''}
        <button data-rent="${r.id}">تعديل</button></h3>
      <div class="kv"><span>الإيجار الشهري</span><b>${money0(r.amount)} ${cur}</b></div>
      <div class="perf"></div>
      <div class="kv"><span>متأخر</span><b style="color:${late.length?'var(--red)':'var(--mint)'}">${late.length? money0(lateAmt)+' '+cur+' ('+late.length+' شهر)':'لا شيء'}</b></div>
      <div class="striplbl" style="padding:14px 0 6px">علّم الشهر لما يتحصّل</div>
      <div class="mgrid">${ms.map(m=>{
        const left=rentLeft(r,m), cls=!left?'paid':left<r.amount?'part':overdue(m)?'late':'';
        return `<button class="${cls}" data-pay="${r.id}|${m}">${AR_M3[+m.slice(5)-1]}<br>${m.slice(2,4)}</button>`;
      }).join('')}</div></div>`;
  }).join('');
  return `<div class="duo">
      <div class="box out"><div class="v">${money0(coll)}</div><div class="l">محصّل (١٢ شهر)</div></div>
      <div class="box inn"><div class="v">${money0(due)}</div><div class="l">متأخر</div></div></div>
    ${cards}<button class="ghost" id="addRent">+ عقد إيجار</button><div style="height:14px"></div>`;
}
function bindWal(){

}

function acctSheet(id){
  const a=id?S.accts.find(x=>x.id===id):{emoji:'💵',name:'',type:'cash',opening:0,archived:false};
  const bal=id?balance(id):0;
  sheet(`<h2>${id?'تعديل الحساب':'حساب جديد'}</h2>
    ${id?`<p class="lede">الرصيد الحالي: <b class="num">${money(bal)} ${esc(S.settings.cur)}</b></p>`:''}
    <div class="f"><div class="row2">
      <div><label>رمز</label><input id="aE" maxlength="3" style="text-align:center;font-size:22px" value="${esc(a.emoji)}"></div>
      <div><label>الرصيد الافتتاحي</label><input id="aO" type="number" inputmode="decimal" step="0.01" value="${a.opening||0}"></div>
    </div></div>
    <div class="f"><label>الاسم</label><input id="aN" maxlength="24" placeholder="مثلاً: حساب البنك الأهلي" value="${esc(a.name)}"></div>
    <div class="f"><label>النوع</label><select id="aT">
      <option value="cash" ${a.type==='cash'?'selected':''}>كاش (بتعدّه بإيدك)</option>
      <option value="bank" ${a.type==='bank'?'selected':''}>بنك أو كارت</option></select></div>
    ${id?`<label class="chk"><input type="checkbox" id="aA" ${a.archived?'checked':''}>
      <span>اقفل الحساب — يختفي من التسجيل بس حركاته تفضل محفوظة</span></label>`:''}
    <div class="acts">
      ${id&&liveAccts().length>1?'<button class="del" id="aD">حذف</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="aOk">حفظ</button></div>`);
  $('#aOk').onclick=async()=>{
    const n=$('#aN').value.trim(); if(!n){ $('#aN').focus(); return; }
    const arch=$('#aA')?$('#aA').checked:false;
    if(arch && liveAccts().length<=1 && !a.archived){ toast('لازم يفضل حساب واحد مفتوح'); return; }
    const v={emoji:$('#aE').value.trim()||'💵',name:n,type:$('#aT').value,
             opening:Number($('#aO').value)||0, archived:arch};
    if(id){ Object.assign(a,v); await Store.put('acct',a); }
    else{ const na={id:uid(),...v,order:S.accts.length}; S.accts.push(na); await Store.put('acct',na); }
    if(!liveAccts().some(x=>x.id===S.draft.acct)) S.draft.acct=liveAccts()[0].id;
    closeSheet(); renderAccts(); renderWal(); renderRail(); toast('تم');
  };
  const d=$('#aD');
  if(d) d.onclick=async()=>{
    const used=S.tx.filter(t=>t.acct===id||t.toAcct===id).length+debtMoves().filter(f=>f.acct===id).length;
    if(used){ toast(`فيه ${used} حركة على الحساب ده — اقفله بدل ما تحذفه`); return; }
    await Store.del('acct',id); S.accts=S.accts.filter(x=>x.id!==id);
    if(S.draft.acct===id) S.draft.acct=liveAccts()[0].id;
    closeSheet(); renderAccts(); renderWal(); toast('اتحذف');
  };
}

function debtSheet(id){
  const d=id?S.debts.find(x=>x.id===id):{person:'',amount:'',dir:'out',date:today(),due:'',note:'',acct:defAcct()};
  sheet(`<h2>${id?'تفاصيل السلفة':'سلفة جديدة'}</h2>
    <div class="f"><label>النوع</label><select id="dDir">
      <option value="out" ${d.dir==='out'?'selected':''}>أنا سلّفت — ليّ عنده</option>
      <option value="in" ${d.dir==='in'?'selected':''}>أنا استلفت — عليّ له</option></select></div>
    <div class="f"><label>الاسم</label><input id="dP" maxlength="40" placeholder="مثلاً: أحمد" value="${esc(d.person)}"></div>
    <div class="f"><div class="row2">
      <div><label>المبلغ</label><input id="dA" type="number" inputmode="decimal" step="0.01" value="${d.amount}"></div>
      <div><label>التاريخ</label><input id="dD" type="date" value="${d.date}"></div>
    </div></div>
    <div class="f"><label id="dVl">${d.dir==='in'?'استلمتها':'اديتها'} عن طريق</label><select id="dV">
      ${acctOpts(d.acct)}<option value="" ${d.acct?'':'selected'}>بدون حساب — مش بيأثر على الرصيد</option></select></div>
    <div class="f"><label>موعد السداد (اختياري)</label><input id="dU" type="date" value="${d.due||''}"></div>
    <div class="f"><label>ملاحظة</label><input id="dN" maxlength="60" value="${esc(d.note||'')}"></div>
    ${id&&(d.pays||[]).length?`<div class="striplbl" style="padding:4px 0 6px">دفعات (${money0(debtPaid(d))} من ${money0(d.amount)})</div>
      ${d.pays.map((p,i)=>`<div class="kv"><span>${dayLabel(p.date)}${p.acct?' · '+viaLabel(p.acct):''}</span><b>${money0(p.amount)} ${esc(S.settings.cur)}
        <button data-dp="${i}" aria-label="امسح الدفعة" style="color:var(--red);padding:0 6px">✕</button></b></div>`).join('<div class="perf"></div>')}`:''}
    ${id?`<div class="acts"><button class="del" id="dDel">حذف</button>
      <button class="go" id="dSet">${d.settledAt?'رجّعها غير مسدّدة':'تم السداد'}</button></div>
      <div class="acts" style="margin-top:9px">${d.settledAt?'':'<button class="no" id="dPart">سداد جزء</button>'}<button class="no" id="dOk">حفظ التعديل</button></div>`
    :`<div class="acts"><button class="no" onclick="closeSheet()">إلغاء</button>
      <button class="go" id="dOk">حفظ</button></div>`}`);
  $('#dDir').onchange=e=>{ $('#dVl').textContent=(e.target.value==='in'?'استلمتها':'اديتها')+' عن طريق'; };
  $('#dOk').onclick=async()=>{
    const a=Number($('#dA').value), p=$('#dP').value.trim();
    if(!p){ $('#dP').focus(); return; }
    if(!(a>0)){ $('#dA').focus(); return; }
    const v={person:p,amount:a,dir:$('#dDir').value,date:$('#dD').value||today(),
      due:$('#dU').value||'',note:$('#dN').value.trim(),acct:$('#dV').value};
    if(id){ Object.assign(d,v); if(!d.settledAt && debtPaid(d)>=d.amount) d.settledAt=today(); await Store.put('debt',d); }
    else{ const nd={id:uid(),...v,at:Date.now(),settledAt:'',pays:[]}; S.debts.push(nd); await Store.put('debt',nd); }
    closeSheet(); debtChanged(); toast(!id&&v.acct?`تم — ${v.dir==='out'?'اتخصم من':'اتضاف لـ'} ${esc(acctOf(v.acct).name)}`:'تم');
  };
  const ds=$('#dSet');
  if(ds) ds.onclick=async()=>{
    if(d.settledAt){
      d.settledAt='';
      /* if the last payment is what closed it, reopening takes that payment back */
      if(debtPaid(d)>=d.amount && (d.pays||[]).length) d.pays=d.pays.slice(0,-1);
      await Store.put('debt',d);
      closeSheet(); debtChanged(); toast('رجعت غير مسدّدة'); return;
    }
    /* settling records the remainder as a payment, so we know how it came back */
    closeSheet(); setTimeout(()=>debtPaySheet(id,true),120); };
  $('#sheet').querySelectorAll('[data-dp]').forEach(x=>x.onclick=async()=>{
    d.pays=d.pays.filter((_,i)=>i!==+x.dataset.dp);
    if(d.settledAt && debtPaid(d)<d.amount) d.settledAt='';
    await Store.put('debt',d); closeSheet(); debtChanged(); toast('اتمسحت الدفعة');
    setTimeout(()=>debtSheet(id),120);
  });
  const dp=$('#dPart');
  if(dp) dp.onclick=()=>{ closeSheet(); setTimeout(()=>debtPaySheet(id),120); };
  const dd=$('#dDel');
  if(dd) dd.onclick=async()=>{ if(!confirm(debtFlows(d).length?'حذف السلفة دي؟ الرصيد هيرجع كأنها متسجلتش.':'حذف السلفة دي؟')) return;
    await Store.del('debt',id); S.debts=S.debts.filter(x=>x.id!==id);
    closeSheet(); debtChanged(); toast('اتحذف'); };
}
function debtChanged(){ renderAccts(); renderRail(); renderWal();
}

function debtPaySheet(id,full){
  const d=S.debts.find(x=>x.id===id); if(!d) return;
  const left=debtLeft(d), cur=esc(S.settings.cur);
  sheet(`<h2>${full?'تم السداد':'سداد جزء'} — ${esc(d.person)}</h2>
    <p class="lede">${full?(d.dir==='out'?'رجّع لك الباقي':'رجّعت الباقي'):(d.dir==='out'?'رجّع لك جزء من السلفة':'رجّعت جزء من اللي عليك')}.</p>
    <div class="kv big"><span>فاضل</span><b>${money(left)} ${cur}</b></div>
    <div class="f" style="margin-top:14px"><div class="row2">
      <div><label>المبلغ</label><input id="ppA" type="number" inputmode="decimal" step="0.01" placeholder="${left}" value="${full?Math.round(left*100)/100:''}"></div>
      <div><label>التاريخ</label><input id="ppD" type="date" value="${today()}"></div>
    </div></div>
    <div class="f"><label>${d.dir==='out'?'استلمتها':'دفعتها'} عن طريق</label><select id="ppV">${acctOpts(d.acct)}<option value="" ${d.acct?'':'selected'}>بدون حساب — مش بيأثر على الرصيد</option></select></div>
    <div class="acts"><button class="no" onclick="closeSheet()">إلغاء</button><button class="go" id="ppOk">سجّل</button></div>`);
  $('#ppOk').onclick=async()=>{
    const a=Number($('#ppA').value);
    if(!(a>0) || a>left+0.005){ $('#ppA').focus(); return toast(`المبلغ لازم يكون أكبر من 0 ولحد ${money(left)}`); }
    const date=$('#ppD').value||today();
    const via=$('#ppV').value;
    d.pays=[...(d.pays||[]),{date,amount:a,acct:via,at:Date.now()}];
    if(debtPaid(d)>=d.amount-0.005) d.settledAt=date;
    await Store.put('debt',d);
    closeSheet(); debtChanged();
    toast((d.settledAt?'اتسددت بالكامل':`فاضل ${money0(debtLeft(d))} ${cur}`)
      +(via?` · ${d.dir==='out'?'اتضاف لـ':'اتخصم من'} ${esc(acctOf(via).name)}`:''));
  };
}

function togglePay(key){
  const [id,m]=key.split('|');
  const r=S.rents.find(x=>x.id===id); if(!r) return;
  const cur=esc(S.settings.cur), got=rentPaid(r,m), left=r.amount-got;
  const head=`<h2>إيجار ${monthLabel(m)}</h2><p class="lede">${esc(r.tenant)}${r.unit?' — '+esc(r.unit):''}</p>`;
  const unmark=async()=>{
    r.paid=(r.paid||[]).filter(x=>x!==m);
    if(r.part) delete r.part[m];
    await Store.put('rent',r); closeSheet(); renderWal(); toast('اترجع غير محصّل');
  };
  if(!left){
    sheet(`${head}<div class="kv big"><span>اتحصّل بالكامل</span><b style="color:var(--mint)">${money(r.amount)} ${cur}</b></div>
      <div class="acts"><button class="del" id="ryUn">رجّعه غير محصّل</button><button class="no" onclick="closeSheet()">تمام</button></div>`);
    $('#ryUn').onclick=unmark;
    return;
  }
  sheet(`${head}
    ${got?`<div class="kv"><span>اتحصّل قبل كده</span><b style="color:var(--mint)">${money(got)} ${cur}</b></div><div class="perf"></div>`:''}
    <div class="kv big"><span>فاضل</span><b>${money(left)} ${cur}</b></div>
    <div class="f" style="margin-top:14px"><label>المبلغ اللي استلمته</label>
      <input id="ryAmt" type="number" inputmode="decimal" step="0.01" value="${left}"></div>
    <div class="f"><label>استلمته في أنهي حساب؟</label><select id="ryAcct">
      ${liveAccts().map(a=>`<option value="${a.id}">${a.emoji} ${esc(a.name)}</option>`).join('')}</select></div>
    <label class="chk"><input type="checkbox" id="ryRec" checked><span>سجّله دخل في الحساب ده</span></label>
    <div class="acts">${got?'<button class="del" id="ryUn">امسح المحصّل</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="ryOk">سجّل</button></div>`);
  if($('#ryUn')) $('#ryUn').onclick=unmark;
  $('#ryOk').onclick=async()=>{
    const a=Number($('#ryAmt').value);
    if(!(a>0) || a>left+0.005){ $('#ryAmt').focus(); return toast(`المبلغ لازم يكون أكبر من 0 ولحد ${money(left)}`); }
    const acct=$('#ryAcct').value, rec=$('#ryRec').checked, full=a>=left-0.005;
    if(full){ r.paid=[...(r.paid||[]).filter(x=>x!==m),m]; if(r.part) delete r.part[m]; }
    else r.part={...(r.part||{}),[m]:got+a};
    await Store.put('rent',r);
    closeSheet(); renderWal();
    if(rec) await commit({kind:'inc',amount:a,cat:r.cat,acct,
      note:`إيجار ${monthLabel(m)} — ${r.tenant}${full&&!got?'':' (جزء)'}`,date:rentDueDate(r,m)});
    else toast(full?'اتحصّل بالكامل':`اتحصّل ${money0(got+a)} من ${money0(r.amount)}`);
    renderWal();
  };
}
