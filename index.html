    toast(PRO()?'الوضع الاحترافي':'الوضع البسيط');
  });
  $('#themeSeg').querySelectorAll('[data-th]').forEach(x=>x.onclick=async()=>{
    S.settings.theme=x.dataset.th; await saveSettings(); applyTheme(); renderSet();
  });
  $('#budBtn').onclick=budgetSheet;
  $('#fvBtn').onclick=fixedSheet;
  $('#setCur').onchange=async e=>{
    S.settings.cur=e.target.value.trim()||'ج'; await saveSettings();
    renderRail(); renderReadout(); renderSet(); toast('اتحدثت العملة');
  };
  const sb=$('#setBody');
  sb.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>catSheet(null,x.dataset.add));
  sb.querySelectorAll('[data-ec]').forEach(x=>x.onclick=()=>catSheet(x.dataset.ec));
  sb.querySelectorAll('[data-er]').forEach(x=>x.onclick=()=>recSheet(x.dataset.er));
  sb.querySelectorAll('[data-ccy]').forEach(x=>x.onclick=()=>ccySheet(+x.dataset.ccy));
  sb.querySelectorAll('[data-sa]').forEach(x=>x.onclick=()=>acctSheet(x.dataset.sa));
  if($('#addAcc2')) $('#addAcc2').onclick=()=>acctSheet(null);
  $('#addRec').onclick=()=>recSheet(null);
  if($('#addCcy')) $('#addCcy').onclick=()=>ccySheet(-1);
  $('#expCsv').onclick=exportCsv;
  $('#expJson').onclick=exportJson;
  $('#impJson').onclick=importJson;
  $('#wipe').onclick=wipe;
}

function ccySheet(i){
  const c=i>=0?S.settings.currencies[i]:{code:'',symbol:'',rate:''};
  sheet(`<h2>${i>=0?'تعديل العملة':'عملة إضافية'}</h2>
    <p class="lede">السعر بتحدده بنفسك وبيفضل ثابت. عدّله كل فترة.</p>
    <div class="f"><div class="row3">
      <div><label>الكود</label><input id="yC" maxlength="4" placeholder="EUR" value="${esc(c.code)}" style="text-transform:uppercase"></div>
      <div><label>الرمز</label><input id="yS" maxlength="3" placeholder="€" value="${esc(c.symbol)}"></div>
      <div><label>= كام ${esc(S.settings.cur)}</label><input id="yR" type="number" inputmode="decimal" step="0.01" value="${c.rate}"></div>
    </div></div>
    <div class="acts">
      ${i>=0?'<button class="del" id="yD">حذف</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="yOk">حفظ</button></div>`);
  $('#yOk').onclick=async()=>{
    const code=$('#yC').value.trim().toUpperCase(), sym=$('#yS').value.trim()||code, r=Number($('#yR').value);
    if(!code){ $('#yC').focus(); return; }
    if(!(r>0)){ $('#yR').focus(); return; }
    const v={code,symbol:sym,rate:r};
    if(i>=0) S.settings.currencies[i]=v; else S.settings.currencies.push(v);
    await saveSettings(); closeSheet(); renderSet(); renderReadout(); toast('تم');
  };
  const d=$('#yD');
  if(d) d.onclick=async()=>{ S.settings.currencies.splice(i,1);
    if(S.draft.ccy&&!ccyOf(S.draft.ccy)) S.draft.ccy=null;
    await saveSettings(); closeSheet(); renderSet(); renderReadout(); toast('اتحذفت'); };
}

function catSheet(id,kind){
  const c=id?S.cats.find(x=>x.id===id):{emoji:'💠',name:'',budget:0,kind,fixed:false};
  const k=c.kind;
  sheet(`<h2>${id?'تعديل التصنيف':(k==='inc'?'تصنيف دخل جديد':'تصنيف مصروف جديد')}</h2>
    <div class="f"><div class="row2">
      <div><label>رمز</label><input id="cE" maxlength="3" style="text-align:center;font-size:22px" value="${esc(c.emoji)}"></div>
      ${k==='exp'?`<div><label>ميزانية شهرية (0 = بدون)</label><input id="cB" type="number" inputmode="decimal" min="0" step="1" value="${c.budget||0}"></div>`:'<div></div>'}
    </div></div>
    <div class="f"><label>الاسم</label><input id="cN" maxlength="24" placeholder="${k==='inc'?'مثلاً: إيجار الشقة':'مثلاً: صيانة العربية'}" value="${esc(c.name)}"></div>
    ${k==='exp'?`<label class="chk"><input type="checkbox" id="cF" ${c.fixed?'checked':''}>
      <span>مصروف ملتزم بيه (إيجار، فواتير، قسط) — مش اختياري</span></label>`:''}
    <div class="acts">
      ${id&&catsOf(k).length>1?'<button class="del" id="cD">حذف</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="cOk">حفظ</button></div>`);
  $('#cOk').onclick=async()=>{
    const n=$('#cN').value.trim(); if(!n){$('#cN').focus();return;}
    const v={emoji:$('#cE').value.trim()||'💠',name:n,
      budget:$('#cB')?Number($('#cB').value)||0:0, fixed:$('#cF')?$('#cF').checked:false};
    if(id){ Object.assign(c,v); await Store.put('cats',c); }
    else{ const nc={id:uid(),...v,kind:k,order:S.cats.length}; S.cats.push(nc); await Store.put('cats',nc); }
    closeSheet(); renderCats(); renderSet(); renderReadout(); toast('تم');
  };
  const d=$('#cD');
  if(d) d.onclick=async()=>{
    const used=S.tx.filter(t=>t.cat===id).length;
    if(used&&!confirm(`فيه ${used} حركة على التصنيف ده. تحذفه برضه؟`)) return;
    await Store.del('cats',id); S.cats=S.cats.filter(x=>x.id!==id);
    if(S.draft.cat===id) S.draft.cat=catsOf(S.draft.kind)[0].id;
    closeSheet(); renderCats(); renderQuick(); renderSet(); renderReadout(); toast('اتحذف');
  };
}

const freqLabel=r=>r.freq==='week'?`كل ${AR_DAYS[r.dow|0]}`
  :r.freq==='year'?`كل سنة ${r.day} ${AR_MONTHS[(r.mon||1)-1]}`:`شهري يوم ${r.day}`;
function recSheet(id){
  const r=id?S.recur.find(x=>x.id===id)
    :{kind:'exp',amount:'',cat:catsOf('exp')[0].id,acct:liveAccts()[0].id,note:'',freq:'month',day:1,dow:new Date().getDay(),mon:new Date().getMonth()+1};
  const f=r.freq||'month';
  sheet(`<h2>${id?'تعديل بند ثابت':'بند ثابت جديد'}</h2>
    <div class="f"><div class="row2">
      <div><label>النوع</label><select id="rK">
        <option value="exp" ${r.kind==='exp'?'selected':''}>مصروف ثابت</option>
        <option value="inc" ${r.kind==='inc'?'selected':''}>دخل ثابت</option></select></div>
      <div><label>بيتكرر</label><select id="rF">
        <option value="week" ${f==='week'?'selected':''}>كل أسبوع</option>
        <option value="month" ${f==='month'?'selected':''}>كل شهر</option>
        <option value="year" ${f==='year'?'selected':''}>كل سنة</option></select></div>
    </div></div>
    <div class="f"><div class="row2">
      <div><label>المبلغ</label><input id="rA" type="number" inputmode="decimal" step="0.01" value="${r.amount}"></div>
      <div id="rDw"><label>اليوم</label><input id="rD" type="number" min="1" max="31" value="${r.day||1}"></div>
      <div id="rWw"><label>يوم الأسبوع</label><select id="rW">
        ${AR_DAYS.map((d,i)=>`<option value="${i}" ${i===(r.dow|0)?'selected':''}>${d}</option>`).join('')}</select></div>
    </div></div>
    <div class="f" id="rMw"><label>الشهر</label><select id="rMo">
      ${AR_MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===(r.mon||1)?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="f"><label>الوصف</label><input id="rN" maxlength="40" placeholder="مثلاً: مرتب الشهر" value="${esc(r.note||'')}"></div>
    <div class="f"><label>التصنيف</label><select id="rC">
      ${catsOf(r.kind).map(c=>`<option value="${c.id}" ${c.id===r.cat?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select></div>
    <div class="f"><label>الحساب</label><select id="rM">
      ${liveAccts().map(a=>`<option value="${a.id}" ${a.id===r.acct?'selected':''}>${a.emoji} ${esc(a.name)}</option>`).join('')}</select></div>
    <div class="acts">
      ${id?'<button class="del" id="rDel">حذف</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="rOk">حفظ</button></div>`);
  const showF=()=>{ const v=$('#rF').value;
    $('#rDw').hidden=v==='week'; $('#rWw').hidden=v!=='week'; $('#rMw').hidden=v!=='year'; };
  $('#rF').onchange=showF; showF();
  $('#rK').onchange=e=>{
    $('#rC').innerHTML=catsOf(e.target.value).map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('');
  };
  $('#rOk').onclick=async()=>{
    const a=Number($('#rA').value); if(!(a>0)){$('#rA').focus();return;}
    const nf=$('#rF').value;
    const v={kind:$('#rK').value,amount:a,freq:nf,day:Math.min(31,Math.max(1,Number($('#rD').value)||1)),
      dow:+$('#rW').value,mon:+$('#rMo').value,note:$('#rN').value.trim(),cat:$('#rC').value,acct:$('#rM').value};
    /* a changed schedule starts fresh, without re-posting what the old one already posted */
    const posted=k=>!!id&&S.tx.some(t=>t.rec===id&&t.date.startsWith(k));
    const fresh=nf==='month'
      ? {lastMonth:posted(mKey(today()))?mKey(today()):''}
      : {lastDate:'',since:posted(today())?iso(addDays(new Date(),1)):today()};
    if(id){ if(nf!==f) Object.assign(r,fresh); Object.assign(r,v); await Store.put('recur',r); }
    else{ const nr={id:uid(),...v,...fresh}; S.recur.push(nr); await Store.put('recur',nr); }
    closeSheet(); await runRecurring(); renderSet(); renderRail(); toast('تم');
  };
  const d=$('#rDel');
  if(d) d.onclick=async()=>{ await Store.del('recur',id); S.recur=S.recur.filter(x=>x.id!==id);
    closeSheet(); renderSet(); toast('اتحذف'); };
}

/* ═══════ data in / out ═══════ */
function download(name,text,type){
  const b=new Blob(['\ufeff'+text],{type}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function exportCsv(){
  if(!S.tx.length) return toast('مفيش بيانات للتصدير');
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['التاريخ','النوع','التصنيف','الحساب','إلى حساب','المبلغ','العملة الأصلية','المبلغ الأصلي','ملاحظة'].map(q).join(',');
  const val=t=>t.kind==='inc'||t.kind==='ref'?t.amount:t.kind==='trf'?0:-t.amount;
  const body=[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>
    [t.date,KINDS[t.kind].label,t.kind==='trf'?'':catOf(t.cat).name,acctOf(t.acct).name,
     t.toAcct?acctOf(t.toAcct).name:'',val(t),t.ccy||'',t.raw||'',t.note||''].map(q).join(',')).join('\n');
  let csv=head+'\n'+body;
  csv+='\n\n'+['الحسابات','الاسم','النوع','الرصيد'].map(q).join(',')+'\n'+
       S.accts.map(a=>['',a.name,a.type==='cash'?'كاش':'بنك',balance(a.id)].map(q).join(',')).join('\n');
  if(S.debts.length)
    csv+='\n\n'+['السلف','الاسم','الاتجاه','المبلغ','التاريخ','موعد السداد','سُدّدت','ملاحظة','المسدّد','الطريقة','طرق السداد'].map(q).join(',')+'\n'+
      S.debts.map(d=>['',d.person,d.dir==='out'?'ليّ عنده':'عليّ له',d.amount,d.date,d.due||'',d.settledAt||'',d.note||'',debtPaid(d)||'',d.acct?acctOf(d.acct).name:'',
        [...new Set((d.pays||[]).filter(p=>p.acct).map(p=>acctOf(p.acct).name))].join(' / ')].map(q).join(',')).join('\n');
  if(S.rents.length)
    csv+='\n\n'+['الإيجارات','الساكن','الوحدة','الإيجار','شهور محصّلة','محصّل جزئياً'].map(q).join(',')+'\n'+
      S.rents.map(r=>['',r.tenant,r.unit||'',r.amount,(r.paid||[]).join(' '),
        Object.entries(r.part||{}).map(([m,v])=>`${m} (${v})`).join(' ')].map(q).join(',')).join('\n');
  download(`masareef-${today()}.csv`,csv,'text/csv;charset=utf-8');
  toast('اتصدر ملف CSV');
}
const backupJson=()=>JSON.stringify({v:4,at:new Date().toISOString(),settings:S.settings,cats:S.cats,acct:S.accts,
  tx:S.tx,recur:S.recur,debt:S.debts,recon:S.recons,plan:S.plans,rent:S.rents});
async function exportJson(){
  const name=`masareef-backup-${today()}.json`, text=backupJson();
  /* on phones the share sheet saves straight to Files / Drive / WhatsApp */
  let file=null;
  try{ file=new File([text],name,{type:'application/json'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:name}); }
    catch(e){ if(e.name==='AbortError') return; download(name,text,'application/json'); }
  } else download(name,text,'application/json');
  S.settings.lastBackup=Date.now(); await saveSettings();
  renderSet(); toast('النسخة الاحتياطية جاهزة');
}
function importJson(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=async()=>{
    const f=i.files[0]; if(!f) return;
    let d;
    try{ d=JSON.parse(await f.text()); }catch(e){ return toast('الملف مش صالح'); }
    if(checkBackup(d)) return toast('الملف مش صالح');
    if(!confirm('الاسترجاع هيمسح البيانات الحالية ويحل مكانها. هنحفظلك نسخة من بياناتك الحالية الأول. تكمل؟')) return;
    if(S.tx.length) download(`masareef-before-restore-${today()}.json`,backupJson(),'application/json');

    let accts=d.acct||[];
    if(!accts.length) accts=DEF_ACCT.map((a,i)=>({id:uid(),...a,opening:0,order:i,archived:false}));
    const aCash=accts.find(a=>a.type==='cash')||accts[0];
    const aBank=accts.find(a=>a.type==='bank')||accts[accts.length-1];
    for(const c of d.cats){ if(!c.kind)c.kind='exp'; if(c.kind==='exp'&&typeof c.fixed!=='boolean') c.fixed=false; }
    for(const t of d.tx){ if(!t.kind)t.kind='exp'; delete t._new; if(!t.acct) t.acct=t.method==='card'?aBank.id:aCash.id; }
    for(const r of (d.recur||[])){ if(!r.kind)r.kind='exp'; if(!r.acct) r.acct=r.method==='card'?aBank.id:aCash.id; }
    for(const x of (d.recon||[])) if(!x.acct) x.acct=aCash.id;
    const settings={...S.settings,...(d.settings||{})};
    if(!Array.isArray(settings.currencies)) settings.currencies=[];

    /* one transaction: either the whole backup lands or the current data stays untouched */
    const lists={tx:d.tx,cats:d.cats,recur:d.recur||[],debt:d.debt||[],recon:d.recon||[],acct:accts,plan:d.plan||[],rent:d.rent||[]};
    const ops=Object.keys(lists).map(k=>['clear',k]);
    for(const k in lists) for(const x of lists[k]) ops.push(['put',k,x]);
    ops.push(['put','meta',{id:'settings',v:settings}]);
    try{ await Store.batch(ops); }catch(e){ return toast('الاسترجاع فشل — بياناتك زي ما هي'); }

    S.settings=settings;
    S.accts=accts.slice().sort((a,b)=>a.order-b.order);
    S.cats=d.cats.slice().sort((a,b)=>a.order-b.order);
    S.tx=d.tx.slice(); sortTx();
    S.recur=lists.recur; S.debts=lists.debt; S.plans=lists.plan; S.rents=lists.rent;
    S.recons=lists.recon.slice().sort((a,b)=>a.date.localeCompare(b.date));
    S.lastCat.exp=catsOf('exp')[0]&&catsOf('exp')[0].id;
    S.lastCat.ref=S.lastCat.exp;
    S.lastCat.inc=catsOf('inc')[0]&&catsOf('inc')[0].id;
    S.draft.cat=S.lastCat[S.draft.kind==='trf'?'exp':S.draft.kind];
    S.draft.acct=liveAccts()[0].id;
    S.draft.toAcct=(liveAccts()[1]||liveAccts()[0]).id;
    applyTheme(); applyMode();
    renderAccts(); renderCats(); renderQuick(); renderSet(); renderRail(); renderReadout();
    toast('اترجعت البيانات');
  };
  i.click();
}
async function wipe(){
  if(!confirm('حذف كل الحركات؟ الحسابات والتصنيفات والبنود الثابتة والسلف هتفضل زي ما هي.')) return;
  const recur=S.recur.map(r=>({...r,lastMonth:'',lastDate:'',since:today()}));
  await Store.batch([['clear','tx'],['clear','recon'],...recur.map(r=>['put','recur',r])]);
  S.tx=[]; S.recons=[]; S.recur=recur;
  renderSet(); renderRail(); renderQuick(); renderAccts(); toast('اتمسحت كل الحركات');
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
