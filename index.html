<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>قرش أبيض</title>
<meta name="theme-color" content="#0B0E11" id="themeMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="قرش أبيض">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── theme tokens ───────────────────────────────── */
:root, body.dark{
  --ink:#0B0E11; --ink2:#15191E; --ink3:#232930; --tile:#1D2228;
  --line:rgba(255,255,255,.07); --lift:none;
  --chalk:#F1F4F6; --dim:#8B949D;
  --brand:#10B981; --mint:#22C55E; --iris:#3B82F6; --red:#F05252;
  --onAcc:#FFFFFF; --shadow:0 12px 32px rgba(0,0,0,.55);
  --scrim:rgba(4,6,8,.72);
}
body.light{
  --ink:#F2F4F6; --ink2:#FFFFFF; --ink3:#E6E9ED; --tile:#F2F4F6;
  --line:rgba(15,23,42,.07); --lift:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05);
  --chalk:#0F1720; --dim:#69737D;
  --brand:#059669; --mint:#16A34A; --iris:#2563EB; --red:#DC2626;
  --onAcc:#FFFFFF; --shadow:0 12px 32px rgba(15,23,42,.16);
  --scrim:rgba(15,23,42,.45);
}
:root{
  --ar:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:var(--ar);
  --pad:16px; --r:16px; --accent:var(--brand);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
/* the gradient card behind the amount — one per entry kind */
:root{--gradBrand:linear-gradient(135deg,#047857 0%,#10B981 62%,#34D399 100%);--grad:var(--gradBrand)}
body.k-inc{--accent:var(--mint);--grad:linear-gradient(135deg,#15803D 0%,#22C55E 60%,#86EFAC 100%)}
body.k-trf{--accent:var(--iris);--grad:linear-gradient(135deg,#1D4ED8 0%,#3B82F6 60%,#93C5FD 100%)}
body.k-ref{--accent:var(--mint);--grad:linear-gradient(135deg,#0F766E 0%,#14B8A6 60%,#5EEAD4 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--chalk);font-family:var(--ar);font-size:15px;line-height:1.5;
     -webkit-font-smoothing:antialiased;overscroll-behavior:none;
     transition:background .2s,color .2s}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--chalk)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
/* hairline between rows, starting after the icon tile */
.perf{height:1px;background:var(--line);margin-inline-start:63px}
/* every raised surface: hairline edge, soft lift in light mode */
.roll,.card,.list,.stat,.duo .box{border:1px solid var(--line);box-shadow:var(--lift)}
.noscroll::-webkit-scrollbar{display:none}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
[hidden]{display:none!important}

/* pinned to the screen's edges rather than «100% tall»: after the keyboard closes, iPhone home-screen
   apps can be left with a shorter 100%, which cut the save button off under the tab bar */
#app{display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;height:var(--appH,100%);max-width:520px;margin:0 auto}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.scroll{padding:0 var(--pad) 26px}

.rail{display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:calc(var(--sat) + 14px) var(--pad) 12px;flex:none}
.rail h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.rail .sub{font-size:12px;color:var(--dim);font-weight:400;margin-top:1px}
.rail .mtd{font-size:11px;color:var(--dim);text-align:end;flex:none;line-height:1.35;
           background:var(--ink2);border:1px solid var(--line);box-shadow:var(--lift);border-radius:12px;padding:7px 11px}
.rail .mtd b{display:block;color:var(--chalk);font-weight:600;font-size:15px;margin-top:1px;font-variant-numeric:tabular-nums}
.rail .act{font-size:12.5px;color:var(--brand);font-weight:600;padding:6px 11px;border-radius:999px;
           background:color-mix(in srgb,var(--brand) 12%,transparent)}
.rail .duebtn{display:block;font-size:11.5px;font-weight:600;color:var(--brand);margin-top:3px;text-align:start}
.rail .duebtn.late{color:var(--red)}
.rail .duebtn[hidden]{display:none}

.kinds{display:flex;flex:none;position:relative;margin:2px var(--pad) 0;padding:4px;border-radius:13px;
        background:var(--ink3);border:0}
.kinds button{flex:1;padding:8px 2px;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;
              position:relative;z-index:1;transition:color .2s}
.kinds button[aria-pressed="true"]{color:var(--chalk)}
.kinds .ind{position:absolute;top:4px;bottom:4px;right:4px;border-radius:9px;
            background:var(--ink2);box-shadow:0 1px 3px rgba(0,0,0,.18);
            transition:transform .22s cubic-bezier(.2,.9,.3,1),width .2s,background .2s}

/* entry screen: the amount and the keypad share whatever height is left
   (after the notch, the home bar and the strips), so the save button always fits */
#v-entry{overflow-y:auto}
.readout{flex:1 1 auto;min-height:118px;margin:12px var(--pad) 12px;padding:14px 16px;text-align:center;
         display:flex;flex-direction:column;justify-content:center;border-radius:22px;color:#fff;
         background:var(--grad);position:relative;overflow:hidden;transition:background .3s;
         box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 28%,transparent)}
/* soft light sheen on the card */
.readout::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;top:-150px;left:-80px;
         background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.readout>*{position:relative}
.readout .amt{font-family:var(--mono);font-weight:600;font-size:clamp(40px,14vw,60px);letter-spacing:-.02em;
              line-height:1;font-variant-numeric:tabular-nums;direction:ltr;display:block}
.readout .amt.zero{color:rgba(255,255,255,.55)}
.readout .cur{font-size:.42em;color:rgba(255,255,255,.75);font-weight:400;margin-inline-start:.3em;letter-spacing:0}
.readout .tag{margin:12px auto 0;font-size:12.5px;color:rgba(255,255,255,.92);min-height:19px;padding:5px 12px;
               border-radius:999px;background:rgba(255,255,255,.16);max-width:100%}
.readout .tag b{font-weight:600}

.striplbl{font-size:11px;color:var(--dim);padding:0 var(--pad) 5px;flex:none;font-weight:500}
.strip{display:flex;gap:7px;padding:0 var(--pad) 9px;flex:none;overflow-x:auto}
.c{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
   border:1px solid var(--line);background:var(--ink2);font-size:13px;color:var(--dim);box-shadow:var(--lift);
   transition:border-color .14s,color .14s,background .14s}
.c em{font-style:normal;font-size:14px;line-height:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
      background:color-mix(in srgb,var(--t,var(--dim)) 20%,transparent);margin-inline-start:-6px}
.c[aria-pressed="true"]{border-color:var(--accent);color:var(--chalk);font-weight:600;
   background:color-mix(in srgb,var(--accent) 10%,var(--ink2));box-shadow:0 0 0 1px var(--accent) inset}
.c .bal{font-family:var(--mono);font-size:11px;opacity:.75;direction:ltr}
.q{flex:none;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;
   background:var(--ink2);border:1px solid var(--line);font-size:12.5px;color:var(--dim);box-shadow:var(--lift)}
.q em{font-style:normal;font-size:14px}
.q b{font-family:var(--mono);color:var(--chalk);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.q:active{background:var(--ink3)}

/* keypad — forced LTR so 1 2 3 read left→right like a phone */
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:0 var(--pad);
      direction:ltr;flex:3 1 auto;min-height:172px;max-height:290px}
.k{min-height:0;border-radius:16px;background:transparent;font-family:var(--mono);font-size:27px;
   font-weight:500;transition:background .12s,transform .08s;font-variant-numeric:tabular-nums}
.k:active{transform:scale(.97)}
.k:active{background:var(--ink3)}
.k.fn{font-family:var(--ar);font-size:21px;color:var(--dim)}

.savebar{padding:12px var(--pad) 10px;flex:none;display:flex;gap:8px}
.save{flex:1;padding:16px;border-radius:var(--r);background:var(--accent);color:var(--onAcc);
      font-weight:700;font-size:16px;transition:opacity .14s,transform .08s;
      box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 32%,transparent)}
.save:active{transform:scale(.985)}
.save:disabled{opacity:.3;box-shadow:none}
.mini{width:52px;border-radius:var(--r);background:var(--ink2);border:1px solid var(--line);box-shadow:var(--lift);
      color:var(--dim);display:grid;place-items:center;flex:none}
.mini svg,.ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mini.has{color:var(--accent);border-color:var(--accent)}

nav{display:grid;flex:none;border-top:1px solid var(--line);
    background:color-mix(in srgb,var(--ink2) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding-bottom:var(--sab)}
nav.n4{grid-template-columns:repeat(4,1fr)}
nav.n5{grid-template-columns:repeat(5,1fr)}
nav button{padding:8px 0 7px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;
           align-items:center;gap:3px;font-weight:500}
nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;
               stroke-linecap:round;stroke-linejoin:round;padding:4px 16px;box-sizing:content-box;border-radius:999px;
               transition:background .2s}
nav button.on{color:var(--brand);font-weight:600}
nav button.on svg{background:color-mix(in srgb,var(--brand) 14%,transparent)}
nav button.fab{color:var(--dim)}
nav button.fab svg{width:30px;height:30px;padding:13px;margin-top:-26px;border-radius:50%;stroke-width:2.2;
       color:#fff;background:var(--brand)!important;
       box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 40%,transparent),0 0 0 5px var(--ink)}
/* simple mode has four tabs, so there is no middle for the raised + — it's a plain first tab there */
nav.n4 button.fab{order:-1}
nav.n4 button.fab svg{width:25px;height:25px;padding:4px 16px;margin-top:0;border-radius:999px;box-shadow:none;stroke-width:1.7;
       color:inherit;background:transparent!important}
nav.n4 button.fab.on svg{background:color-mix(in srgb,var(--brand) 14%,transparent)!important}
nav.n4 button.fab.on{color:var(--brand)}
/* on the entry screen itself the + sits in the bar, clear of the save button */
nav button.fab.on{color:var(--brand)}
nav button.fab.on svg{width:25px;height:25px;padding:4px 16px;margin-top:0;border-radius:999px;box-shadow:none;stroke-width:2}

.searchbar{padding:12px var(--pad) 0;flex:none}
.searchbar input{width:100%;padding:12px 14px;border-radius:12px;background:var(--ink2);border:1px solid var(--line);box-shadow:var(--lift)}
.searchbar input:focus{border-color:var(--brand);outline:none}

.daygrp{margin-top:18px}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px}
.dayhd .d{font-size:12.5px;color:var(--dim);font-weight:600}
.dayhd .t{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.roll{background:var(--ink2);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;width:100%;text-align:start}
.row:active{background:var(--ink3)}
.row em,.item em{font-style:normal;font-size:18px;line-height:1;flex:none;width:40px;height:40px;border-radius:50%;
        background:color-mix(in srgb,var(--t,var(--dim)) 16%,var(--ink2));display:grid;place-items:center;text-align:center}
.row .meta{flex:1;min-width:0}
.row .nm{font-size:14.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nt{font-size:11.5px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
          direction:ltr;flex:none}
.row .val.plus{color:var(--mint)}
.row .val.trf{color:var(--iris)}
.pill{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:600;flex:none;
      background:var(--tile);color:var(--dim);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.print{animation:feed .34s cubic-bezier(.2,.9,.3,1)}
@keyframes feed{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0 4px}
.mnav button{width:38px;height:38px;border-radius:12px;background:var(--ink2);font-size:16px;color:var(--dim);
             border:1px solid var(--line);box-shadow:var(--lift)}
.mnav button:disabled{opacity:.3}
.mnav .lbl{font-size:15px;font-weight:700}
.hero,.worth{margin-top:12px;padding:22px 18px!important;text-align:center;border-radius:22px;color:#fff;
      background:var(--gradBrand);position:relative;overflow:hidden;box-shadow:0 10px 28px color-mix(in srgb,var(--brand) 25%,transparent)}
.hero::before,.worth::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;top:-170px;left:-90px;
      background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.hero>*,.worth>*{position:relative}
.hero .cap,.worth .cap,.hero .cmp,.hero .legs,.worth .sub,.hero .big .cur,.worth .v .cur{color:rgba(255,255,255,.82)!important}
.hero .legs b,.hero .pos,.hero .neg,.hero .up,.hero .down{color:#fff!important}
.hero .cap{font-size:12.5px;color:var(--dim);margin-bottom:8px;font-weight:500}
.hero .big{font-family:var(--mono);font-size:clamp(36px,12vw,50px);font-weight:700;letter-spacing:-.02em;
           line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.hero .big .cur{font-size:.4em;color:var(--dim);font-weight:400;margin-inline-start:.25em}
.hero .pos{color:var(--mint)}.hero .neg{color:var(--red)}
.hero .legs{margin-top:12px;font-size:12.5px;color:var(--dim);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hero .legs b{color:var(--chalk);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.hero .cmp{margin-top:9px;font-size:12px;color:var(--dim)}
.up{color:var(--red)}.down{color:var(--mint)}

.card{background:var(--ink2);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{margin:0 0 14px;font-size:14px;font-weight:700;color:var(--chalk);
         display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 button{font-size:12px;color:var(--brand);font-weight:600;flex:none;padding:4px 10px;border-radius:999px;
                 background:color-mix(in srgb,var(--brand) 12%,transparent)}
.card .foot{margin-top:12px;font-size:12px;color:var(--dim);text-align:center;line-height:1.65}
.card .foot b{color:var(--chalk);font-weight:600}
.card .foot .neg{color:var(--red)} .card .foot .pos{color:var(--mint)}
.card.warn{border:1px solid color-mix(in srgb,var(--red) 45%,transparent);
           background:color-mix(in srgb,var(--red) 9%,var(--ink2))}

.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--ink3);gap:2px}
.split i{display:block}
.splegend{display:flex;justify-content:space-between;margin-top:11px;font-size:12.5px;gap:10px}
.splegend span{display:flex;align-items:center;gap:6px;color:var(--dim);min-width:0}
.splegend b{font-family:var(--mono);color:var(--chalk);font-weight:600;font-variant-numeric:tabular-nums}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

.brow{margin-bottom:13px}
.brow:last-child{margin-bottom:0}
.brow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-size:13px}
.brow .top .l{display:flex;align-items:center;gap:6px;min-width:0}
.brow .top .l span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .top .r{font-family:var(--mono);font-weight:500;flex:none;font-variant-numeric:tabular-nums;direction:ltr}
.brow .top .pct{color:var(--dim);font-size:11.5px;flex:none}
.bar{height:6px;border-radius:3px;background:var(--ink3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--t,var(--brand))}
.bar.mintbar i{background:var(--mint)}
.bar.irisbar i{background:var(--iris)}
.brow[style] .bar i{background:var(--t)}
.bar.over i{background:var(--red)!important}
.bar.tall{height:9px;border-radius:4px}
.bud{font-size:11px;color:var(--dim);margin-top:4px}
.bud.over{color:var(--red)}

.days{display:flex;align-items:flex-end;gap:2px;height:74px;direction:ltr}
.days i{flex:1;background:var(--ink3);border-radius:2px 2px 0 0;min-height:2px}
.days i.hot{background:var(--brand)}
.dayax{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;color:var(--dim);
       direction:ltr;font-family:var(--mono)}
.yr{display:flex;align-items:flex-end;gap:5px;height:88px;direction:ltr}
.yr .mo{flex:1;display:flex;align-items:flex-end;gap:1.5px;height:100%}
.yr .mo i{flex:1;border-radius:2px 2px 0 0;min-height:2px;background:var(--ink3)}
.yr .mo i.e{background:var(--brand)} .yr .mo i.i{background:var(--mint)}
.yr .mo.cur i.e{box-shadow:0 0 0 1px var(--chalk) inset}
.yrax{display:flex;gap:5px;margin-top:7px;direction:ltr}
.yrax span{flex:1;text-align:center;font-size:9px;color:var(--dim)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--ink2);border-radius:var(--r);padding:14px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;
         direction:ltr;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--dim);margin-top:5px}

.sec{margin-top:22px}
.sec>h2{margin:0 0 10px;padding:0 2px;font-size:13px;font-weight:700;color:var(--dim);
        display:flex;justify-content:space-between;align-items:center}
.sec>h2 button{font-size:12px;color:var(--brand);font-weight:600}
.list{background:var(--ink2);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 13px;width:100%;text-align:start;min-height:58px}
.item .nm{flex:1;font-size:14.5px;min-width:0;font-weight:500}
.item .nm small{display:block;font-size:11.5px;color:var(--dim)}
.item .hint{font-size:12.5px;color:var(--dim);font-family:var(--mono);direction:ltr;flex:none;
            font-variant-numeric:tabular-nums}
.item .chev{color:var(--dim);font-size:13px;flex:none}
.item:active{background:var(--ink3)}
.item.done .nm{opacity:.45;text-decoration:line-through}
.ghost{width:100%;padding:13px;border-radius:var(--r);border:1px dashed color-mix(in srgb,var(--dim) 45%,transparent);
       color:var(--dim);font-size:14px;font-weight:600;margin-top:10px}
.ghost:active{background:var(--ink2)}
.danger{color:var(--red)}
.banner{background:color-mix(in srgb,var(--brand) 13%,transparent);
        border:1px solid color-mix(in srgb,var(--brand) 38%,transparent);
        border-radius:var(--r);padding:13px;font-size:13px;line-height:1.65;margin-top:16px}
.banner b{color:var(--brand)}
#memWarn{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--red);color:#fff;
         padding:calc(var(--sat) + 9px) 16px 9px;font-size:12.5px;line-height:1.6;text-align:center}
#memWarn[hidden]{display:none}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.duo .box{background:var(--ink2);border-radius:var(--r);padding:14px;text-align:center}

.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.5;padding:12px;

.chk input{width:19px;height:19px;flex:none;margin:1px 0 0;accent-color:var(--brand)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 0}
.kv b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.kv.big{font-size:15px}
.acts{display:flex;gap:9px;margin-top:17px}

#lock{position:fixed;inset:0;z-index:80;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;

<script>
'use strict';

/* ═══════ storage ═══════ */
const Store = (() => {
  const NAME='masareef', VER=5,
        STORES=['tx','cats','recur','meta','debt','recon','acct','plan','rent','stay','goal'];
  let db=null, mem=null;
  function memInit(){ mem={}; STORES.forEach(s=>mem[s]=new Map()); }
  function open(){
    return new Promise(res=>{
      let idb; try{ idb=indexedDB; }catch(e){ idb=null; }
      if(!idb){ memInit(); return res(false); }
      let done=false;
      /* slow phones can take seconds to open the database — wait generously, and if it
         opens after we gave up, move anything typed meanwhile into it and reload */
      const t=setTimeout(()=>{ if(!done){done=true;memInit();res(false);} },10000);
      let rq; try{ rq=idb.open(NAME,VER); }catch(e){ clearTimeout(t); memInit(); return res(false); }
      rq.onupgradeneeded=e=>{ const d=e.target.result;
        STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'}); }); };
      rq.onsuccess=e=>{
        if(!done){ done=true; clearTimeout(t); db=e.target.result; return res(true); }
        const late=e.target.result, tx=late.transaction(STORES,'readwrite');
        STORES.forEach(s=>mem[s].forEach(v=>tx.objectStore(s).put(v)));
        tx.oncomplete=()=>location.reload();
      };
      /* onblocked: another tab holds an older version — success follows once it closes */
      rq.onerror=()=>{ if(done)return; done=true; clearTimeout(t); memInit(); res(false); };
    });
  }
  /* ask the browser not to evict our data under storage pressure */
  async function persist(){
    try{
      if(!navigator.storage||!navigator.storage.persist) return null;
      return (await navigator.storage.persisted()) || (await navigator.storage.persist());
    }catch(e){ return null; }
  }
  /* several writes in one transaction: all land or none do.
     ops: ['put',store,value] | ['del',store,id] | ['clear',store] */
  function batch(ops){
    if(!ops.length) return Promise.resolve();
    if(!db){
      for(const [op,s,v] of ops){ if(op==='put') mem[s].set(v.id,v); else if(op==='del') mem[s].delete(v); else mem[s].clear(); }
      return Promise.resolve();
    }
    return new Promise((res,rej)=>{
      const tx=db.transaction([...new Set(ops.map(o=>o[1]))],'readwrite');
      tx.oncomplete=()=>res();
      tx.onerror=tx.onabort=()=>rej(tx.error);
      /* a bad record throws synchronously — abort so the writes queued before it don't commit */
      try{ for(const [op,s,v] of ops){ const st=tx.objectStore(s); if(op==='put') st.put(v); else if(op==='del') st.delete(v); else st.clear(); } }
      catch(e){ try{ tx.abort(); }catch(_){} rej(e); }
    });
  }
  const t=(s,m)=>db.transaction(s,m).objectStore(s);
  const all=s=>db?new Promise((res,rej)=>{const r=t(s,'readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}):Promise.resolve([...mem[s].values()]);
  const put=(s,v)=>db?new Promise((res,rej)=>{const r=t(s,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error);}):(mem[s].set(v.id,v),Promise.resolve(v));
  const del=(s,id)=>db?new Promise((res,rej)=>{const r=t(s,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}):(mem[s].delete(id),Promise.resolve());
  const clear=s=>db?new Promise((res,rej)=>{const r=t(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}):(mem[s].clear(),Promise.resolve());
  return {open,persist,batch,all,put,del,clear,get persistent(){return !!db}};
})();

  /* ── migrations ── */

    if(c.kind==='exp' && typeof c.fixed!=='boolean'){
      c.fixed=['فواتير','بيت ومعيشة'].includes(c.name); ch=true;
    }
    if(!Array.isArray(c.words)){ c.words=[...(CAT_WORDS[c.name]||[])]; ch=true; }
    if(ch) await Store.put('cats',c);
  }
  if(!catsOf('exp').length)
    for(let i=0;i<DEF_EXP.length;i++){ const c={id:uid(),...DEF_EXP[i],kind:'exp',order:i,budget:0,words:[...(CAT_WORDS[DEF_EXP[i].name]||[])]}; S.cats.push(c); await Store.put('cats',c); }
  if(!catsOf('inc').length)
    for(let i=0;i<DEF_INC.length;i++){ const c={id:uid(),...DEF_INC[i],kind:'inc',order:i,budget:0,words:[...(CAT_WORDS[DEF_INC[i].name]||[])]}; S.cats.push(c); await Store.put('cats',c); }
  S.cats.sort((a,b)=>a.order-b.order);

  if(!S.accts.length){
    for(let i=0;i<DEF_ACCT.length;i++){
      const a={id:uid(),...DEF_ACCT[i],opening:0,order:i,archived:false};
      S.accts.push(a); await Store.put('acct',a);
    }
  }
  S.accts.sort((a,b)=>a.order-b.order);
  const aCash=S.accts.find(a=>a.type==='cash')||S.accts[0];
  const aBank=S.accts.find(a=>a.type==='bank')||S.accts[S.accts.length-1];

  for(const t of S.tx){
    let ch=false;
    if(!t.kind){ t.kind='exp'; ch=true; }
    if(!t.acct){ t.acct = t.method==='card'? aBank.id : aCash.id; ch=true; }
    if(ch) await Store.put('tx',t);
  }
  sortTx();
  await migrateRental();
  for(const r of S.recur){
    let ch=false;
    if(!r.kind){ r.kind='exp'; ch=true; }
    if(!r.acct){ r.acct = r.method==='card'? aBank.id : aCash.id; ch=true; }
    if(ch) await Store.put('recur',r);

  for(const r of S.recons){ if(!r.acct){ r.acct=aCash.id; await Store.put('recon',r); } }

  S.lastCat.exp=catsOf('exp')[0].id;

  S.lastCat.inc=catsOf('inc')[0].id;

})();

/* ═══════ app lock: a 4-digit passcode, optionally Face ID / fingerprint via WebAuthn.
   It hides the app from someone holding the phone; the data itself isn't encrypted. ═══════ */
const pinHash=async pin=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('masareef:'+pin)))]
  .map(b=>b.toString(16).padStart(2,'0')).join('');
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bioOK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
async function bioCheck(){
  try{
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),timeout:60000,
      allowCredentials:[{type:'public-key',id:unb64(S.settings.lock.bio)}],userVerification:'required'}});
    return true;
  }catch(e){ return false; }
}
async function bioCreate(){
  try{
    const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'قرش أبيض'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'masareef',displayName:'قرش أبيض'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],timeout:60000,
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'}}});
    return c?b64(c.rawId):'';
  }catch(e){ return ''; }
}
function showLock(){
  const L=S.settings.lock; if(!L||!L.pin) return;
  const el=$('#lock'); let typed='';
  el.innerHTML=`<img src="icon-192.png" alt=""><h2>اكتب الرقم السري</h2><div class="dots" id="lkD">${'<i></i>'.repeat(4)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-lk="${n}">${n}</button>`).join('')}
      <button class="fn" data-lk="bio">${L.bio?'🙂':''}</button><button data-lk="0">0</button><button class="fn" data-lk="del">⌫</button></div>
    ${L.bio?'<button class="bio" id="lkBio">افتح بـ Face ID / البصمة</button>':''}`;
  el.hidden=false; $('#toast').classList.remove('on');
  const dots=()=>$('#lkD').querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i<typed.length));
  const open=()=>{ el.hidden=true; el.innerHTML=''; };
  const bio=async()=>{ if(await bioCheck()) open(); };
  el.onclick=async e=>{
    const b=e.target.closest('[data-lk]'), k=b&&b.dataset.lk;
    if(e.target.id==='lkBio'||k==='bio'){ if(L.bio) bio(); return; }
    if(!k) return;

    if(typed.length>=4) return;

      if(await pinHash(typed)===L.pin) return open();
      const d=$('#lkD'); d.classList.add('bad'); if(navigator.vibrate) try{navigator.vibrate(80)}catch(_){}
      setTimeout(()=>{ d.classList.remove('bad'); typed=''; dots(); },380);

}
/* The app's height. Installed on an iPhone home screen, iOS can hand the page a viewport that
   stops short of the bottom of the screen (an empty strip under the tab bar, the save button cut off).
   A home-screen app always fills the whole screen, so there the real screen height is used. */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function fitScreen(){
  let h=window.innerHeight;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
  if(IOS && STANDALONE && !typing && innerHeight>innerWidth){
    const full=Math.max(screen.height,screen.width);
    if(full>h && full-h<140) h=full;
  }
  document.documentElement.style.setProperty('--appH',h+'px');
}
fitScreen();
['resize','orientationchange','pageshow'].forEach(e=>window.addEventListener(e,()=>setTimeout(fitScreen,60)));

/* The entry screen tightens itself when it doesn't fit (small phone, long names, extra strips):
   try roomy first, then fit1, then fit2 — whatever shows everything with the save button in view. */
function fitEntry(){
  const v=$('#v-entry'); if(!v||!v.classList.contains('on')) return;
  const over=()=>[v,...v.querySelectorAll('.ent-a,.ent-b')].some(e=>e.clientHeight && e.scrollHeight>e.clientHeight+1);
  v.classList.remove('fit1','fit2');
  if(over()){ v.classList.add('fit1'); if(over()) v.classList.add('fit2'); }
}
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>fitEntry());
  ro.observe($('#v-entry')); [...$('#v-entry').querySelectorAll('.rail,.kinds,.strip,.savebar')].forEach(e=>ro.observe(e));
}
window.addEventListener('resize',()=>setTimeout(fitEntry,80));

/* backup reminder: a week without one, or 100+ entries logged since the last */
function backupNag(){
  if(S.tx.length<=15) return '';
  const last=S.settings.lastBackup||0;
  if(Date.now()-last>7*864e5) return last?'عدّى أسبوع من غير نسخة احتياطية':'لسه ما خدتش نسخة احتياطية';
  const n=S.tx.filter(t=>(t.at||0)>last).length;
  return n>=100?`سجّلت ${n} حركة من آخر نسخة احتياطية`:'';
}

async function runRecurring(){
  /* catch up on months the app wasn't opened in, but never more than 12 back */
  const now=new Date(), ops=[], made=[];
  for(const r of S.recur){
    const due=recurringDue(r,now);
    if(!due.length) continue;
    for(const d of due){
      const t={id:uid(),kind:r.kind||'exp',amount:r.amount,cat:r.cat,acct:r.acct,note:r.note||'',
        date:d.date,at:Date.now(),auto:1,rec:r.id};
      ops.push(['put','tx',t]); made.push(t);
    }
    const last=due[due.length-1];
    ops.push(['put','recur',(r.freq||'month')==='month'?{...r,lastMonth:last.month}:{...r,lastDate:last.date}]);
  }
  if(!ops.length) return;
  /* posting and lastMonth land together, so a crash can't double-post or skip */
  await Store.batch(ops);
  for(const [,s,v] of ops) if(s==='recur') Object.assign(S.recur.find(r=>r.id===v.id),v);
  S.tx.push(...made); sortTx();
  toast(`سُجّل <b>${made.length}</b> بند ثابت`);
}

/* PWAs stay alive in the background for days — when resumed on a new day,
   roll the draft date forward and post any fixed items that came due */
let lastDay=null;
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible' || !lastDay) return;
  const d=today(); if(d===lastDay) return;
  if(S.draft.date===lastDay) S.draft.date=d;
  lastDay=d;
  await runRecurring();
  renderRail(); renderQuick(); renderAccts(); renderReadout();
});

/* quick-repeat chips */
function quickList(){
  const k=S.draft.kind;
  if(k==='trf'||k==='ref') return [];
  const cut=iso(new Date(Date.now()-90*864e5));
  const map=new Map();
  S.tx.filter(t=>t.kind===k && t.date>=cut && !t.auto && !t.ccy).forEach(t=>{
    const key=t.cat+'|'+t.amount+'|'+t.acct;
    const e=map.get(key)||{cat:t.cat,amount:t.amount,acct:t.acct,note:t.note,n:0,last:''};
    e.n++; if(t.date>e.last){e.last=t.date;e.note=t.note;}
    map.set(key,e);
  });
  return [...map.values()].filter(e=>e.n>=2)
    .sort((a,b)=> b.n-a.n || b.last.localeCompare(a.last)).slice(0,5);
}
function renderQuick(){
  const list=quickList(), box=$('#quick'), lbl=$('#quickLbl');
  if(!list.length){ box.hidden=true; lbl.hidden=true; return; }
  box.hidden=false; lbl.hidden=false;
  box.innerHTML=list.map((e,i)=>{
    const c=catOf(e.cat);
    return `<button class="q" data-q="${i}"><em${tone(c)}>${c.emoji}</em><b>${money(e.amount)}</b></button>`;
  }).join('');
  box._list=list;
}
$('#quick').addEventListener('click',async e=>{

  const q=$('#quick')._list[+b.dataset.q]; if(!q) return;

async function commit(t,onUndo){
  const rec={id:uid(),at:Date.now(),...t};
  await Store.put('tx',rec);
  /* budgets are personal: a rental expense never pushes them */
  const mk=mKey(rec.date), c=rec.kind==='exp'&&!(hasBiz()&&isBiz(rec))?catOf(rec.cat):null;
  const catSpent=()=>sum(inMonth(mk,'exp',MINE()).filter(x=>x.cat===rec.cat))-sum(inMonth(mk,'ref',MINE()).filter(x=>x.cat===rec.cat));
  const b0=c?catSpent():0, m0=c?expNet(mk,MINE()):0;
  S.tx.push({...rec,_new:1}); sortTx();
  const warn=c?budgetWarn(c,b0,catSpent(),m0,expNet(mk,MINE()),budgetFor(mk)):'';
  let label;
  if(rec.kind==='trf') label=`${acctOf(rec.acct).emoji}→${acctOf(rec.toAcct).emoji}`;
  else label=catOf(rec.cat).emoji;
  const sign=(rec.kind==='inc'||rec.kind==='ref')?'+':'';
  toast(`${label} <span class="a">${sign}${money(rec.amount)}</span> ${esc(S.settings.cur)}${warn}`,
    async()=>{ await Store.del('tx',rec.id); S.tx=S.tx.filter(x=>x.id!==rec.id);
      if(onUndo) await onUndo();
      renderRail(); renderQuick(); renderAccts(); renderLog(); toast('اتراجعنا'); });
  renderRail(); renderQuick(); renderAccts(); renderReadout();
  return rec;
}

/* a line for the save toast when this expense pushed its category (or the month) past 80% / 100% of budget */
function budgetWarn(c,b0,b1,m0,m1,B){
  const line=t=>`<br><small style="color:var(--red);font-weight:600">${t}</small>`;
  const cc=budgetCross(b0,b1,c.budget);
  if(cc==='over') return line(`⚠ ${esc(c.emoji+' '+c.name)}: عدّيت الميزانية بـ ${money0(b1-c.budget)}`);
  if(cc==='near') return line(`${esc(c.emoji+' '+c.name)}: صرفت ${Math.round(b1/c.budget*100)}% من الميزانية`);
  const mc=budgetCross(m0,m1,B);
  if(mc==='over') return line(`⚠ عدّيت ميزانية الشهر بـ ${money0(m1-B)}`);
  if(mc==='near') return line(`صرفت ${Math.round(m1/B*100)}% من ميزانية الشهر`);
  return '';
}

/* reserved = planned expenses still due this month */
function reservedThisMonth(){
  const mk=today().slice(0,7);
  return S.plans.filter(p=>!p.done && mKey(p.date)===mk && p.date>=today())
                .reduce((s,p)=>s+p.amount,0);
}
function budgetFor(mk){
  const b=S.settings.monthBudget||0;
  return b===-1 ? incNet(mk,MINE()) : b;
}
function renderRail(){
  const now=new Date(), mk=today().slice(0,7), cur=esc(S.settings.cur);
  $('#today').textContent=`${AR_DAYS[now.getDay()]} ${now.getDate()} ${AR_MONTHS[now.getMonth()]}`;
  const E=expNet(mk,MINE()), I=incNet(mk,MINE());
  const mineToday=S.tx.filter(t=>t.date===today()&&inScope(t,MINE()));

/* ── natural language entry (parser lives in logic.js) ── */
/* iPhone's in-browser speech recognition asks for the mic on every launch of a home-screen app
   and often stops returning text after the first use — its keyboard dictation has neither problem */
const SR=IOS?null:(window.SpeechRecognition||window.webkitSpeechRecognition);
const parseEntry=raw=>parseSentence(raw,{accts:liveAccts(),expCats:catsOf('exp'),incCats:catsOf('inc'),
  pro:PRO(),lastCat:S.lastCat,acct:S.draft.acct});
$('#nlBtn').addEventListener('click',()=>{
  sheet(`<h2>تسجيل بجملة</h2>
    <p class="lede">اكتب أو قول المبلغ والتصنيف والحساب في سطر واحد. مثال: <b>٥٠ أكل كاش</b> أو <b>خمسين شاورما فيزا</b>.</p>
    <div class="f" style="display:flex;gap:8px"><input id="nlIn" placeholder="50 أكل كاش" autocomplete="off">
      ${SR||IOS?'<button class="mini" id="nlMic" aria-label="اتكلم" style="height:auto;width:50px"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>':''}</div>
    <div id="nlHint" class="banner" style="margin:0 0 12px" hidden></div>
    <div id="nlOut" style="font-size:13px;color:var(--dim);min-height:22px"></div>
    <div class="acts"><button class="no" onclick="closeSheet()">إلغاء</button>
      <button class="go" id="nlOk">سجّل</button></div>`);
  const upd=()=>{
    const p=parseEntry($('#nlIn').value);
    $('#nlOut').innerHTML = p
      ? `${KINDS[p.kind].label} · ${catOf(p.cat).emoji} ${esc(catOf(p.cat).name)} · ${esc(acctOf(p.acct).name)} · <span class="num">${money(p.amount)}</span> ${esc(S.settings.cur)}${p.note?' · '+esc(p.note):''}`
      : 'اكتب رقم على الأقل';
  };
  $('#nlIn').oninput=upd;
  /* the keyboard's own dictation always works, so that's the fallback for every failure */
  const kbMic=msg=>{
    $('#nlHint').innerHTML=msg+'<br>دوس على <b>🎤</b> اللي في الكيبورد (جنب المسافة) واتكلم — بيكتب في الخانة على طول.';
    $('#nlHint').hidden=false; $('#nlIn').focus();
  };
  /* the mic is tried every time — iPhone's speech service can fail once (network, mic busy)
     and work the next time, so a failure is never remembered */
  let rec=null;
  if($('#nlMic')) $('#nlMic').onclick=()=>{
    const m=$('#nlMic');
    if(!SR){
      $('#nlHint').innerHTML='الكيبورد اتفتح — دوس على <b>🎤</b> اللي تحت جنب المسافة واتكلم.<br>مثلاً: «خمسين شاورما كاش». ولما تخلص دوس «سجّل».';
      $('#nlHint').hidden=false; $('#nlIn').focus(); return;
    }
    if(rec){ try{ rec.stop(); }catch(_){} return; }          // second tap = stop listening
    $('#nlHint').hidden=true;
    const langs=['ar-EG','ar-SA','ar'];
    const go=li=>{
      const r=new SR(); rec=r; r.lang=langs[li]; r.interimResults=true; r.maxAlternatives=1;
      m.classList.add('has');
      r.onresult=e=>{ $('#nlIn').value=[...e.results].map(x=>x[0].transcript).join(' '); upd(); };
      r.onend=()=>{ m.classList.remove('has'); if(rec===r) rec=null; };
      r.onerror=e=>{
        m.classList.remove('has'); if(rec===r) rec=null;
        const err=e.error||'';
        if(err==='language-not-supported' && li<langs.length-1) return go(li+1);
        if(err==='no-speech') return toast('ماسمعتش حاجة — دوس على المايك واتكلم على طول');
        if(err==='aborted') return;
        if(err==='network') return kbMic('التعرّف على الصوت محتاج نت — اتأكد إن النت شغال وجرّب تاني.');
        if(err==='audio-capture') return kbMic('المايك مستخدم في حاجة تانية دلوقتي (مكالمة أو تطبيق تاني) — اقفلها وجرّب تاني.');
        if(err==='not-allowed') return kbMic('التطبيق مش واخد إذن المايك — من إعدادات الآيفون ← Safari ← المايكروفون اختار «اسأل» أو «اسمح».');
        kbMic('المايك ماشتغلش المرة دي — دوس عليه تاني، ولو فضل كده استخدم مايك الكيبورد.');
      };
      try{ r.start(); }catch(_){ m.classList.remove('has'); rec=null; kbMic('المايك ماشتغلش المرة دي — دوس عليه تاني.'); }
    };
    go(0);
  };
  $('#nlIn').onkeydown=e=>{ if(e.key==='Enter') $('#nlOk').click(); };
  upd();
  $('#nlOk').onclick=async()=>{
    const p=parseEntry($('#nlIn').value);
    if(!p){ $('#nlIn').focus(); return; }
    closeSheet();
    await commit({kind:p.kind,amount:p.amount,cat:p.cat,acct:p.acct,note:p.note,date:today()});
  };
});

$('#save').addEventListener('click',async()=>{
  const raw=Number(S.draft.amt); if(!(raw>0)) return;
  const cc=S.draft.ccy?ccyOf(S.draft.ccy):null;
  const k=S.draft.kind;
  const t={kind:k,amount:cc?raw*cc.rate:raw,acct:S.draft.acct,note:S.draft.note,date:S.draft.date};
  if(k==='trf') t.toAcct=S.draft.toAcct; else t.cat=S.draft.cat;
  if(cc){ t.ccy=cc.code; t.raw=raw; t.rate=cc.rate; }
  if(S.draft.unit && (k==='exp'||k==='ref')) t.unitId=S.draft.unit;
  if(k!=='trf' && S.draft.catPicked && S.draft.note) await learnFrom(S.draft.note,S.draft.cat);
  if(k!=='trf' && !S.draft.catGuessed) S.lastCat[k]=S.draft.cat;
  if(S.draft.catGuessed){ S.draft.cat=S.draft.prevCat||S.draft.cat; S.draft.catGuessed=false; }
  /* a transfer's fee is a real expense from the sending account */
  if(k==='trf' && S.draft.fee>0){
    const fc=guessCat('رسوم تحويل',catsOf('exp'))||catsOf('exp').slice(-1)[0];
    const f={id:uid(),at:Date.now()-1,kind:'exp',amount:S.draft.fee,cat:fc.id,acct:t.acct,note:'رسوم تحويل',date:t.date};
    await Store.put('tx',f); S.tx.push(f);
  }
  S.draft.amt=''; S.draft.note=''; S.draft.date=today(); S.draft.ccy=null; S.draft.catPicked=false; S.draft.unit=''; S.draft.fee=0;
  await commit(t);
});

function go(g){
  const b=document.querySelector(`nav button[data-go="${g}"]`);
  if(!b || b.hidden) return;

  if(g==='entry'){ renderRail(); renderQuick(); renderAccts(); renderReadout(); fitEntry(); }
}

/* ═══════ HISTORY ═══════ */
function matches(t,q){
  if(!q) return true;
  q=normDigits(q.trim().toLowerCase());
  return String(t.amount).includes(q) || (t.note||'').toLowerCase().includes(q)
      || catOf(t.cat).name.toLowerCase().includes(q) || acctOf(t.acct).name.toLowerCase().includes(q)
      || t.date.includes(q);
}
/* debt money that went through an account, as log rows (pro only, like the balances they move) */
function debtLogRows(){
  if(!PRO()) return [];
  return S.debts.flatMap(d=>{
    const r=d.acct?[{d,pay:false,date:d.date,acct:d.acct,amount:d.amount}]:[];
    for(const p of (d.pays||[])) if(p.acct) r.push({d,pay:true,date:p.date,acct:p.acct,amount:p.amount});
    return r;
  });
}
const debtRowName=x=>x.d.dir==='out'?(x.pay?`سداد من ${x.d.person}`:`سلفة لـ${x.d.person}`)
                                    :(x.pay?`سداد لـ${x.d.person}`:`استلاف من ${x.d.person}`);
function renderLog(){
  let list=S.tx;
  /* debt rows have no kind or category, so those filters leave them out */
  let dl=S.filter.kind||S.filter.cat?[]:debtLogRows();
  if(S.filter.acct) dl=dl.filter(x=>x.acct===S.filter.acct);
  if(S.search){ const q=norm(S.search); dl=dl.filter(x=>norm(debtRowName(x)+' '+(x.d.note||'')).includes(q)||String(x.amount).includes(S.search.trim())); }
  if(S.filter.kind) list=list.filter(t=>t.kind===S.filter.kind);
  if(S.filter.cat) list=list.filter(t=>t.cat===S.filter.cat);
  if(S.filter.acct) list=list.filter(t=>t.acct===S.filter.acct||t.toAcct===S.filter.acct);
  if(S.filter.scope){ list=list.filter(t=>inScope(t,S.filter.scope)); if(S.filter.scope==='biz') dl=[]; }
  if(S.search) list=list.filter(t=>matches(t,S.search));
  const active=S.filter.cat||S.filter.acct||S.filter.kind||S.filter.scope;
  $('#logFilter').textContent=active?'إلغاء التصفية':'تصفية';
  const tot=sum(list.filter(t=>t.kind==='exp'))-sum(list.filter(t=>t.kind==='ref'));
  const n=list.length+dl.length;
  $('#logSub').innerHTML=n
    ?`${n} حركة${S.search||active?` · <span class="num">${money0(tot)}</span> ${esc(S.settings.cur)} مصاريف`:''}`
    :'فاضي';

  if(!n){
    $('#logBody').innerHTML=`<div class="empty"><div class="h">مفيش حركات هنا</div>
      <div class="p">${S.search?'مفيش نتايج للبحث ده.':active?'مفيش نتايج للتصفية دي.':'أول حاجة تسجلها هتظهر في المكان ده.'}</div></div>`;
    return;
  }
  const g={}, gd={};
  list.forEach(t=>{(g[t.date]=g[t.date]||[]).push(t);});
  dl.forEach(x=>{(gd[x.date]=gd[x.date]||[]).push(x);});
  $('#logBody').innerHTML=[...new Set([...Object.keys(g),...Object.keys(gd)])].sort((a,b)=>b.localeCompare(a)).map(d=>{
    const day=g[d]||[];
    const dE=sum(day.filter(t=>t.kind==='exp'))-sum(day.filter(t=>t.kind==='ref'));
    const dI=sum(day.filter(t=>t.kind==='inc'));
    const net=dI-dE, anyInc=day.some(t=>t.kind==='inc');
    const rows=day.map(t=>{
      const isTrf=t.kind==='trf';
      const icon=isTrf?'⇄':catOf(t.cat).emoji;
      const name=isTrf?`${acctOf(t.acct).name} ← ${acctOf(t.toAcct).name}`:catOf(t.cat).name;
      const bits=[t.note, t.unitId?'🏘 '+unitName(t.unitId):isBiz(t)?'🏘':'', t.ccy?`${money(t.raw)} ${t.ccy}`:'', t.auto?'ثابت':'', t.kind==='ref'?'مرتجع':''].filter(Boolean);
      const cls=t.kind==='inc'||t.kind==='ref'?' plus':isTrf?' trf':'';
      const sign=t.kind==='inc'||t.kind==='ref'?'+':'';
      return `<button class="row${t._new?' print':''}" data-tx="${t.id}">
        <em${isTrf?' style="--t:var(--iris)"':tone(catOf(t.cat))}>${icon}</em>
        <span class="meta"><span class="nm">${esc(name)}</span>${bits.length?`<span class="nt">${esc(bits.join(' · '))}</span>`:''}</span>
        ${isTrf?'':`<span class="pill">${esc(acctOf(t.acct).name)}</span>`}
        <span class="val${cls}">${sign}${money(t.amount)}</span></button>`;
    }).concat((gd[d]||[]).map(x=>{
      const plus=(x.d.dir==='in')!==x.pay;
      return `<button class="row" data-debtrow="${x.d.id}">
        <em style="--t:var(--iris)">${x.d.dir==='out'?'↗':'↘'}</em>
        <span class="meta"><span class="nm">${esc(debtRowName(x))}</span><span class="nt">سلف${x.d.note&&!x.pay?' · '+esc(x.d.note):''}</span></span>
        <span class="pill">${esc(acctOf(x.acct).name)}</span>
        <span class="val trf">${plus?'+':'−'}${money(x.amount)}</span></button>`;
    })).join('<div class="perf"></div>');
    if(!day.length) return `<div class="daygrp"><div class="dayhd"><span class="d">${dayLabel(d)}</span></div>
      <div class="roll">${rows}</div></div>`;
    const totTxt=anyInc?(net>=0?'+'+money(net):money(net)):money(dE);
    return `<div class="daygrp"><div class="dayhd"><span class="d">${dayLabel(d)}</span>
      <span class="t num"${anyInc?` style="color:${net>=0?'var(--mint)':'var(--red)'}"`:''}>${totTxt} <span style="font-size:11px;color:var(--dim)">${esc(S.settings.cur)}</span></span></div>
      <div class="roll">${rows}</div></div>`;
  }).join('');
  S.tx.forEach(t=>delete t._new);
}

function editTx(id){
  const t=S.tx.find(x=>x.id===id); if(!t) return;
  if(t.stay && S.stays.some(st=>st.id===t.stay)){ toast('الدفعة دي من حجز — عدّلها من الحجز'); return staySheet(t.stay); }
  const isTrf=t.kind==='trf';
  /* always offer the tx's own kind and accounts, even if hidden (simple mode / closed account),
     otherwise saving silently converts a transfer to an expense or moves it to another account */
  const kinds=kindList().includes(t.kind)?kindList():[...kindList(),t.kind];
  const kOpts=kinds.map(k=>`<option value="${k}" ${t.kind===k?'selected':''}>${KINDS[k].label}</option>`).join('');
  sheet(`<h2>تعديل ${KINDS[t.kind].label}</h2>
    ${t.ccy?`<p class="lede">مسجّل بـ ${money(t.raw)} ${esc(t.ccy)} بسعر ${t.rate}. التعديل بالعملة الأساسية.</p>`:''}
    <div class="f"><div class="row2">
      <div><label>المبلغ (${esc(S.settings.cur)})</label><input id="eAmt" type="number" inputmode="decimal" step="0.01" value="${t.amount}"></div>
      <div><label>التاريخ</label><input id="eDate" type="date" value="${t.date}"></div>
    </div></div>
    <div class="f"><label>النوع</label><select id="eKind">${kOpts}</select></div>
    <div class="f" id="eCatWrap"${isTrf?' hidden':''}><label>التصنيف</label><select id="eCat">
      ${catsOf(t.kind==='ref'?'exp':t.kind).map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select></div>
    <div class="f"><label>${isTrf?'من حساب':'الحساب'}</label><select id="eAcct">${acctOpts(t.acct)}</select></div>
    <div class="f" id="eToWrap"${isTrf?'':' hidden'}><label>إلى حساب</label><select id="eTo">${acctOpts(t.toAcct)}</select></div>
    <div class="f"><label>ملاحظة</label><input id="eNote" maxlength="80" value="${esc(t.note||'')}"></div>
    <div id="eUnitW">${unitField(t.unitId||'',t.kind,'eUnit')}</div>
    <div class="acts"><button class="del" id="eDel">حذف</button>
      <button class="go" id="eOk">حفظ التعديل</button></div>`);
  $('#eKind').onchange=e=>{
    const k=e.target.value, trf=k==='trf';
    $('#eCatWrap').hidden=trf; $('#eToWrap').hidden=!trf;
    if(!trf) $('#eCat').innerHTML=catsOf(k==='ref'?'exp':k)
      .map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('');
    $('#eUnitW').innerHTML=unitField($('#eUnit')?$('#eUnit').value:(t.unitId||''),k,'eUnit');
  };
  $('#eOk').onclick=async()=>{
    const a=Number($('#eAmt').value); if(!(a>0)){ $('#eAmt').focus(); return; }
    const k=$('#eKind').value;
    /* validate before touching t, so a rejected edit doesn't leave memory out of sync with the DB */
    if(k==='trf' && $('#eTo').value===$('#eAcct').value){ toast('الحسابين نفس الحساب'); return; }
    /* amount is edited in base currency — the original foreign amount no longer applies */
    if(t.ccy && a!==t.amount){ delete t.ccy; delete t.raw; delete t.rate; }
    Object.assign(t,{amount:a,date:$('#eDate').value||t.date,kind:k,acct:$('#eAcct').value,
      note:$('#eNote').value.trim()});
    const catBefore=t.cat;
    if(k==='trf'){ t.toAcct=$('#eTo').value; delete t.cat; }
    else { t.cat=$('#eCat').value; delete t.toAcct; }
    const u=$('#eUnit')?$('#eUnit').value:'';
    delete t.unit;
    /* booking and rent income keep their unit — it follows the booking / contract */
    if(k==='exp'||k==='ref'){ if(u) t.unitId=u; else delete t.unitId; }
    else if(!t.stay && !t.rent) delete t.unitId;
    if(k!=='trf' && t.cat!==catBefore && t.note) await learnFrom(t.note,t.cat);
    await Store.put('tx',t); sortTx();
    closeSheet(); renderLog(); renderRail(); renderAccts(); toast('اتعدل');
  };
  $('#eDel').onclick=async()=>{
    await Store.del('tx',t.id); S.tx=S.tx.filter(x=>x.id!==t.id);
    closeSheet(); renderLog(); renderRail(); renderAccts(); renderQuick();
    toast('اتحذف',async()=>{ await Store.put('tx',t); S.tx.push(t); sortTx();
      renderLog(); renderRail(); renderAccts(); renderQuick(); toast('رجعت'); });
  };
}

  sheet(`<h2>تصفية السجل</h2>

/* ═══════ anomalies ═══════ */
function anomalies(mk){
  const out=[];
  const prevs=[]; let k=mk;
  for(let i=0;i<6;i++){ k=prevMonth(k); prevs.push(k); }
  for(const c of catsOf('exp')){
    const cur=sum(inMonth(mk,'exp',MINE()).filter(t=>t.cat===c.id))-sum(inMonth(mk,'ref',MINE()).filter(t=>t.cat===c.id));
    if(cur<=0) continue;
    const hist=prevs.map(m=>sum(inMonth(m,'exp',MINE()).filter(t=>t.cat===c.id))-sum(inMonth(m,'ref',MINE()).filter(t=>t.cat===c.id)))
                    .filter(v=>v>0);
    if(hist.length<3) continue;
    const avg=hist.reduce((s,v)=>s+v,0)/hist.length;
    const pct=(cur-avg)/avg*100;
    if(pct>=35 && cur-avg>=50) out.push({c,cur,avg,pct});
  }
  return out.sort((a,b)=>b.pct-a.pct).slice(0,3);
}

  }
  const net=I-E;
  const hero = I>0
    ? `<div class="hero"><div class="cap">صافي الشهر</div>
        <div class="big ${net>=0?'pos':'neg'}">${net>=0?'+':''}${money(net)}<span class="cur">${cur}</span></div>
        <div class="legs"><span>دخل <b>${money0(I)}</b></span><span>مصاريف <b>${money0(E)}</b></span></div>
        <div class="cmp">${cmp}</div></div>`
    : `<div class="hero"><div class="cap">إجمالي المصاريف</div>
        <div class="big">${money(E)}<span class="cur">${cur}</span></div>
        <div class="cmp">${cmp}</div></div>`;

  /* anomaly alerts */
  let anom='';
  if(PRO()&&personal){
    const list=anomalies(mk);
    if(list.length) anom=`<div class="card warn"><h3>انتبه</h3>${list.map(a=>
      `<div style="font-size:13px;line-height:1.7;margin-bottom:6px">${a.c.emoji} <b>${esc(a.c.name)}</b> أعلى
       <b style="color:var(--red)">${a.pct.toFixed(0)}%</b> من متوسط الشهور اللي فاتت
       (<span class="num">${money0(a.cur)}</span> مقابل <span class="num">${money0(a.avg)}</span>)</div>`).join('')}</div>`;
  }

  const res=isThis&&PRO()?reservedThisMonth():0;
  const budCard = !personal?`<div class="card"><div class="foot" style="margin:0">الميزانية والتنبيهات بتتحسب على مصاريفك الشخصية بس — شوفها في «شخصي».</div></div>`
    : B>0? `<div class="card"><h3>الميزانية<button id="bEdit">تعديل</button></h3>
      <div class="bar tall${E>B?' over':''}"><i style="width:${Math.min(E/B*100,100)}%"></i></div>
      <div class="foot">صرفت <b>${money0(E)}</b> من <b>${money0(B)}</b> ${cur} — ${E<=B?`فاضل <b class="pos">${money0(B-E)}</b>`:`زيادة <b class="neg">${money0(E-B)}</b>`}
      ${res>0?`<br>محجوز <b>${money0(res)}</b> ${cur} لمصاريف قادمة`:''}
      ${isThis?`<br>${dLeft} يوم فاضل · متاح <b>${money0((B-E-res)/dLeft)}</b> ${cur} في اليوم`:''}
      <br>بالمعدل الحالي الشهر بيقفل على <b>${money0(E/dPast*D)}</b> ${cur}</div></div>`
    : `<div class="card"><h3>الميزانية</h3><div class="foot" style="margin:0">محددتش ميزانية شهرية.
        <button id="bEdit" style="color:var(--brand);font-weight:600">حدّدها</button> وهتشوف «متاح النهاردة كام».</div></div>`;

  const mx=Math.max(I,E,1), ratio=I>0?E/I*100:0;
  const ie = I>0? `<div class="card"><h3>الدخل والمصاريف</h3>

        <span class="r">${money(E)}</span></div><div class="bar"><i style="width:${E/mx*100}%"></i></div></div>
      <div class="foot">صرفت <b>${ratio.toFixed(0)}%</b> من دخل الشهر${net>=0?` — ووفّرت <b class="pos">${money0(net)}</b> ${cur}`:` — وزيادة <b class="neg">${money0(-net)}</b> ${cur}`}</div></div>` : '';

  /* fixed vs variable */
  let fv='';
  if(E>0&&personal){
    const catNet=id=>sum(exp.filter(t=>t.cat===id))-sum(ref.filter(t=>t.cat===id));
    let F=0,V=0;
    catsOf('exp').forEach(c=>{ const v=catNet(c.id); if(v>0){ if(c.fixed) F+=v; else V+=v; } });
    const tot=F+V;
    if(tot>0) fv=`<div class="card"><h3>ملتزم مقابل اختياري<button id="fvEdit">تعديل</button></h3>
      <div class="split"><i style="width:${F/tot*100}%;background:var(--iris)"></i><i style="width:${V/tot*100}%;background:var(--brand)"></i></div>
      <div class="splegend">
        <span><i class="sw" style="background:var(--iris)"></i>ملتزم <b>${money0(F)}</b> <small style="color:var(--dim)">${(F/tot*100).toFixed(0)}%</small></span>
        <span><i class="sw" style="background:var(--brand)"></i>اختياري <b>${money0(V)}</b> <small style="color:var(--dim)">${(V/tot*100).toFixed(0)}%</small></span>
      </div>
      <div class="foot">لو ضغطت على الاختياري بالكامل تقدر توفّر لحد <b>${money0(V)}</b> ${cur} في الشهر.</div></div>`;
  }

  /* per account */
  let acc='';
  if(E>0){
    const list=liveAccts().map(a=>({a,v:sum(exp.filter(t=>t.acct===a.id))-sum(ref.filter(t=>t.acct===a.id))}))
                          .filter(x=>x.v>0).sort((x,y)=>y.v-x.v);
    if(list.length) acc=`<div class="card"><h3>مصاريفك حسب الحساب</h3>
      ${list.map(({a,v})=>`<div class="brow">
        <div class="top"><span class="l"><em style="font-style:normal">${a.emoji}</em><span class="t">${esc(a.name)}</span>

        <div class="bar${a.type==='bank'?' irisbar':' mintbar'}"><i style="width:${v/list[0].v*100}%"></i></div></div>`).join('')}</div>`;
  }

  function breakdown(rowsP,rowsN,total,mint){
    const by={};
    rowsP.forEach(t=>{by[t.cat]=(by[t.cat]||0)+t.amount;});
    (rowsN||[]).forEach(t=>{by[t.cat]=(by[t.cat]||0)-t.amount;});
    const list=Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    if(!list.length) return '';
    const max=list[0][1];
    return list.map(([id,v])=>{
      const c=catOf(id), pct=total?v/total*100:0;
      const hasB=!mint&&c.budget>0, over=hasB&&v>c.budget;
      return `<div class="brow"${tone(c)}>
        <div class="top"><span class="l"><em style="font-style:normal">${c.emoji}</em><span class="t">${esc(c.name)}</span>

  const daily=Array(D).fill(0);

      ${top5.map(t=>{const c=catOf(t.cat);return `<div class="row" style="padding:9px 0">
        <em${tone(c)}>${c.emoji}</em><span class="meta"><span class="nm">${esc(t.note||c.name)}</span>
        <span class="nt">${dayLabel(t.date)} · ${esc(acctOf(t.acct).name)}</span></span>
        <span class="val">${money(t.amount)}</span></div>`;}).join('<div class="perf"></div>')}
      </div></div>`:''}` + (PRO()?yearCard(sc):'');
  bindRepNav();
  const be=$('#bEdit'); if(be) be.onclick=budgetSheet;
  const fe=$('#fvEdit'); if(fe) fe.onclick=fixedSheet;
  const rb=$('#reconBtn'); if(rb) rb.onclick=()=>reconSheet(null);
}
/* the rentals' month: what actually came in and went out, next to what the month earned by the
   nights slept — with the reasons the two differ spelled out */
function repBiz(mk){
  const cur=esc(S.settings.cur), r=rentalMonth(rentalData(),mk), sm=staySummary(S.stays,mk);
  const end=`${mk}-${String(dim(+mk.slice(0,4),+mk.slice(5,7))).padStart(2,'0')}`;
  /* money that came in this month for stays that start later */
  const ahead=S.stays.filter(st=>!st.cancelled&&st.from>end).reduce((a,st)=>a+(st.pays||[]).filter(p=>!p.pre&&p.date.slice(0,7)===mk).reduce((b,p)=>b+p.amount,0),0);
  /* this month's nights not paid yet */
  const unpaid=S.stays.filter(st=>stayNightsIn(st,mk)&&stayLeft(st)>0.005).reduce((a,st)=>a+stayLeft(st),0);
  const rentLate=S.rents.reduce((a,x)=>a+(mk>=String(x.start||'').slice(0,7)&&mk<=today().slice(0,7)?rentLeft(x,mk):0),0);
  const pf=v=>`<b class="num" style="color:${v>=0?'var(--mint)':'var(--red)'}">${v>=0?'+':''}${money(v)}</b>`;
  const exp=inMonth(mk,'exp','biz'), ref=inMonth(mk,'ref','biz');
  const by={}; exp.filter(t=>!t.refund&&!t.fee).forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount); ref.forEach(t=>by[t.cat]=(by[t.cat]||0)-t.amount);
  const cats=Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const refunds=exp.filter(t=>t.refund).reduce((a,t)=>a+t.amount,0);
  if(!r.earned&&!r.collected&&!r.cost&&!sm.pending) return `<div class="empty"><div class="h">مفيش حركة إيجارات في ${monthLabel(mk)}</div>
    <div class="p">الحجوزات والعقود ومصاريف الوحدات بتظهر هنا لوحدها، بعيد عن فلوسك الشخصية.</div></div>`+yearCard('biz');
  return `<div class="hero"><div class="cap">صافي الإيجارات الفعلي</div>
      <div class="big ${r.profit>=0?'pos':'neg'}">${r.profit>=0?'+':''}${money(r.profit)}<span class="cur">${cur}</span></div>
      <div class="legs"><span>اتحصّل <b>${money0(r.collected)}</b></span><span>مصاريف <b>${money0(r.cost)}</b></span>${sm.nights?`<span>ليالي <b>${sm.nights}</b></span>`:''}</div>
      <div class="cmp">على الليالي: مستحق <span class="num">${money0(r.earned)}</span> · مكسب <span class="num">${money0(r.profitEarned)}</span> ${cur}</div></div>
    <div class="card"><h3>الفعلي مقابل على الليالي</h3>
      <div class="kv"><span>مستحق الشهر ده${S.rents.length?' (ليالي + عقود)':' على الليالي'}</span><b>${money(r.earned)} ${cur}</b></div><div class="perf"></div>
      <div class="kv"><span>اتحصّل فعلاً</span><b>${money(r.collected)} ${cur}</b></div><div class="perf"></div>
      <div class="kv"><span>المكسب على الليالي</span>${pf(r.profitEarned)}</div><div class="perf"></div>
      <div class="kv"><span>المكسب الفعلي</span>${pf(r.profit)}</div>
      <div class="foot">ليه الرقمين مختلفين؟
        ${ahead>0?`<br>• عرابين لحجوزات جاية بعد الشهر: <b>${money0(ahead)}</b>`:''}
        ${unpaid>0?`<br>• ليالي الشهر ده لسه فلوسها ما وصلتش: <b>${money0(unpaid)}</b>`:''}
        ${rentLate>0?`<br>• إيجار شهري لسه ما اتحصّلش: <b>${money0(rentLate)}</b>`:''}
        ${r.fees>0?`<br>• عمولات اتدفعت للمنصات الشهر ده: <b>${money0(r.fees)}</b> (على الليالي العمولة بتتخصم من كل حجز)`:''}
        ${refunds>0?`<br>• مبالغ رجعت لضيوف لغوا: <b>${money0(refunds)}</b>`:''}
        ${!ahead&&!unpaid&&!rentLate&&!r.fees&&!refunds?'<br>• حجوزات بتعدّي آخر الشهر بتتقسم بعدد لياليها، والفلوس بتتحسب يوم ما وصلت.':''}</div></div>
    ${unitCards(mk)}
    ${cats.length?`<div class="card"><h3>مصاريف الوحدات بالتصنيف</h3>${cats.map(([id,v])=>{const c=catOf(id);return `<div class="kv" style="padding:5px 0"><span>${c.emoji} ${esc(c.name)}</span><b>${money(v)}</b></div>`;}).join('')}</div>`:''}
    ${yearCard('biz')}`;

/* iPhone home-screen apps can't print, so the report becomes a real PDF file:
   the page is photographed (html2canvas), cut into A4 pages at row boundaries (jsPDF),
   and handed to the share sheet — Save to Files, WhatsApp, Mail… */
let pdfLibs=null;
const loadScript=src=>new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=bad; document.head.appendChild(s); });
async function makePdf(name){
  const btn=$('#repPdf'); btn.disabled=true; const label=btn.textContent; btn.textContent='⏳ بيتجهز…';
  try{
    pdfLibs=pdfLibs||Promise.all([loadScript('vendor/html2canvas.min.js'),loadScript('vendor/jspdf.umd.min.js')]);
    await pdfLibs; await document.fonts.ready;
    const stage=$('#printArea'), W=794, PH=Math.round(W*297/210), S2=2;
    const canvas=await html2canvas(stage,{scale:S2,backgroundColor:'#ffffff',windowWidth:W,logging:false});
    /* page breaks fall between rows / headings, never through a line of text */
    /* a heading or a table's header row never ends a page: cut before the heading, or after the first data row */
    const top=stage.getBoundingClientRect().top;
    const cuts=[...stage.querySelectorAll('h2,tr')]
      .filter(e=>e.tagName!=='TR' || (e.previousElementSibling && !e.previousElementSibling.querySelector('th')))
      .map(e=>Math.round(e.getBoundingClientRect().top-top)).filter(y=>y>0).sort((a,b)=>a-b);
    const pages=[]; let y=0; const H=stage.scrollHeight;
    while(y<H-2){ let end=y+PH; if(end<H){ const c=cuts.filter(v=>v>y+PH*0.5&&v<=end).pop(); if(c) end=c; } else end=H; pages.push([y,end]); y=end; }
    const { jsPDF }=window.jspdf, pdf=new jsPDF({unit:'pt',format:'a4'}), pw=pdf.internal.pageSize.getWidth();
    pages.forEach(([a,b],i)=>{
      const c=document.createElement('canvas'); c.width=W*S2; c.height=(b-a)*S2;
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
      g.drawImage(canvas,0,a*S2,W*S2,(b-a)*S2,0,0,W*S2,(b-a)*S2);
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,pw,pw*(b-a)/W);
    });
    const blob=pdf.output('blob');
    let file=null; try{ file=new File([blob],name,{type:'application/pdf'}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:name}); }catch(e){ if(e.name!=='AbortError') throw e; }
    }else{
      const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    }
    window.__pdf={pages:pages.length,bytes:blob.size};
  }catch(e){
    console.error(e); alert('مقدرتش أعمل ملف الـPDF — اتأكد إن النت شغال أول مرة، وجرّب تاني.');
  }finally{ btn.disabled=false; btn.textContent=label; }
}

/* ═══════ reconciliation ═══════ */
function lastRecon(acct){
  const l=S.recons.filter(r=>r.acct===acct);
  return l.length?l[l.length-1]:null;
}
function expectedFor(acct){
  const L=lastRecon(acct);
  if(!L) return null;
  const d=S.tx.filter(t=>afterRecon(t,L)).reduce((s,t)=>s+txDelta(t,acct),0)
    +debtMoves().filter(f=>f.acct===acct&&afterRecon(f,L)).reduce((s,f)=>s+f.amount,0);
  return {base:L.cash, from:L.date, delta:d, expected:L.cash+d};
}

function walContracts(){
  const cur=esc(S.settings.cur);
  if(!S.rents.length) return `<button class="ghost" id="addRent">+ عقد إيجار شهري</button>`;
  const now=new Date();
  let due=0, coll=0;
  const cards=S.rents.map(r=>{
    const ms=months12(r.start,now);
    const overdue=m=>rentOverdue(m,r.dueDay,now);
    const late=ms.filter(m=>overdue(m) && rentLeft(r,m)>0);
    const lateAmt=late.reduce((s,m)=>s+rentLeft(r,m),0);
    due+=lateAmt;
    coll+=ms.reduce((s,m)=>s+rentPaid(r,m),0);
    return `<div class="card"><h3>${esc(r.tenant)}${r.unitId?' — '+esc(unitName(r.unitId)):''}
        <button data-rent="${r.id}">تعديل</button></h3>
      <div class="kv"><span>الإيجار الشهري</span><b>${money0(r.amount)} ${cur}</b></div>
      <div class="perf"></div>
      <div class="kv"><span>متأخر</span><b style="color:${late.length?'var(--red)':'var(--mint)'}">${late.length? money0(lateAmt)+' '+cur+' ('+late.length+' شهر)':'لا شيء'}</b></div>
      <div class="striplbl" style="padding:14px 0 6px">علّم الشهر لما يتحصّل</div>
      <div class="mgrid">${ms.map(m=>{
        const left=rentLeft(r,m), cls=!left?'paid':left<r.amount?'part':overdue(m)?'late':'';
        return `<button class="${cls}" data-pay="${r.id}|${m}">${AR_M3[+m.slice(5)-1]}<br>${m.slice(2,4)}</button>`;
      }).join('')}</div></div>`;
  }).join('');
  return `<div class="duo">
      <div class="box out"><div class="v">${money0(coll)}</div><div class="l">محصّل (١٢ شهر)</div></div>
      <div class="box inn"><div class="v">${money0(due)}</div><div class="l">متأخر</div></div></div>
    ${cards}<button class="ghost" id="addRent">+ عقد إيجار شهري</button>`;
}
function bindWal(){
  const b=$('#walBody');
  b.querySelectorAll('[data-acc]').forEach(x=>x.onclick=()=>acctSheet(x.dataset.acc));
  b.querySelectorAll('[data-plan]').forEach(x=>x.onclick=()=>planSheet(x.dataset.plan));
  b.querySelectorAll('[data-debt]').forEach(x=>x.onclick=()=>debtSheet(x.dataset.debt));
  b.querySelectorAll('[data-rent]').forEach(x=>x.onclick=()=>rentSheet(x.dataset.rent));
  b.querySelectorAll('[data-pay]').forEach(x=>x.onclick=()=>togglePay(x.dataset.pay));
  const g=id=>b.querySelector('#'+id);
  if(g('addAcc')) g('addAcc').onclick=()=>acctSheet(null);
  if(g('doRecon')) g('doRecon').onclick=()=>reconSheet(null);
  if(g('addPlan')) g('addPlan').onclick=()=>planSheet(null);
  if(g('addDebt')) g('addDebt').onclick=()=>debtSheet(null);
  if(g('addRent')) g('addRent').onclick=()=>rentSheet(null);
  if(g('addStay')) g('addStay').onclick=()=>staySheet(null);
  b.querySelectorAll('[data-stay]').forEach(x=>x.onclick=()=>staySheet(x.dataset.stay));
  b.querySelectorAll('[data-unit]').forEach(x=>x.onclick=()=>unitSheet(x.dataset.unit));
  if(g('addUnit')) g('addUnit').onclick=()=>unitSheet(null);
  b.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{
    const ds=x.dataset.day, on=S.stays.filter(st=>!st.cancelled && st.from<=ds && stayOut(st)>ds);
    if(on.length) staySheet(on[0].id); else staySheet(null,{from:ds});
  });
  if(g('sPrev')) g('sPrev').onclick=()=>{S.stayMonth=prevMonth(S.stayMonth);renderWal();};
  if(g('sNext')) g('sNext').onclick=()=>{S.stayMonth=nextMonth(S.stayMonth);renderWal();};
}

    closeSheet(); debtChanged(); toast('اتحذف'); };

/* the expense category for commissions and refunds to guests */
const bizExpCat=()=>(guessCat('عمولة',catsOf('exp'))||guessCat('رسوم',catsOf('exp'))||catsOf('exp').slice(-1)[0]).id;
/* a booking's money in the log: one income tx per payment that arrived while the app was in use
   (payments marked `pre` were already inside the opening balance and log nothing), one expense per
   refund to the guest, and one for the commission paid to the platform. All carry the booking and its unit. */
async function syncStayTx(st,before){
  const b=Array.isArray(before)?{pays:before}:(before||{});
  const moves=x=>[...(x.pays||[]),...(x.refunds||[]),...(x.feePay?[x.feePay]:[])];
  const keep=new Set(moves(st).map(p=>p.id));
  for(const p of moves(b)) if(!keep.has(p.id) && p.tx){ await Store.del('tx',p.tx); S.tx=S.tx.filter(x=>x.id!==p.tx); }

      dueDay:Math.min(31,Math.max(1,Number($('#tD').value)||1)),
      start:$('#tS').value||today(),cat:$('#tC').value,note:$('#tN').value.trim()};
    if(id){ Object.assign(r,v); delete r.unit; await Store.put('rent',r);
      /* the rent already collected follows the contract to its unit */
      for(const t of S.tx) if(t.rent===r.id && (t.unitId||'')!==v.unitId){
        if(v.unitId) t.unitId=v.unitId; else delete t.unitId; await Store.put('tx',t); } }
    else{ const nr={id:uid(),...v,paid:[]}; S.rents.push(nr); await Store.put('rent',nr); }
    closeSheet(); renderWal(); renderLog(); toast('تم');
  };
  const d=$('#tDel');
  if(d) d.onclick=async()=>{ if(!confirm('حذف العقد ده؟')) return;
    await Store.del('rent',id); S.rents=S.rents.filter(x=>x.id!==id);
    closeSheet(); renderWal(); toast('اتحذف'); };
}
function togglePay(key){
  const [id,m]=key.split('|');
  const r=S.rents.find(x=>x.id===id); if(!r) return;
  const cur=esc(S.settings.cur), got=rentPaid(r,m), left=r.amount-got;
  const head=`<h2>إيجار ${monthLabel(m)}</h2><p class="lede">${esc(r.tenant)}${r.unitId?' — '+esc(unitName(r.unitId)):''}</p>`;
  /* income this month's collection logged, still in the log */
  const logged=()=>((r.txs||{})[m]||[]).map(i=>S.tx.find(t=>t.id===i)).filter(Boolean);
  const unmark=async()=>{
    const inc=logged();
    if(inc.length && !confirm(`هيتمسح كمان الدخل اللي اتسجل (${money(sum(inc))} ${S.settings.cur}). تكمل؟`)) return;
    for(const t of inc){ await Store.del('tx',t.id); S.tx=S.tx.filter(x=>x.id!==t.id); }
    r.paid=(r.paid||[]).filter(x=>x!==m);
    if(r.part) delete r.part[m];
    if(r.txs) delete r.txs[m];
    await Store.put('rent',r); closeSheet(); renderWal(); renderRail(); renderAccts(); renderLog();
    toast('اترجع غير محصّل');
  };
  if(!left){
    sheet(`${head}<div class="kv big"><span>اتحصّل بالكامل</span><b style="color:var(--mint)">${money(r.amount)} ${cur}</b></div>
      <div class="acts"><button class="del" id="ryUn">رجّعه غير محصّل</button><button class="no" onclick="closeSheet()">تمام</button></div>`);
    $('#ryUn').onclick=unmark;
    return;
  }
  sheet(`${head}
    ${got?`<div class="kv"><span>اتحصّل قبل كده</span><b style="color:var(--mint)">${money(got)} ${cur}</b></div><div class="perf"></div>`:''}
    <div class="kv big"><span>فاضل</span><b>${money(left)} ${cur}</b></div>
    <div class="f" style="margin-top:14px"><div class="row2">
      <div><label>المبلغ اللي استلمته</label><input id="ryAmt" type="number" inputmode="decimal" step="0.01" value="${left}"></div>
      <div><label>استلمته يوم</label><input id="ryD" type="date" value="${today()}"></div>
    </div></div>
    <div class="f"><label>استلمته في أنهي حساب؟</label><select id="ryAcct">${acctOpts(defAcct())}</select></div>
    <label class="chk"><input type="checkbox" id="ryRec" checked><span>سجّله دخل في الحساب ده</span></label>
    <div class="acts">${got?'<button class="del" id="ryUn">امسح المحصّل</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="ryOk">سجّل</button></div>`);
  if($('#ryUn')) $('#ryUn').onclick=unmark;
  $('#ryOk').onclick=async()=>{
    const a=Number($('#ryAmt').value);
    if(!(a>0) || a>left+0.005){ $('#ryAmt').focus(); return toast(`المبلغ لازم يكون أكبر من 0 ولحد ${money(left)}`); }
    const acct=$('#ryAcct').value, rec=$('#ryRec').checked, full=a>=left-0.005;
    const before={paid:(r.paid||[]).slice(),part:{...(r.part||{})}};
    if(full){ r.paid=[...(r.paid||[]).filter(x=>x!==m),m]; if(r.part) delete r.part[m]; }
    else r.part={...(r.part||{}),[m]:got+a};
    await Store.put('rent',r);
    closeSheet(); renderWal();
    /* dated the day it came in, so balances and reconciliations line up; the note names the month */
    if(rec){
      const t=await commit({kind:'inc',amount:a,cat:r.cat,acct,rent:r.id,...(r.unitId?{unitId:r.unitId}:{}),
        note:`إيجار ${monthLabel(m)} — ${r.tenant}${full&&!got?'':' (جزء)'}`,date:$('#ryD').value||today()},
        async()=>{ Object.assign(r,before); r.txs[m]=(r.txs[m]||[]).filter(i=>i!==t.id);
          await Store.put('rent',r); renderWal(); });
      r.txs={...(r.txs||{}),[m]:[...((r.txs||{})[m]||[]),t.id]};
      await Store.put('rent',r);
    }
    else toast(full?'اتحصّل بالكامل':`اتحصّل ${money0(got+a)} من ${money0(r.amount)}`);
    renderWal();
  };
}
