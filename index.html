  year:{t:'آخر ١٢ شهر',b:()=>`<p>لكل شهر عمودين: <b>مصاريف</b> و<b>دخل</b>. الشهور اللي عمود الدخل فيها أطول هي الشهور اللي حوّشت فيها.</p>`},
  goals:{t:'أهداف الادخار',b:()=>`<p>حاجة عايز تحوّش لها (عربية، تجديد الشقة…). اكتب المبلغ المطلوب والتاريخ، وكل ما تحوّش سجّل.</p>
    <p>التطبيق يقولك محتاج تحوّش كام في الشهر علشان توصل في ميعادك.</p>`},
  biz:{t:'فلوس الإيجارات',b:()=>`<p><b>اللي وصلك</b> = الفلوس اللي دخلت جيبك فعلاً الشهر ده من الحجوزات والإيجار، ناقص مصاريف الشقة.</p>
    <p><b>المفروض يدخل</b> = قيمة الليالي اللي اتسكنت الشهر ده والإيجار الشهري، حتى لو الفلوس لسه ما وصلتش.</p>
    <p>مثال: ضيف دفع عربون في سبتمبر لحجز في أكتوبر. العربون في «اللي وصلك» بتاع سبتمبر، وقيمة الليالي في «المفروض» بتاع أكتوبر.</p>`},
  worth:{t:'إجمالي فلوسك',b:()=>`<p>مجموع الرصيد اللي في كل حساباتك دلوقتي: كاش + بنك + محافظ. والعملات التانية بسعرها بالجنيه.</p>
    <p>ده بيتغير مع كل مصروف أو دخل أو تحويل تسجّله. ولو مش مظبوط، اعمل «عدّ الفلوس».</p>`},
  unit:{t:'مكسب كل وحدة',b:()=>`<p>لكل شقة: <b>المفروض يدخل</b> منها، و<b>اللي وصلك</b> فعلاً، و<b>مصاريفها</b> (المتعلّمة «تابع لوحدة»).</p>
    <p>المكسب = الدخل ناقص مصاريفها، بالطريقتين.</p>`},
  stays:{t:'دخل الحجوزات',b:()=>`<p>قيمة الليالي اللي اتسكنت الشهر ده بعد عمولة المنصة. الحجز اللي بيعدّي آخر الشهر بيتقسم على الشهرين بعدد لياليه.</p>
    <p><b>متأجرة X% من الشهر</b> = كام ليلة اتأجرت من ليالي الشهر.</p>`},
  acct:{t:'صرفت من الحساب ده',b:()=>`<p>المصاريف اللي اتدفعت من الحساب ده بس، في الشهر اللي مختاره، مقسّمة بالتصنيف.</p>
    <p style="color:var(--dim)">التحويلات والسلف وسداد الآجل مش مصاريف، علشان كده ظاهرين في سطر لوحدهم.</p>`}
};
function helpSheet(k){
  const h=HELP[k]; if(!h) return;
  sheet(`<h2>${h.t}</h2><div class="story" style="margin-top:8px">${h.b(helpCtx())}</div>
    <div class="acts"><button class="go" onclick="closeSheet()">فهمت</button></div>`);
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-help]'); if(!b) return;
  e.preventDefault(); e.stopPropagation(); helpSheet(b.dataset.help); },true);

/* where this month's personal spending is heading: what's spent plus the rest at the usual rate.
   Without a usual month yet, a straight line once 10 days have passed; before that, nothing (null) */
function monthPace(mk,E){
  const now=new Date(), thisM=today().slice(0,7);
  if(mk!==thisM) return E;
  const p=habitPlan(); if(p.n) return Math.max(E,p.paceTotal);
  return now.getDate()>=10?E/now.getDate()*dim(now.getFullYear(),now.getMonth()+1):null;
}
/* the month in a few plain sentences */
function monthStory({mk,sc,E,I,pE,B,isThis,dLeft,res,exp,ref,personal}){
  const cur=esc(S.settings.cur), n=v=>`<b class="num">${money0(v)}</b> ${cur}`, out=[];
  if(I>0) out.push(`دخلك ${n(I)} وصرفت ${n(E)}، ${I-E>=0?`يعني فضل معاك ${n(I-E)}.`:`يعني صرفت أكتر من دخلك بـ ${n(E-I)}.`}`);
  else if(E>0) out.push(`صرفت ${n(E)} ${isThis?'لحد النهاردة':'في الشهر ده'}.`);
  const by={}; exp.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount); ref.forEach(t=>by[t.cat]=(by[t.cat]||0)-t.amount);
  const top=Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])[0];
  if(top&&E>0){ const c=catOf(top[0]); out.push(`أكتر حاجة صرفت عليها ${c.emoji} <b>${esc(c.name)}</b>: ${n(top[1])} (${Math.round(top[1]/E*100)}% من مصاريفك).`); }
  if(personal&&isThis&&B>0){ const left=B-E-(res||0);
    out.push(left>=0?`فاضل من ميزانيتك ${n(left)}، يعني تقدر تصرف حوالي ${n(left/Math.max(1,dLeft))} في اليوم لآخر الشهر.`
      :`عدّيت ميزانية الشهر بـ ${n(-left)}.`); }
  if(pE>0&&E>0&&!isThis&&inMonth(prevMonth(mk),'exp',sc).length>=5){ const d=E-pE; out.push(`صرفت ${d>=0?'أكتر':'أقل'} من ${monthLabel(prevMonth(mk))} بـ ${n(Math.abs(d))}.`); }
  if(!out.length) return '';
  return `<div class="card story"><h3>الخلاصة</h3>${out.map(x=>`<p>${x}</p>`).join('')}</div>`;
}

/* ═══════ REPORTS ═══════ */
function renderRep(){
  const mk=S.repMonth, cur=esc(S.settings.cur), thisM=today().slice(0,7);
  /* with rentals around, the report is personal by default — the rentals have their own view */
  const biz=hasBiz(), sc=biz?(S.repScope||'mine'):'all';
  const all=inMonth(mk,null,sc);
  const exp=inMonth(mk,'exp',sc), ref=inMonth(mk,'ref',sc), inc=inMonth(mk,'inc',sc);
  const E=expNet(mk,sc), I=incNet(mk,sc), pE=expNet(prevMonth(mk),sc);
  /* budgets, alerts and «committed vs optional» are about personal money only */
  const personal=sc!=='all'||!biz;
  const B=budgetFor(mk);
  const [Y,M]=mk.split('-').map(Number), D=dim(Y,M);
  const isThis=mk===thisM, now=new Date();
  const dLeft=isThis?D-now.getDate()+1:0, dPast=daysElapsed(mk,now);

  const nav=`<div class="mnav">
    <button id="rNext" ${mk>=thisM?'disabled':''} aria-label="بعده">‹</button>
    <span class="lbl">${monthLabel(mk)}</span>
    <button id="rPrev" aria-label="قبله">›</button></div>`+(biz?`<div class="seg" id="repScope" style="margin:0 0 12px">
      ${[['mine','شخصي'],['biz','🏘 الإيجارات'],['all','الكل']].map(([k,l])=>`<button data-sc="${k}" aria-pressed="${sc===k}">${l}</button>`).join('')}</div>`:'');

  if(sc==='biz'){ $('#repBody').innerHTML=nav+repBiz(mk); return bindRepNav(); }
  if(!all.length){
    $('#repBody').innerHTML=nav+goalsCard()+`<div class="empty"><div class="h">مفيش حركات في ${monthLabel(mk)}</div>
      <div class="p">سجّل مصروف أو دخل وهيبان هنا فوراً.</div></div>`+(PRO()?yearCard(sc):'');
    return bindRepNav();
  }

  /* this month is compared with the same days of last month (1–5 against 1–5), not with all of it */
  let cmp='مفيش شهر سابق للمقارنة';
  const pm=prevMonth(mk), upTo=isThis?`${pm}-${String(Math.min(now.getDate(),dim(+pm.slice(0,4),+pm.slice(5)))).padStart(2,'0')}`:null;
  const pSame=isThis?inMonth(pm,'exp',sc).filter(t=>t.date<=upTo).reduce((a,t)=>a+t.amount,0)-inMonth(pm,'ref',sc).filter(t=>t.date<=upTo).reduce((a,t)=>a+t.amount,0):pE;
  /* a month the app barely saw (a handful of entries, e.g. one bill logged later) isn't a fair yardstick */
  const tracked=inMonth(pm,'exp',sc).length>=5;
  if(pSame>0&&tracked){
    const p=((E-pSame)/pSame)*100, up=p>=0;
    cmp=`المصاريف <span class="${up?'up':'down'}">${up?'▲':'▼'} <b>${Math.abs(p).toFixed(0)}%</b></span> عن ${isThis?`نفس الأيام من ${monthLabel(pm)}`:monthLabel(pm)} (<span class="num">${money0(pSame)}</span>)`;
  }else if(isThis&&pE>0&&tracked) cmp=`${monthLabel(pm)} كله كان <span class="num">${money0(pE)}</span>`;
  else if(pE>0&&!tracked) cmp=`${monthLabel(pm)} مش متسجل فيه كفاية للمقارنة`;
  const net=I-E;
  const hero = I>0
    ? `<div class="hero"><div class="cap">اللي فضل معاك الشهر ده${qh('net')}</div>
        <div class="big ${net>=0?'pos':'neg'}">${net>=0?'+':''}${money(net)}<span class="cur">${cur}</span></div>
        <div class="legs"><span>دخل <b>${money0(I)}</b></span><span>مصاريف <b>${money0(E)}</b></span></div>
        <div class="cmp">${cmp}</div></div>`
    : `<div class="hero"><div class="cap">إجمالي المصاريف${qh('spent')}</div>
        <div class="big">${money(E)}<span class="cur">${cur}</span></div>
        <div class="cmp">${cmp}</div></div>`;

  /* anomaly alerts */
  let anom='';
  if(PRO()&&personal){
    const list=anomalies(mk);
    if(list.length) anom=`<div class="card warn"><h3>انتبه</h3>${list.map(a=>
      `<div style="font-size:13px;line-height:1.7;margin-bottom:6px">${a.c.emoji} <b>${esc(a.c.name)}</b> أعلى
       <b style="color:var(--red)">${a.pct.toFixed(0)}%</b> من متوسط الشهور اللي فاتت
       (<span class="num">${money0(a.cur)}</span> مقابل <span class="num">${money0(a.avg)}</span>)</div>`).join('')}</div>`;
  }

  const res=isThis&&PRO()?reservedThisMonth():0;
  const budCard = !personal?`<div class="card"><div class="foot" style="margin:0">الميزانية والتنبيهات بتتحسب على مصاريفك الشخصية بس — شوفها في «شخصي».</div></div>`
    : B>0? `<div class="card"><h3><span>الميزانية${qh('budget')}</span><button id="bEdit">تعديل</button></h3>
      <div class="bar tall${E>B?' over':''}"><i style="width:${Math.min(E/B*100,100)}%"></i></div>
      <div class="foot">صرفت <b>${money0(E)}</b> من <b>${money0(B)}</b> ${cur} — ${E<=B?`فاضل <b class="pos">${money0(B-E)}</b>`:`زيادة <b class="neg">${money0(E-B)}</b>`}
      ${res>0?`<br>متشال <b>${money0(res)}</b> ${cur} لمصاريف جاية`:''}
      ${isThis?`<br>${dLeft} يوم فاضل · متاح <b>${money0((B-E-res)/dLeft)}</b> ${cur} في اليوم`:''}
      ${monthPace(mk,E)!=null?`<br>متوقع الشهر يقفل على حوالي <b>${money0(monthPace(mk,E))}</b> ${cur}`:''}</div></div>`
    : `<div class="card"><h3>الميزانية${qh('budget')}</h3><div class="foot" style="margin:0">محددتش ميزانية شهرية.
        <button id="bEdit" style="color:var(--brand);font-weight:600">حدّدها</button> وهتشوف «متاح النهاردة كام».</div></div>`;

  const mx=Math.max(I,E,1), ratio=I>0?E/I*100:0;
  const ie = I>0? `<div class="card"><h3>الدخل والمصاريف</h3>
      <div class="brow"><div class="top"><span class="l"><i class="sw" style="background:var(--mint)"></i><span class="t">الدخل</span></span>
        <span class="r">${money(I)}</span></div><div class="bar mintbar"><i style="width:${I/mx*100}%"></i></div></div>
      <div class="brow"><div class="top"><span class="l"><i class="sw" style="background:var(--brand)"></i><span class="t">المصاريف</span></span>
        <span class="r">${money(E)}</span></div><div class="bar"><i style="width:${E/mx*100}%"></i></div></div>
      <div class="foot">صرفت <b>${ratio.toFixed(0)}%</b> من دخل الشهر${net>=0?` — ووفّرت <b class="pos">${money0(net)}</b> ${cur}`:` — وزيادة <b class="neg">${money0(-net)}</b> ${cur}`}</div></div>` : '';

  /* fixed vs variable */
  let fv='';
  if(E>0&&personal){
    const catNet=id=>sum(exp.filter(t=>t.cat===id))-sum(ref.filter(t=>t.cat===id));
    let F=0,V=0;
    catsOf('exp').forEach(c=>{ const v=catNet(c.id); if(v>0){ if(c.fixed) F+=v; else V+=v; } });
    const tot=F+V;
    if(tot>0) fv=`<div class="card"><h3><span>أساسي وكماليات${qh('fv')}</span><button id="fvEdit">تعديل</button></h3>
      <div class="split"><i style="width:${F/tot*100}%;background:var(--iris)"></i><i style="width:${V/tot*100}%;background:var(--brand)"></i></div>
      <div class="splegend">
        <span><i class="sw" style="background:var(--iris)"></i>أساسي <b>${money0(F)}</b> <small style="color:var(--dim)">${(F/tot*100).toFixed(0)}%</small></span>
        <span><i class="sw" style="background:var(--brand)"></i>كماليات <b>${money0(V)}</b> <small style="color:var(--dim)">${(V/tot*100).toFixed(0)}%</small></span>
      </div>
      <div class="foot">لو استغنيت عن الكماليات تقدر توفّر لحد <b>${money0(V)}</b> ${cur} في الشهر.</div></div>`;
  }

  /* per account */
  let acc='';
  if(E>0){
    const list=liveAccts().map(a=>({a,v:sum(exp.filter(t=>t.acct===a.id&&!t.credit))-sum(ref.filter(t=>t.acct===a.id))}))
                          .filter(x=>x.v>0).sort((x,y)=>y.v-x.v);
    if(list.length) acc=`<div class="card"><h3>مصاريفك حسب الحساب${qh('acc')}</h3>
      ${list.map(({a,v})=>`<div class="brow">
        <div class="top"><span class="l"><em style="font-style:normal">${a.emoji}</em><span class="t">${esc(a.name)}</span>
          <span class="pct">${(v/E*100).toFixed(0)}%</span></span><span class="r">${money(v)}</span></div>
        <div class="bar${a.type==='bank'?' irisbar':' mintbar'}"><i style="width:${v/list[0].v*100}%"></i></div></div>`).join('')}</div>`;
  }

  function breakdown(rowsP,rowsN,total,mint){
    const by={};
    rowsP.forEach(t=>{by[t.cat]=(by[t.cat]||0)+t.amount;});
    (rowsN||[]).forEach(t=>{by[t.cat]=(by[t.cat]||0)-t.amount;});
    const list=Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    if(!list.length) return '';
    const max=list[0][1];
    return list.map(([id,v])=>{
      const c=catOf(id), pct=total?v/total*100:0;
      const hasB=!mint&&c.budget>0, over=hasB&&v>c.budget;
      return `<div class="brow"${tone(c)}>
        <div class="top"><span class="l"><em style="font-style:normal">${c.emoji}</em><span class="t">${esc(c.name)}</span>
          <span class="pct">${pct.toFixed(0)}%</span></span><span class="r">${money(v)}</span></div>
        <div class="bar${mint?' mintbar':''}${over?' over':''}"><i style="width:${hasB?Math.min(v/c.budget*100,100):v/max*100}%"></i></div>
        ${hasB?`<div class="bud${over?' over':''}">ميزانية ${money0(c.budget)} ${cur} — ${over?`زيادة ${money0(v-c.budget)}`:`فاضل ${money0(c.budget-v)}`}</div>`:''}
      </div>`;
    }).join('');
  }

  const daily=Array(D).fill(0);
  exp.forEach(t=>{daily[parseISO(t.date).getDate()-1]+=t.amount;});
  ref.forEach(t=>{daily[parseISO(t.date).getDate()-1]-=t.amount;});
  const maxD=Math.max(...daily,1), logged=daily.filter(v=>v>0).length;
  const top5=[...exp].sort((a,b)=>b.amount-a.amount).slice(0,5);

  /* the essentials first; everything else waits behind «تفاصيل أكتر» */
  const story=monthStory({mk,sc,E,I,pE,B,isThis,dLeft,res,exp,ref,personal});
  const hasGoals=S.goals.length>0;
  $('#repBody').innerHTML = nav + hero + story + anom + budCard + (personal&&isThis?habitsCard():'')
    + (E>0?`<div class="card"><h3>مصاريفك بالتصنيف${qh('cats')}</h3>${breakdown(exp,ref,E,false)}</div>`:'')
    + (hasGoals?goalsCard():'')
    + `<details class="more" id="repMore"${S.repMore?' open':''}><summary>📊 تفاصيل أكتر ${S.repMore?'▴':'▾'}</summary>`
    + (I>0?`<div class="card"><h3>دخلك بالتصنيف${qh('inc')}</h3>${breakdown(inc,null,I,true)}</div>`:'')
    + fv + (PRO()?acc+reconCard(mk):'') + `
    <div class="card" style="padding-bottom:4px;margin-bottom:0"><h3 style="margin:0">أرقام صغيرة${qh('stats')}</h3></div>
    <div class="stats">
      <div class="stat"><div class="v">${money0(E/dPast)}</div><div class="l">متوسط مصروف يومي</div></div>
      <div class="stat"><div class="v">${logged}<span style="font-size:13px;color:var(--dim)"> / ${D}</span></div><div class="l">أيام فيها مصاريف</div></div>
      <div class="stat"><div class="v">${exp.length}</div><div class="l">عدد المصاريف</div></div>
      <div class="stat"><div class="v">${exp.length?money0(sum(exp)/exp.length):0}</div><div class="l">متوسط المصروف</div></div>
    </div>
    ${E>0?`<div class="card"><h3>مصاريف يوم بيوم${qh('daily')}</h3>
      <div class="days">${daily.map(v=>`<i class="${v===maxD&&v>0?'hot':''}" style="height:${Math.max(v,0)/maxD*100}%"></i>`).join('')}</div>
      <div class="dayax"><span>1</span><span>${Math.ceil(D/2)}</span><span>${D}</span></div></div>`:''}
    ${top5.length?`<div class="card"><h3>أكبر ${top5.length} مصاريف${qh('top')}</h3><div class="roll" style="background:transparent">
      ${top5.map(t=>{const c=catOf(t.cat);return `<div class="row" style="padding:9px 0">
        <em${tone(c)}>${c.emoji}</em><span class="meta"><span class="nm">${esc(t.note||c.name)}</span>
        <span class="nt">${dayLabel(t.date)} · ${esc(acctOf(t.acct).name)}</span></span>
        <span class="val">${money(t.amount)}</span></div>`;}).join('<div class="perf"></div>')}
      </div></div>`:''}` + (PRO()?yearCard(sc):'') + (hasGoals?'':goalsCard()) + `</details>`;
  bindRepNav();
  const more=$('#repMore'); if(more) more.addEventListener('toggle',()=>{ S.repMore=more.open; more.querySelector('summary').textContent=`📊 تفاصيل أكتر ${more.open?'▴':'▾'}`; });
  const be=$('#bEdit'); if(be) be.onclick=budgetSheet;
  const fe=$('#fvEdit'); if(fe) fe.onclick=fixedSheet;
  const hp=$('#habPlan'); if(hp) hp.onclick=planBudgetSheet;
  const rb=$('#reconBtn'); if(rb) rb.onclick=()=>reconSheet(null);
}
/* the rentals' month: what actually came in and went out, next to what the month earned by the
   nights slept — with the reasons the two differ spelled out */
function repBiz(mk){
  const cur=esc(S.settings.cur), r=rentalMonth(rentalData(),mk), sm=staySummary(S.stays,mk);
  const end=`${mk}-${String(dim(+mk.slice(0,4),+mk.slice(5,7))).padStart(2,'0')}`;
  /* money that came in this month for stays that start later */
  const ahead=S.stays.filter(st=>!st.cancelled&&st.from>end).reduce((a,st)=>a+(st.pays||[]).filter(p=>!p.pre&&p.date.slice(0,7)===mk).reduce((b,p)=>b+p.amount,0),0);
  /* this month's nights not paid yet */
  const unpaid=S.stays.filter(st=>stayNightsIn(st,mk)&&stayLeft(st)>0.005).reduce((a,st)=>a+stayLeft(st),0);
  const rentLate=S.rents.reduce((a,x)=>a+(mk>=String(x.start||'').slice(0,7)&&mk<=today().slice(0,7)?rentLeft(x,mk):0),0);
  const pf=v=>`<b class="num" style="color:${v>=0?'var(--mint)':'var(--red)'}">${v>=0?'+':''}${money(v)}</b>`;
  const exp=inMonth(mk,'exp','biz'), ref=inMonth(mk,'ref','biz');
  const by={}; exp.filter(t=>!t.refund&&!t.fee).forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount); ref.forEach(t=>by[t.cat]=(by[t.cat]||0)-t.amount);
  const cats=Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);

/* iPhone home-screen apps can't print, so the report becomes a real PDF file:
   the page is photographed (html2canvas), cut into A4 pages at row boundaries (jsPDF),
   and handed to the share sheet — Save to Files, WhatsApp, Mail… */
let pdfLibs=null;
const loadScript=src=>new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=bad; document.head.appendChild(s); });
async function makePdf(name){
  const btn=$('#repPdf'); btn.disabled=true; const label=btn.textContent; btn.textContent='⏳ بيتجهز…';
  try{
    pdfLibs=pdfLibs||Promise.all([loadScript('vendor/html2canvas.min.js'),loadScript('vendor/jspdf.umd.min.js')]);
    await pdfLibs; await document.fonts.ready;
    const stage=$('#printArea'), W=794, PH=Math.round(W*297/210), S2=2;
    const canvas=await html2canvas(stage,{scale:S2,backgroundColor:'#ffffff',windowWidth:W,logging:false});
    /* page breaks fall between rows / headings, never through a line of text */
    /* a heading or a table's header row never ends a page: cut before the heading, or after the first data row */
    const top=stage.getBoundingClientRect().top;
    const cuts=[...stage.querySelectorAll('h2,tr')]
      .filter(e=>e.tagName!=='TR' || (e.previousElementSibling && !e.previousElementSibling.querySelector('th')))
      .map(e=>Math.round(e.getBoundingClientRect().top-top)).filter(y=>y>0).sort((a,b)=>a-b);
    const pages=[]; let y=0; const H=stage.scrollHeight;
    while(y<H-2){ let end=y+PH; if(end<H){ const c=cuts.filter(v=>v>y+PH*0.5&&v<=end).pop(); if(c) end=c; } else end=H; pages.push([y,end]); y=end; }
    const { jsPDF }=window.jspdf, pdf=new jsPDF({unit:'pt',format:'a4'}), pw=pdf.internal.pageSize.getWidth();
    pages.forEach(([a,b],i)=>{
      const c=document.createElement('canvas'); c.width=W*S2; c.height=(b-a)*S2;
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
      g.drawImage(canvas,0,a*S2,W*S2,(b-a)*S2,0,0,W*S2,(b-a)*S2);
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,pw,pw*(b-a)/W);
    });
    const blob=pdf.output('blob');
    let file=null; try{ file=new File([blob],name,{type:'application/pdf'}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:name}); }catch(e){ if(e.name!=='AbortError') throw e; }
    }else{
      const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    }
    window.__pdf={pages:pages.length,bytes:blob.size};
  }catch(e){
    console.error(e); alert('مقدرتش أعمل ملف الـPDF — اتأكد إن النت شغال أول مرة، وجرّب تاني.');
  }finally{ btn.disabled=false; btn.textContent=label; }
}

const catTotals=(mk,sc)=>{ const by={};

/* the last (up to) 6 complete months with spending — a first month the app started well into is left out,
   it would make the usual look smaller than it is */
function habitPlan(){
  const sc=MINE(), thisM=today().slice(0,7), now=new Date();
  const start=S.tx.reduce((m,t)=>t.date<m?t.date:m,today()), sm=start.slice(0,7);
  const months=[];
  for(let k=prevMonth(thisM),i=0;i<12&&months.length<6&&k>=sm;i++,k=prevMonth(k)){
    if(k===sm && +start.slice(8)>3) break;
    /* months with only a few entries weren't really tracked — they'd drag the usual down */
    const by=catTotals(k,sc); if(inMonth(k,'exp',sc).length>=5 && Object.values(by).some(v=>v>0)) months.unshift({mk:k,by});
  }
  return spendingPlan(months,catsOf('exp'),{by:catTotals(thisM,sc),elapsed:now.getDate(),days:dim(now.getFullYear(),now.getMonth()+1)});
}

/* ═══════ reconciliation ═══════ */
function lastRecon(acct){
  const l=S.recons.filter(r=>r.acct===acct);
  return l.length?l[l.length-1]:null;
}
function expectedFor(acct){
  const L=lastRecon(acct);
  if(!L) return null;
  const d=S.tx.filter(t=>afterRecon(t,L)).reduce((s,t)=>s+txDelta(t,acct),0)
    +moneyMoves().filter(f=>f.acct===acct&&afterRecon(f,L)).reduce((s,f)=>s+f.amount,0);
  return {base:L.cash, from:L.date, delta:d, expected:L.cash+d};
}
function reconCard(mk){
  if(mk!==today().slice(0,7)) return '';
  const a=S.accts.find(x=>x.type==='cash'&&!x.archived&&!x.ccy);
  if(!a) return '';
  const e=expectedFor(a.id), cur=esc(S.settings.cur);
  if(!e) return `<div class="card"><h3><span>عدّ الكاش اللي معاك${qh('recon')}</span><button id="reconBtn">ابدأ</button></h3>
    <div class="foot" style="margin:0">اكتب الكاش اللي معاك فعلاً مرة واحدة، وكل مرة تعدّ بعد كده التطبيق هيقولك الفرق بين المفروض يكون معاك واللي معاك فعلاً — والفرق ده هو اللي نسيت تسجّله.</div></div>`;
  return `<div class="card"><h3><span>عدّ فلوس ${esc(a.name)}${qh('recon')}</span><button id="reconBtn">عدّيت تاني</button></h3>
    <div class="kv"><span>آخر مرة عدّيت (${dayLabel(e.from)})</span><b>${money0(e.base)} ${cur}</b></div>
    <div class="perf"></div><div class="kv"><span>الحركة بعدها</span><b style="color:${e.delta>=0?'var(--mint)':'var(--chalk)'}">${e.delta>=0?'+':''}${money0(e.delta)}</b></div>
    <div class="perf"></div><div class="kv big"><span>المفروض معاك</span><b>${money0(e.expected)} ${cur}</b></div></div>`;
}
function reconSheet(acctId){
  const acct=acctId||(S.accts.find(x=>x.type==='cash'&&!x.archived&&!x.ccy)||liveAccts()[0]).id;

      await Store.put('recon',r); S.recons.push(r);
      closeSheet(); renderRep(); renderWal(); toast('اتسجل الرصيد');
    };

  }
  sheet(`<h2>عدّ الفلوس — ${esc(a.name)}</h2>
    <p class="lede">عدّ اللي معاك فعلاً. الفرق هو اللي نسيت تسجّله.</p>
    ${pick}
    <div class="kv"><span>المفروض معاك</span><b>${money0(e.expected)} ${cur}</b></div>
    <div class="f" style="margin-top:13px"><label>معاك فعلاً (${cur})</label>
      <input id="rcAmt" type="number" inputmode="decimal" step="1"></div>
    <div id="rcOut"></div>
    <div class="acts"><button class="no" onclick="closeSheet()">إلغاء</button>
      <button class="go" id="rcOk">حفظ العدّ</button></div>`);

  const upd=()=>{
    const v=Number($('#rcAmt').value), out=$('#rcOut');
    if($('#rcAmt').value===''||!(v>=0)){ out.innerHTML=''; return; }
    const d=v-e.expected;
    if(Math.abs(d)<0.5){ out.innerHTML=`<div class="chk" style="border-color:var(--mint)">مطابق تماماً. تسجيلك مضبوط.</div>`; return; }
    out.innerHTML=`<div class="kv"><span>${d<0?'ناقص':'زيادة'}</span><b style="color:${d<0?'var(--red)':'var(--mint)'}">${money0(Math.abs(d))} ${cur}</b></div>
      <label class="chk"><input type="checkbox" id="rcAdj" checked>
      <span>سجّل الفرق كـ${d<0?' «مصاريف مش مسجلة»':' «دخل مش مسجل»'} علشان الحساب يتظبط</span></label>
      <p class="lede" style="margin:10px 0 0">لو الفرق ده سحب من الماكينة أو تحويل، اقفل هنا وسجّله من تاب «تحويل».</p>`;
  };
  $('#rcAmt').oninput=upd;
  $('#rcOk').onclick=async()=>{
    const v=Number($('#rcAmt').value);
    if($('#rcAmt').value===''||!(v>=0)){ $('#rcAmt').focus(); return; }
    const d=v-e.expected;
    if(Math.abs(d)>=0.5 && $('#rcAdj') && $('#rcAdj').checked){
      const kind=d<0?'exp':'inc';
      const nm=kind==='exp'?'مش مسجل':'دخل مش مسجل';
      let c=S.cats.find(x=>x.kind===kind && x.name===nm);
      if(!c){ c={id:uid(),emoji:'❓',name:nm,kind,order:S.cats.length,budget:0,fixed:false};
        S.cats.push(c); await Store.put('cats',c); }
      const t={id:uid(),kind,amount:Math.abs(d),cat:c.id,acct,note:'فرق العدّ',date:today(),at:Date.now()};
      await Store.put('tx',t); S.tx.push(t); sortTx();
    }
    const r={id:uid(),date:today(),at:Date.now(),acct,cash:v,expected:e.expected,diff:d};
    await Store.put('recon',r); S.recons.push(r);
    closeSheet(); renderCats(); renderRep(); renderRail(); renderWal();
    toast(Math.abs(d)<0.5?'مطابق تماماً':`فرق <span class="a">${money0(Math.abs(d))}</span> ${cur}`);
  };
}

/* one account: its balance, and for the month picked — what was spent from it by category,
   what came in, what moved to other accounts, and every movement */
/* one account or several together. One foreign-currency account shows its own currency; anything
   combined is in ج. Money moving between the picked accounts cancels out (it never left you). */
function acctDetail(accs,row){
  const one=accs.length===1?accs[0]:null, a=one||{name:'الحسابات دي'}, ids=new Set(accs.map(x=>x.id));
  const native=!!(one&&one.ccy), r=native?rateOf(one):1;
  const cur=esc(S.settings.cur), sym=native?esc(symOf(one)):cur, thisM=today().slice(0,7);
  const mk=S.accMonth&&S.accMonth<=thisM?S.accMonth:(S.accMonth=thisM);
  const d=t=>accs.reduce((s,x)=>s+(native?txDelta(t,x.id,x.ccy,r):txDelta(t,x.id)),0);
  const txs=S.tx.filter(t=>ids.has(t.acct)||ids.has(t.toAcct)).map(t=>({t,date:t.date,at:t.at||0,v:d(t)})).filter(x=>Math.abs(x.v)>0.0001);
  const conv=v=>v/r;

/* pick old personal expenses that were really for this unit — they move out of your personal
   spending and into the unit's costs. The ones whose note names the unit come first. */
function linkSheet(id){
  const u=unitOf(id); if(!u) return;
  const cur=esc(S.settings.cur), key=norm(u.name);
  const words=key.split(/\s+/).filter(w=>w.length>2);
  const hit=t=>{ const n=norm(t.note||''); return !!n && (n.includes(key)||words.some(w=>n.includes(w))); };
  const list=S.tx.filter(t=>(t.kind==='exp'||t.kind==='ref') && !isBiz(t))
    .sort((a,b)=>(hit(b)-hit(a))||b.date.localeCompare(a.date)).slice(0,150);
  sheet(`<h2>اربط مصاريف بوحدة «${esc(u.name)}»</h2>
    <p class="lede">علّم المصاريف اللي كانت للوحدة دي (نظافة، صيانة، كهربا…). هتتخصم من مكسبها وتخرج من مصاريفك الشخصية.</p>
    ${list.length?`<div class="list">${list.map(t=>{const c=catOf(t.cat);return `<label class="item" style="cursor:pointer">
      <input type="checkbox" data-lk="${t.id}" ${hit(t)?'checked':''} style="width:19px;height:19px;flex:none;accent-color:var(--brand)">
      <span class="nm">${c.emoji} ${esc(t.note||c.name)}<small>${dayLabel(t.date)} · ${esc(c.name)}${hit(t)?' · <b style="color:var(--brand)">مقترح</b>':''}</small></span>
      <span class="hint">${t.kind==='ref'?'+':''}${money0(t.amount)}</span></label>`;}).join('<div class="perf"></div>')}</div>`
      :'<div class="empty" style="padding:20px"><div class="p">مفيش مصاريف شخصية تربطها.</div></div>'}
    <div id="lkSum" style="font-size:12.5px;color:var(--dim);margin:10px 0"></div>
    <div class="acts"><button class="no" onclick="closeSheet()">إلغاء</button><button class="go" id="lkOk">اربط</button></div>`);
  const picked=()=>[...$('#sheet').querySelectorAll('[data-lk]:checked')].map(x=>S.tx.find(t=>t.id===x.dataset.lk));
  const upd=()=>{ const p=picked(); $('#lkSum').innerHTML=p.length?`${p.length} مصروف · <span class="num">${money0(p.reduce((a,t)=>a+(t.kind==='ref'?-t.amount:t.amount),0))}</span> ${cur}`:'ما اخترتش حاجة'; };
  $('#sheet').addEventListener('change',upd); upd();
  $('#lkOk').onclick=async()=>{
    const p=picked(); if(!p.length) return closeSheet();
    for(const t of p){ t.unitId=id; delete t.unit; }
    await Store.batch(p.map(t=>['put','tx',t]));
    closeSheet(); renderWal(); renderLog(); renderRail(); toast(`اتربط ${p.length} مصروف بوحدة «${esc(u.name)}»`);
  };
}
function unitSheet(id){
  const u=id?unitOf(id):{name:''};

  sheet(`<h2>${id?'الوحدة':'وحدة جديدة'}</h2>

    ${id?`<button type="button" class="ghost" id="uLink" style="margin-top:0">🔗 اربط مصاريف قديمة بالوحدة دي</button>`:''}
    <div class="acts">${id?`<button class="del" id="uDel">${used?(u.archived?'افتحها تاني':'اقفلها'):'حذف'}</button>`:'<button class="no" onclick="closeSheet()">إلغاء</button>'}

  $('#uOk').onclick=async()=>{
    const n=$('#uN').value.trim(); if(!n){ $('#uN').focus(); return; }

    if(id) u.name=n; else allUnits().push({id:uid(),name:n});
    await saveSettings(); closeSheet(); renderWal(); renderLog(); toast('تم');

  if($('#uLink')) $('#uLink').onclick=()=>linkSheet(id);

    if(used) u.archived=!u.archived;
    else{ if(!confirm('حذف الوحدة؟')) return; S.settings.units=allUnits().filter(x=>x.id!==id); }
    await saveSettings(); closeSheet(); renderWal(); toast(used?(u.archived?'اتقفلت — مش هتظهر في الاختيارات':'اتفتحت'):'اتحذفت');
  };
}

      <div class="cmp">وصلك فعلاً الشهر ده <span class="num">${money0(rm.collected)}</span> ${cur}${sm.fees>0?` · عمولات <span class="num">${money0(sm.fees)}</span>`:''}${sm.kept>0?` · من إلغاءات <span class="num">${money0(sm.kept)}</span>`:''}</div></div>
    ${sm.pending>0?`<div class="banner" style="margin-top:12px">فاضلك تحصّل <b class="num">${money0(sm.pending)} ${cur}</b> من ${sm.pendingN===1?'حجز':sm.pendingN+' حجوزات'} — دوس على الحجز وسجّل الدفعة لما توصل.</div>`:''}
    ${feeOwed>0?`<div class="banner" style="margin-top:12px">عليك عمولات للمنصات <b class="num">${money0(feeOwed)} ${cur}</b> عن حجوزات الضيف دفع فيها في الشقة — لما تدفعها علّمها في الحجز.</div>`:''}
    ${stayCalendar(mk)}

    <div class="list" style="margin-top:12px">${list.length?list.map(st=>`<button class="item" data-stay="${st.id}">${chIcon(st.channel)}
        <span class="nm">${esc(st.guest||CH[st.channel].name)}${st.unitId?' — '+esc(unitName(st.unitId)):''}
          <small>${stayDates(st)} · ${nightsLbl(st.nights)} · ${CH[st.channel].name}${st.cancelled?' · <b style="color:var(--red)">ملغي</b>':stayStatus(st)}</small></span>
        <span class="hint"${st.cancelled?' style="text-decoration:line-through;opacity:.6"':''}>${money0(stayNet(st))}</span><span class="chev">‹</span></button>`).join('<div class="perf"></div>')
      :`<div class="item" style="color:var(--dim);font-size:13px">مفيش حجوزات في ${monthLabel(mk)}.</div>`}</div>`

function walContracts(){
  const cur=esc(S.settings.cur);
  if(!S.rents.length) return `<button class="ghost" id="addRent">+ عقد إيجار شهري</button>`;
  const now=new Date();
  let due=0, coll=0;
  const cards=S.rents.map(r=>{
    const ms=months12(r.start,now);
    const overdue=m=>rentOverdue(m,r.dueDay,now);
    const late=ms.filter(m=>overdue(m) && rentLeft(r,m)>0);
    const lateAmt=late.reduce((s,m)=>s+rentLeft(r,m),0);
    due+=lateAmt;
    coll+=ms.reduce((s,m)=>s+rentPaid(r,m),0);
    return `<div class="card"><h3>${esc(r.tenant)}${r.unitId?' — '+esc(unitName(r.unitId)):''}
        <button data-rent="${r.id}">تعديل</button></h3>
      <div class="kv"><span>الإيجار الشهري</span><b>${money0(r.amount)} ${cur}</b></div>
      <div class="perf"></div>
      <div class="kv"><span>متأخر</span><b style="color:${late.length?'var(--red)':'var(--mint)'}">${late.length? money0(lateAmt)+' '+cur+' ('+late.length+' شهر)':'لا شيء'}</b></div>
      <div class="striplbl" style="padding:14px 0 6px">علّم الشهر لما يتحصّل</div>
      <div class="mgrid">${ms.map(m=>{
        const left=rentLeft(r,m), cls=!left?'paid':left<r.amount?'part':overdue(m)?'late':'';
        return `<button class="${cls}" data-pay="${r.id}|${m}">${AR_M3[+m.slice(5)-1]}<br>${m.slice(2,4)}</button>`;
      }).join('')}</div></div>`;
  }).join('');
  return `<div class="duo">
      <div class="box out"><div class="v">${money0(coll)}</div><div class="l">محصّل (١٢ شهر)</div></div>
      <div class="box inn"><div class="v">${money0(due)}</div><div class="l">متأخر</div></div></div>
    ${cards}<button class="ghost" id="addRent">+ عقد إيجار شهري</button>`;
}
function bindWal(){
  const b=$('#walBody');
  b.querySelectorAll('[data-acc]').forEach(x=>x.onclick=()=>acctSheet(x.dataset.acc));
  b.querySelectorAll('[data-plan]').forEach(x=>x.onclick=()=>planSheet(x.dataset.plan));
  b.querySelectorAll('[data-debt]').forEach(x=>x.onclick=()=>debtSheet(x.dataset.debt));
  b.querySelectorAll('[data-credit]').forEach(x=>x.onclick=()=>creditSheet(x.dataset.credit));
  b.querySelectorAll('[data-rent]').forEach(x=>x.onclick=()=>rentSheet(x.dataset.rent));
  b.querySelectorAll('[data-pay]').forEach(x=>x.onclick=()=>togglePay(x.dataset.pay));
  const g=id=>b.querySelector('#'+id);
  if(g('addAcc')) g('addAcc').onclick=()=>acctSheet(null);
  if(g('addFx')) g('addFx').onclick=()=>acctSheet(null,{fx:true});
  /* wallet filter: a group replaces the pick; an account chip adds or removes itself; an account row shows just it */
  const pickWal=async f=>{ S.settings.walFilter=f; S.accMonth=null; renderWal(); $('#v-wal').scrollTop=0; await saveSettings();
    const sel=b.querySelector('#walF [aria-pressed="true"]'); if(sel) sel.scrollIntoView({block:'nearest',inline:'center'}); };
  b.querySelectorAll('[data-wf]').forEach(x=>x.onclick=()=>pickWal(x.dataset.wf));
  b.querySelectorAll('[data-wone]').forEach(x=>x.onclick=()=>pickWal([x.dataset.wone]));
  b.querySelectorAll('[data-wa]').forEach(x=>x.onclick=()=>{
    const id=x.dataset.wa, f=S.settings.walFilter, cur=Array.isArray(f)?f:(typeof f==='string'&&acctOf(f).id===f?[f]:null);
    let next=cur?(cur.includes(id)?cur.filter(i=>i!==id):[...cur,id]):[id];
    pickWal(next.length?next:'all');
  });
  b.querySelectorAll('[data-atx]').forEach(x=>x.onclick=()=>editTx(x.dataset.atx));
  b.querySelectorAll('[data-adebt]').forEach(x=>x.onclick=()=>debtSheet(x.dataset.adebt));
  b.querySelectorAll('[data-acr]').forEach(x=>x.onclick=()=>creditSheet(x.dataset.acr));
  const oneId=()=>[].concat(S.settings.walFilter)[0];
  if(g('accEdit')) g('accEdit').onclick=()=>acctSheet(oneId());
  if(g('accFx')) g('accFx').onclick=()=>fxSheet({from:oneId()});
  if(g('accRecon')) g('accRecon').onclick=()=>reconSheet(oneId());
  b.querySelectorAll('[data-asc]').forEach(x=>x.onclick=async()=>{ S.settings.accScope=x.dataset.asc; renderWal(); await saveSettings(); });
  if(g('amPrev')) g('amPrev').onclick=()=>{ S.accMonth=prevMonth(S.accMonth); renderWal(); };
  if(g('amNext')) g('amNext').onclick=()=>{ S.accMonth=nextMonth(S.accMonth); renderWal(); };
  if(g('doRecon')) g('doRecon').onclick=()=>reconSheet(null);
  if(g('addPlan')) g('addPlan').onclick=()=>planSheet(null);
  if(g('addDebt')) g('addDebt').onclick=()=>debtSheet(null);
  if(g('addRent')) g('addRent').onclick=()=>rentSheet(null);
  if(g('addStay')) g('addStay').onclick=()=>staySheet(null);
  b.querySelectorAll('[data-stay]').forEach(x=>x.onclick=()=>staySheet(x.dataset.stay));
  b.querySelectorAll('[data-unit]').forEach(x=>x.onclick=()=>unitSheet(x.dataset.unit));
  if(g('addUnit')) g('addUnit').onclick=()=>unitSheet(null);
  b.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{
    const ds=x.dataset.day, on=S.stays.filter(st=>!st.cancelled && st.from<=ds && stayOut(st)>ds);
    if(on.length) staySheet(on[0].id); else staySheet(null,{from:ds});
  });
  if(g('sPrev')) g('sPrev').onclick=()=>{S.stayMonth=prevMonth(S.stayMonth);renderWal();};
  if(g('sNext')) g('sNext').onclick=()=>{S.stayMonth=nextMonth(S.stayMonth);renderWal();};
}

  const code=()=>$('#aC').value;

  let nameTouched=!!id, emojiTouched=!!id;
  const upd=()=>{
    const c=code(), cc=c?ccyOf(c):null, sym=c?(cc?cc.symbol:(preset(c)||[,c])[1]):S.settings.cur;
    $('#aRW').hidden=!c;

    const r=Number($('#aR').value)||0, o=Number($('#aO').value)||0;
    $('#aOv').innerHTML=c&&r>0&&o?`≈ <span class="num">${money0(o*r)}</span> ${cur}`:'';
    if(c&&!nameTouched) $('#aN').value=`${nameOf(c)} متحوّش`;
    if(c&&!emojiTouched&&preset(c)) $('#aE').value=preset(c)[2];
  };
  $('#aC').onchange=()=>{ $('#aR').value=''; upd(); };
  ['aR','aO'].forEach(k=>$('#'+k).addEventListener('input',upd));
  $('#aN').addEventListener('input',()=>nameTouched=true); $('#aE').addEventListener('input',()=>emojiTouched=true);
  upd();

    const [e,n,t]=x.dataset.pre.split('|'); $('#aE').value=e; $('#aN').value=n; $('#aT').value=t; nameTouched=emojiTouched=true; });

    const c=used?(a.ccy||''):code(), r=Number($('#aR').value);
    if(c && !(r>0)){ $('#aR').focus(); return toast('اكتب سعر العملة بالجنيه'); }
    /* the currency itself (code, symbol, today's rate) lives in the settings, shared by its accounts */
    if(c){ const cc=ccyOf(c);
      if(cc) cc.rate=r; else S.settings.currencies.push({code:c,symbol:(preset(c)||[,c])[1],rate:r});
      await saveSettings(); }
    const v={emoji:$('#aE').value.trim()||'💵',name:n,type:$('#aT').value,
             opening:Number($('#aO').value)||0, archived:arch};
    if(c){ v.ccy=c; if(!a.openRate||!used) v.openRate=r; }
    if(id){ Object.assign(a,v); if(!c){ delete a.ccy; delete a.openRate; } await Store.put('acct',a); }
    else{ const na={id:uid(),...v,order:S.accts.length}; S.accts.push(na); await Store.put('acct',na); }
    if(!liveAccts().some(x=>x.id===S.draft.acct)) S.draft.acct=defAcct();
    closeSheet(); renderAccts(); renderWal(); renderRail(); renderSet(); toast('تم');
  };
  const d=$('#aD');
  if(d) d.onclick=async()=>{
    const used=S.tx.filter(t=>t.acct===id||t.toAcct===id).length+moneyMoves().filter(f=>f.acct===id).length;
    if(used){ toast(`فيه ${used} حركة على الحساب ده — اقفله بدل ما تحذفه`); return; }
    await Store.del('acct',id); S.accts=S.accts.filter(x=>x.id!==id);
    if(S.draft.acct===id) S.draft.acct=defAcct();
    closeSheet(); renderAccts(); renderWal(); toast('اتحذف');
  };
}
/* buying, selling or moving money between currencies: what left one account and what arrived in the
   other, each in its own currency. It's a transfer — never income or an expense. */
const isFxTrf=t=>t.kind==='trf'&&(!!acctOf(t.acct).ccy||!!acctOf(t.toAcct).ccy);
function fxSheet(o){
  const t=o.txId?S.tx.find(x=>x.id===o.txId):null;
  const base=liveAccts().find(a=>!a.ccy)||liveAccts()[0];
  let from=t?t.acct:o.from||(o.to?defAcct():base.id), to=t?t.toAcct:o.to||(liveAccts().find(a=>a.ccy&&a.id!==from)||base).id;
  const nat=(tt,side)=>{ const a=acctOf(side==='from'?tt.acct:tt.toAcct), r=side==='from'?[tt.raw,tt.ccy]:[tt.toRaw,tt.toCcy];
    return a.ccy?(r[1]===a.ccy&&r[0]!=null?r[0]:tt.amount/rateOf(a)):tt.amount; };
  const cur=esc(S.settings.cur);
  sheet(`<h2>${t?'تعديل تحويل عملة':'تحويل عملة'}</h2>
    <p class="lede">شراء دولار أو يورو، أو تغييرهم لجنيه. ده تحويل بين حساباتك — مش بيتحسب دخل ولا مصروف.</p>
    <div class="f"><div class="row2">
      <div><label>من حساب</label><select id="xF">${acctOpts(from,true)}</select></div>
      <div><label id="xAL">دفعت</label><input id="xA" type="number" inputmode="decimal" min="0" step="0.01" value="${t?Math.round(nat(t,'from')*100)/100:o.amt||''}"></div></div></div>
    <div class="f"><div class="row2">
      <div><label>إلى حساب</label><select id="xT">${acctOpts(to,true)}</select></div>
      <div><label id="xBL">خدت</label><input id="xB" type="number" inputmode="decimal" min="0" step="0.01" value="${t?Math.round(nat(t,'to')*100)/100:''}"></div></div></div>
    <div id="xR" style="font-size:12.5px;color:var(--dim);margin:-4px 0 12px;min-height:18px"></div>
    <div class="f"><div class="row2">
      <div><label>اليوم</label><input id="xD" type="date" value="${t?t.date:o.date||today()}"></div>
      <div><label>ملاحظة</label><input id="xN" maxlength="60" placeholder="مثلاً: من الصرافة" value="${esc(t?t.note||'':o.note||'')}"></div></div></div>
    <div class="acts">${t?'<button class="del" id="xDel">حذف</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}<button class="go" id="xOk">سجّل</button></div>`);
  let bTouched=!!t;
  const A=()=>acctOf($('#xF').value), B=()=>acctOf($('#xT').value);
  const upd=()=>{
    $('#xAL').textContent=`دفعت (بالـ${symOf(A())})`; $('#xBL').textContent=`خدت (بالـ${symOf(B())})`;
    const a=Number($('#xA').value)||0;
    if(!bTouched) $('#xB').value=a?Math.round(a*rateOf(A())/rateOf(B())*100)/100:'';
    const b=Number($('#xB').value)||0, fa=A(), fb=B();
    /* the rate this exchange actually got, in the base currency per unit of the foreign side */
    const fx=fb.ccy&&!fa.ccy?fb:fa.ccy&&!fb.ccy?fa:null;
    $('#xR').innerHTML=a&&b&&fx?`يعني 1 ${esc(symOf(fx))} = <b class="num">${money(fx===fb?a/b:b/a)}</b> ${cur}${Math.abs((fx===fb?a/b:b/a)-rateOf(fx))>0.005?` · السعر المتسجل ${rateOf(fx)} — <button type="button" id="xUse" style="color:var(--brand);font-weight:600">خلّيه السعر الجديد</button>`:''}`:'';
    if($('#xUse')) $('#xUse').onclick=async()=>{ ccyOf(fx.ccy).rate=Math.round((fx===fb?a/b:b/a)*100)/100; await saveSettings(); upd(); renderAccts(); toast('اتحدّث السعر'); };
  };
  $('#xA').addEventListener('input',upd); $('#xB').addEventListener('input',()=>{bTouched=true;upd();});
  $('#xF').onchange=$('#xT').onchange=()=>{ if(!t) bTouched=false; upd(); };
  upd();
  $('#xOk').onclick=async()=>{
    const fa=A(), fb=B(), a=Number($('#xA').value), b=Number($('#xB').value);
    if(fa.id===fb.id) return toast('الحسابين نفس الحساب');
    if(!(a>0)){ $('#xA').focus(); return; }
    if(!(b>0)){ $('#xB').focus(); return; }
    /* the base-currency value used in reports: the ج side when there is one */
    const amount=!fa.ccy?a:!fb.ccy?b:a*rateOf(fa);
    const v={kind:'trf',acct:fa.id,toAcct:fb.id,amount,date:$('#xD').value||today(),note:$('#xN').value.trim()};
    if(fa.ccy){ v.ccy=fa.ccy; v.raw=a; }
    if(fb.ccy){ v.toCcy=fb.ccy; v.toRaw=b; }
    if(t){ ['ccy','raw','rate','toCcy','toRaw'].forEach(k=>delete t[k]); Object.assign(t,v); await Store.put('tx',t); sortTx(); }
    else{ const n={id:uid(),at:Date.now(),...v}; S.tx.push(n); await Store.put('tx',n); sortTx(); }
    if(o.fromDraft){ S.draft.amt=''; S.draft.note=''; }
    closeSheet(); renderAccts(); renderWal(); renderLog(); renderRail(); renderReadout();
    toast(`دفعت ${money(a)} ${esc(symOf(fa))} وخدت ${money(b)} ${esc(symOf(fb))}`);
  };
  if($('#xDel')) $('#xDel').onclick=async()=>{ if(!confirm('حذف التحويل ده؟')) return;
    await Store.del('tx',t.id); S.tx=S.tx.filter(x=>x.id!==t.id); closeSheet(); renderAccts(); renderWal(); renderLog(); renderRail(); toast('اتحذف'); };
}

/* the expense category for commissions and refunds to guests */
const bizExpCat=()=>(guessCat('عمولة',catsOf('exp'))||guessCat('رسوم',catsOf('exp'))||catsOf('exp').slice(-1)[0]).id;
/* a booking's money in the log: one income tx per payment that arrived while the app was in use
   (payments marked `pre` were already inside the opening balance and log nothing), one expense per
   refund to the guest, and one for the commission paid to the platform. All carry the booking and its unit. */
async function syncStayTx(st,before){
  const b=Array.isArray(before)?{pays:before}:(before||{});
  const moves=x=>[...(x.pays||[]),...(x.refunds||[]),...(x.feePay?[x.feePay]:[])];
  const keep=new Set(moves(st).map(p=>p.id));
  for(const p of moves(b)) if(!keep.has(p.id) && p.tx){ await Store.del('tx',p.tx); S.tx=S.tx.filter(x=>x.id!==p.tx); }
  const due=stayDue(st), who=`${CH[st.channel].name} · ${st.guest?st.guest+' · ':''}${nightsLbl(st.nights)}${st.unitId?' · '+unitName(st.unitId):''}`;
  const put=async(p,v)=>{
    const t=p.tx&&S.tx.find(x=>x.id===p.tx);
    if(p.pre){ if(t){ await Store.del('tx',t.id); S.tx=S.tx.filter(x=>x.id!==t.id); } delete p.tx; return; }
    v={...v,stay:st.id,...(st.unitId?{unitId:st.unitId}:{})};
    if(t){ ['unit','unitId','fee','refund'].forEach(k=>delete t[k]); Object.assign(t,v); await Store.put('tx',t); }
    else{ const n={id:uid(),at:Date.now(),...v}; S.tx.push(n); await Store.put('tx',n); p.tx=n.id; }
  };
  /* the earliest payment (by day, then by when it was logged) is the deposit — not whichever sits first in the list */

      <div><label>بداية العقد</label><input id="tS" type="date" value="${r.start}"></div>
    </div></div>
    <div class="f"><label>تصنيف الدخل</label><select id="tC">
      ${catsOf('inc').map(c=>`<option value="${c.id}" ${c.id===r.cat?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select></div>
    <div class="f"><label>ملاحظة</label><input id="tN" maxlength="60" value="${esc(r.note||'')}"></div>
    <div class="acts">
      ${id?'<button class="del" id="tDel">حذف</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="tOk">حفظ</button></div>`);
  $('#tOk').onclick=async()=>{
    const t=$('#tT').value.trim(), a=Number($('#tA').value);
    if(!t){ $('#tT').focus(); return; }
    if(!(a>0)){ $('#tA').focus(); return; }
    const v={tenant:t,unitId:await unitIdFor($('#tU').value),amount:a,
      dueDay:Math.min(31,Math.max(1,Number($('#tD').value)||1)),
      start:$('#tS').value||today(),cat:$('#tC').value,note:$('#tN').value.trim()};
    if(id){ Object.assign(r,v); delete r.unit; await Store.put('rent',r);
      /* the rent already collected follows the contract to its unit */
      for(const t of S.tx) if(t.rent===r.id && (t.unitId||'')!==v.unitId){
        if(v.unitId) t.unitId=v.unitId; else delete t.unitId; await Store.put('tx',t); } }
    else{ const nr={id:uid(),...v,paid:[]}; S.rents.push(nr); await Store.put('rent',nr); }
    closeSheet(); renderWal(); renderLog(); toast('تم');
  };
  const d=$('#tDel');
  if(d) d.onclick=async()=>{ if(!confirm('حذف العقد ده؟')) return;
    await Store.del('rent',id); S.rents=S.rents.filter(x=>x.id!==id);
    closeSheet(); renderWal(); toast('اتحذف'); };
}
function togglePay(key){
  const [id,m]=key.split('|');
  const r=S.rents.find(x=>x.id===id); if(!r) return;
  const cur=esc(S.settings.cur), got=rentPaid(r,m), left=r.amount-got;
  const head=`<h2>إيجار ${monthLabel(m)}</h2><p class="lede">${esc(r.tenant)}${r.unitId?' — '+esc(unitName(r.unitId)):''}</p>`;
  /* income this month's collection logged, still in the log */
  const logged=()=>((r.txs||{})[m]||[]).map(i=>S.tx.find(t=>t.id===i)).filter(Boolean);
  const unmark=async()=>{
    const inc=logged();
    if(inc.length && !confirm(`هيتمسح كمان الدخل اللي اتسجل (${money(sum(inc))} ${S.settings.cur}). تكمل؟`)) return;
    for(const t of inc){ await Store.del('tx',t.id); S.tx=S.tx.filter(x=>x.id!==t.id); }
    r.paid=(r.paid||[]).filter(x=>x!==m);
    if(r.part) delete r.part[m];
    if(r.txs) delete r.txs[m];
    await Store.put('rent',r); closeSheet(); renderWal(); renderRail(); renderAccts(); renderLog();
    toast('اترجع غير محصّل');
  };
  if(!left){
    sheet(`${head}<div class="kv big"><span>اتحصّل بالكامل</span><b style="color:var(--mint)">${money(r.amount)} ${cur}</b></div>
      <div class="acts"><button class="del" id="ryUn">رجّعه غير محصّل</button><button class="no" onclick="closeSheet()">تمام</button></div>`);
    $('#ryUn').onclick=unmark;
    return;
  }
  sheet(`${head}
    ${got?`<div class="kv"><span>اتحصّل قبل كده</span><b style="color:var(--mint)">${money(got)} ${cur}</b></div><div class="perf"></div>`:''}
    <div class="kv big"><span>فاضل</span><b>${money(left)} ${cur}</b></div>
    <div class="f" style="margin-top:14px"><div class="row2">
      <div><label>المبلغ اللي استلمته</label><input id="ryAmt" type="number" inputmode="decimal" step="0.01" value="${left}"></div>
      <div><label>استلمته يوم</label><input id="ryD" type="date" value="${today()}"></div>
    </div></div>
    <div class="f"><label>استلمته في أنهي حساب؟</label><select id="ryAcct">${acctOpts(defAcct())}</select></div>
    <label class="chk"><input type="checkbox" id="ryRec" checked><span>سجّله دخل في الحساب ده</span></label>
    <div class="acts">${got?'<button class="del" id="ryUn">امسح المحصّل</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="ryOk">سجّل</button></div>`);
  if($('#ryUn')) $('#ryUn').onclick=unmark;
  $('#ryOk').onclick=async()=>{
    const a=Number($('#ryAmt').value);
    if(!(a>0) || a>left+0.005){ $('#ryAmt').focus(); return toast(`المبلغ لازم يكون أكبر من 0 ولحد ${money(left)}`); }
    const acct=$('#ryAcct').value, rec=$('#ryRec').checked, full=a>=left-0.005;
    const before={paid:(r.paid||[]).slice(),part:{...(r.part||{})}};
    if(full){ r.paid=[...(r.paid||[]).filter(x=>x!==m),m]; if(r.part) delete r.part[m]; }
    else r.part={...(r.part||{}),[m]:got+a};
    await Store.put('rent',r);
    closeSheet(); renderWal();
    /* dated the day it came in, so balances and reconciliations line up; the note names the month */
    if(rec){
      const t=await commit({kind:'inc',amount:a,cat:r.cat,acct,rent:r.id,...(r.unitId?{unitId:r.unitId}:{}),
        note:`إيجار ${monthLabel(m)} — ${r.tenant}${full&&!got?'':' (جزء)'}`,date:$('#ryD').value||today()},
        async()=>{ Object.assign(r,before); r.txs[m]=(r.txs[m]||[]).filter(i=>i!==t.id);
          await Store.put('rent',r); renderWal(); });
      r.txs={...(r.txs||{}),[m]:[...((r.txs||{})[m]||[]),t.id]};
      await Store.put('rent',r);
    }
    else toast(full?'اتحصّل بالكامل':`اتحصّل ${money0(got+a)} من ${money0(r.amount)}`);
    renderWal();
  };
}

function ccySheet(i){

  sheet(`<h2>${i>=0?'تعديل العملة':'عملة إضافية'}</h2>
    <p class="lede">السعر بتحدده بنفسك وبيفضل ثابت. عدّله كل فترة.</p>

      <div><label>الرمز</label><input id="yS" maxlength="3" placeholder="€" value="${esc(c.symbol)}"></div>
      <div><label>= كام ${esc(S.settings.cur)}</label><input id="yR" type="number" inputmode="decimal" step="0.01" value="${c.rate}"></div>
    </div></div>
    <div class="acts">
      ${i>=0?'<button class="del" id="yD">حذف</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="yOk">حفظ</button></div>`);
  $('#yOk').onclick=async()=>{
    const code=$('#yC').value.trim().toUpperCase(), sym=$('#yS').value.trim()||code, r=Number($('#yR').value);

    if(!(r>0)){ $('#yR').focus(); return; }
    const v={code,symbol:sym,rate:r};
    if(i>=0 && c.code!==code && S.accts.some(a=>a.ccy===c.code)) return toast(`فيه حساب بالـ${esc(c.code)} — الكود ما ينفعش يتغير`);
    if(i>=0) S.settings.currencies[i]=v; else S.settings.currencies.push(v);

  };
  const d=$('#yD');

    if(S.accts.some(a=>a.ccy===c.code)) return toast(`فيه حساب بالـ${esc(c.code)} — اقفله الأول`);
    S.settings.currencies.splice(i,1);
    if(S.draft.ccy&&!ccyOf(S.draft.ccy)) S.draft.ccy=null;
    await saveSettings(); closeSheet(); renderSet(); renderReadout(); toast('اتحذفت'); };

    await Store.del('cats',id); S.cats=S.cats.filter(x=>x.id!==id);
    if(S.draft.cat===id) S.draft.cat=catsOf(S.draft.kind)[0].id;
    closeSheet(); renderCats(); renderQuick(); renderSet(); renderReadout(); toast('اتحذف');
  };
}

const freqLabel=r=>r.freq==='week'?`كل ${AR_DAYS[r.dow|0]}`
  :r.freq==='year'?`كل سنة ${r.day} ${AR_MONTHS[(r.mon||1)-1]}`:`شهري يوم ${r.day}`;
function recSheet(id){
  const r=id?S.recur.find(x=>x.id===id)
    :{kind:'exp',amount:'',cat:catsOf('exp')[0].id,acct:liveAccts()[0].id,note:'',freq:'month',day:1,dow:new Date().getDay(),mon:new Date().getMonth()+1};
  const f=r.freq||'month';
  sheet(`<h2>${id?'تعديل بند ثابت':'بند ثابت جديد'}</h2>
    <div class="f"><div class="row2">
      <div><label>النوع</label><select id="rK">
        <option value="exp" ${r.kind==='exp'?'selected':''}>مصروف ثابت</option>
        <option value="inc" ${r.kind==='inc'?'selected':''}>دخل ثابت</option></select></div>
      <div><label>بيتكرر</label><select id="rF">
        <option value="week" ${f==='week'?'selected':''}>كل أسبوع</option>
        <option value="month" ${f==='month'?'selected':''}>كل شهر</option>
        <option value="year" ${f==='year'?'selected':''}>كل سنة</option></select></div>
    </div></div>
    <div class="f"><div class="row2">
      <div><label>المبلغ</label><input id="rA" type="number" inputmode="decimal" step="0.01" value="${r.amount}"></div>
      <div id="rDw"><label>اليوم</label><input id="rD" type="number" min="1" max="31" value="${r.day||1}"></div>
      <div id="rWw"><label>يوم الأسبوع</label><select id="rW">
        ${AR_DAYS.map((d,i)=>`<option value="${i}" ${i===(r.dow|0)?'selected':''}>${d}</option>`).join('')}</select></div>
    </div></div>
    <div class="f" id="rMw"><label>الشهر</label><select id="rMo">
      ${AR_MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===(r.mon||1)?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="f"><label>الوصف</label><input id="rN" maxlength="40" placeholder="مثلاً: مرتب الشهر" value="${esc(r.note||'')}"></div>
    <div class="f"><label>التصنيف</label><select id="rC">
      ${catsOf(r.kind).map(c=>`<option value="${c.id}" ${c.id===r.cat?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select></div>
    <div class="f"><label>الحساب</label><select id="rM">
      ${liveAccts().map(a=>`<option value="${a.id}" ${a.id===r.acct?'selected':''}>${a.emoji} ${esc(a.name)}</option>`).join('')}</select></div>
    <div class="acts">
      ${id?'<button class="del" id="rDel">حذف</button>':'<button class="no" onclick="closeSheet()">إلغاء</button>'}
      <button class="go" id="rOk">حفظ</button></div>`);
  const showF=()=>{ const v=$('#rF').value;
    $('#rDw').hidden=v==='week'; $('#rWw').hidden=v!=='week'; $('#rMw').hidden=v!=='year'; };
  $('#rF').onchange=showF; showF();
  $('#rK').onchange=e=>{
    $('#rC').innerHTML=catsOf(e.target.value).map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('');
  };
  $('#rOk').onclick=async()=>{
    const a=Number($('#rA').value); if(!(a>0)){$('#rA').focus();return;}
    const nf=$('#rF').value;
    const v={kind:$('#rK').value,amount:a,freq:nf,day:Math.min(31,Math.max(1,Number($('#rD').value)||1)),
      dow:+$('#rW').value,mon:+$('#rMo').value,note:$('#rN').value.trim(),cat:$('#rC').value,acct:$('#rM').value};
    /* a changed schedule starts fresh, without re-posting what the old one already posted */
    const posted=k=>!!id&&S.tx.some(t=>t.rec===id&&t.date.startsWith(k));
    const fresh=nf==='month'
      ? {lastMonth:posted(mKey(today()))?mKey(today()):''}
      : {lastDate:'',since:posted(today())?iso(addDays(new Date(),1)):today()};
    /* what it already posted this month can follow the change (category, amount, account, note) */
    const mine=id?S.tx.filter(t=>t.rec===id&&mKey(t.date)===mKey(today())):[];
    const differs=t=>t.cat!==v.cat||t.acct!==v.acct||t.kind!==v.kind||(!t.ccy&&Math.abs(t.amount-a)>0.005)||(t.note||'')!==v.note;
    let moved=0;
    if(mine.some(differs) && confirm(`البند ده اتسجل خلاص ${mine.length===1?'مرة':mine.length+' مرات'} الشهر ده.\nتغيّر كمان اللي اتسجل بالتعديل الجديد؟`)){
      for(const t of mine){ Object.assign(t,{cat:v.cat,acct:v.acct,kind:v.kind,note:v.note}); if(!t.ccy) t.amount=a; moved++; }
      await Store.batch(mine.map(t=>['put','tx',t]));
    }
    if(id){ if(nf!==f) Object.assign(r,fresh); Object.assign(r,v); await Store.put('recur',r); }
    else{ const nr={id:uid(),...v,...fresh}; S.recur.push(nr); await Store.put('recur',nr); }
    closeSheet(); await runRecurring(); renderSet(); renderRail(); renderLog(); toast(moved?'تم — واتعدّل اللي اتسجل الشهر ده':'تم');
  };
  const d=$('#rDel');
  if(d) d.onclick=async()=>{ await Store.del('recur',id); S.recur=S.recur.filter(x=>x.id!==id);
    closeSheet(); renderSet(); toast('اتحذف'); };
}

/* ═══════ data in / out ═══════ */
function download(name,text,type){
  const b=new Blob(['\ufeff'+text],{type}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function exportCsv(){
  if(!S.tx.length) return toast('مفيش بيانات للتصدير');
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['التاريخ','النوع','التصنيف','الحساب','إلى حساب','المبلغ','العملة الأصلية','المبلغ الأصلي','ملاحظة','شخصي / إيجارات','الوحدة','آجل لـ','آجل فاضل'].map(q).join(',');
  const val=t=>t.kind==='inc'||t.kind==='ref'?t.amount:t.kind==='trf'?0:-t.amount;
  const body=[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>
    [t.date,KINDS[t.kind].label,t.kind==='trf'?'':catOf(t.cat).name,acctOf(t.acct).name,
     t.toAcct?acctOf(t.toAcct).name:'',val(t),t.ccy||'',t.raw||'',t.note||'',isBiz(t)?'إيجارات':'شخصي',unitName(t.unitId),t.credit?(t.credit.vendor||'آجل'):'',t.credit?creditLeft(t):''].map(q).join(',')).join('\n');
  let csv=head+'\n'+body;
  csv+='\n\n'+['الحسابات','الاسم','النوع','الرصيد'].map(q).join(',')+'\n'+
       S.accts.map(a=>['',a.name+(a.ccy?` (${a.ccy})`:''),a.type==='cash'?'كاش':'بنك',balance(a.id)+(a.ccy?` ${a.ccy} ≈ ${Math.round(balanceBase(a.id))}`:'')].map(q).join(',')).join('\n');
  if(S.debts.length)
    csv+='\n\n'+['السلف','الاسم','الاتجاه','المبلغ','التاريخ','موعد السداد','سُدّدت','ملاحظة','المسدّد','الطريقة','طرق السداد'].map(q).join(',')+'\n'+
      S.debts.map(d=>['',d.person,d.dir==='out'?'ليّ عنده':'عليّ له',d.amount,d.date,d.due||'',d.settledAt||'',d.note||'',debtPaid(d)||'',d.acct?acctOf(d.acct).name:'',
        [...new Set((d.pays||[]).filter(p=>p.acct).map(p=>acctOf(p.acct).name))].join(' / ')].map(q).join(',')).join('\n');
  if(S.rents.length)
    csv+='\n\n'+['الإيجارات','الساكن','الوحدة','الإيجار','شهور محصّلة','محصّل جزئياً'].map(q).join(',')+'\n'+
      S.rents.map(r=>['',r.tenant,unitName(r.unitId),r.amount,(r.paid||[]).join(' '),
        Object.entries(r.part||{}).map(([m,v])=>`${m} (${v})`).join(' ')].map(q).join(',')).join('\n');
  if(S.stays.length)
    csv+='\n\n'+['الحجوزات','الوحدة','الضيف','الوصول','الليالي','الإجمالي','العمولة','الصافي','المصدر','المدفوع','الباقي','الدفعات'].map(q).join(',')+'\n'+
      S.stays.slice().sort((a,b)=>a.from.localeCompare(b.from)).map(st=>['',unitName(st.unitId)+(st.cancelled?' (ملغي)':''),st.guest||'',st.from,st.nights,st.total,st.fee||0,stayNet(st),
        CH[st.channel].name,stayPaid(st),stayLeft(st),(st.pays||[]).map(p=>`${p.date} ${p.amount} ${acctOf(p.acct).name}`).join(' / ')].map(q).join(',')).join('\n');
  download(`qersh-abyad-${today()}.csv`,csv,'text/csv;charset=utf-8');
  toast('اتصدر ملف CSV');
}
const backupJson=()=>JSON.stringify({v:4,at:new Date().toISOString(),settings:S.settings,cats:S.cats,acct:S.accts,
  tx:S.tx,recur:S.recur,debt:S.debts,recon:S.recons,plan:S.plans,rent:S.rents,stay:S.stays,goal:S.goals});
async function exportJson(){
  const name=`qersh-abyad-backup-${today()}.json`, text=backupJson();
  /* on phones the share sheet saves straight to Files / Drive / WhatsApp */
  let file=null;
  try{ file=new File([text],name,{type:'application/json'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:name}); }
    catch(e){ if(e.name==='AbortError') return; download(name,text,'application/json'); }
  } else download(name,text,'application/json');
  S.settings.lastBackup=Date.now(); await saveSettings();
  renderSet(); toast('النسخة الاحتياطية جاهزة');
}
async function copyAll(){
  const text=backupJson();
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    /* older iPhones: select a textarea and copy */
    const t=document.createElement('textarea'); t.value=text; t.setAttribute('readonly','');
    t.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(t);
    t.select(); t.setSelectionRange(0,text.length); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    t.remove(); if(!ok) return alert('مقدرتش أنسخ — استخدم «نسخة احتياطية كاملة» واحفظ الملف.');
  }
  alert(`اتنسخ ✅ (${S.tx.length} حركة${S.stays.length?` · ${S.stays.length} حجز`:''})\nافتح التطبيق التاني ← الإعدادات ← استرجاع من نسخة احتياطية ← الصق.`);
}
function importJson(){
  sheet(`<h2>استرجاع البيانات</h2>
    <p class="lede">اختار ملف النسخة الاحتياطية، <b>أو</b> الصق البيانات اللي نسختها بـ «نسخ كل البيانات» من التطبيق التاني.</p>
    <div class="f"><label>١. من ملف</label>
      <input id="imFile" type="file" style="padding:14px;border-style:dashed;background:var(--ink)"></div>
    <div class="f"><label>٢. أو الصق البيانات هنا</label>
      <textarea id="imText" rows="4" placeholder="دوس هنا ← لصق" style="font-size:12px;direction:ltr;text-align:left"></textarea></div>
    <div id="imMsg" style="font-size:13px;min-height:18px;color:var(--dim)"></div>
    <div class="acts"><button class="no" onclick="closeSheet()">إلغاء</button><button class="go" id="imOk">استرجع</button></div>`);
  const msg=t=>{ $('#imMsg').innerHTML=t; };
  $('#imFile').onchange=async()=>{
    const f=$('#imFile').files[0]; if(!f) return;
    msg('جاري قراية الملف…');
    try{ $('#imText').value=await f.text(); msg(`الملف اتقرا (${Math.round(f.size/1024)} KB) — دوس «استرجع»`); }
    catch(e){ msg('<span style="color:var(--red)">مقدرتش أقرا الملف — جرّب اللصق</span>'); }
  };
  $('#imOk').onclick=()=>restoreFrom($('#imText').value);
}
async function restoreFrom(text){
  {
    if(!String(text||'').trim()) return alert('اختار ملف أو الصق البيانات الأول.');
    let raw;
    try{ raw=JSON.parse(String(text).trim().replace(/^﻿/,'')); }
    catch(e){ return alert('ده مش نسخة احتياطية من التطبيق.\nاختار ملف qersh-abyad-backup-….json أو masareef-backup-….json، أو الصق البيانات المنسوخة كاملة.'); }
    const {d,skipped}=repairBackup(raw);
    const bad=d?checkBackup(d):'not an object';
    if(bad) return alert('ده مش نسخة احتياطية كاملة من التطبيق.\n('+bad+')');
    const n=d.tx.length;
    if(!confirm(`النسخة فيها ${n} حركة${d.stay&&d.stay.length?` و${d.stay.length} حجز`:''}.\nالاسترجاع هيحط البيانات دي مكان البيانات الحالية على الموبايل ده. تكمل؟`)) return;
    /* a safety copy of what's here now, kept inside the app */
    if(S.tx.length) await Store.put('meta',{id:'preRestore',at:Date.now(),v:backupJson()}).catch(()=>{});
    closeSheet();

    let accts=d.acct||[];
    if(!accts.length) accts=DEF_ACCT.map((a,i)=>({id:uid(),...a,opening:0,order:i,archived:false}));
    const aCash=accts.find(a=>a.type==='cash'&&!a.ccy)||accts[0];
    const aBank=accts.find(a=>a.type==='bank'&&!a.ccy)||accts[accts.length-1];
    for(const c of d.cats){ if(!c.kind)c.kind='exp'; if(c.kind==='exp'&&typeof c.fixed!=='boolean') c.fixed=false; }
    for(const t of d.tx){ if(!t.kind)t.kind='exp'; delete t._new; if(!t.acct) t.acct=t.method==='card'?aBank.id:aCash.id; }
    for(const r of (d.recur||[])){ if(!r.kind)r.kind='exp'; if(!r.acct) r.acct=r.method==='card'?aBank.id:aCash.id; }
    for(const x of (d.recon||[])) if(!x.acct) x.acct=aCash.id;
    const settings={...S.settings,...(d.settings||{})};
    if(!Array.isArray(settings.currencies)) settings.currencies=[];
    /* an older backup has no unit list — its unit names become units below, not the ones on this phone */
    if(!(d.settings&&Array.isArray(d.settings.units))) settings.units=[];

    /* one transaction: either the whole backup lands or the current data stays untouched */
    const lists={tx:d.tx,cats:d.cats,recur:d.recur||[],debt:d.debt||[],recon:d.recon||[],acct:accts,plan:d.plan||[],rent:d.rent||[],stay:d.stay||[],goal:d.goal||[]};
    const ops=Object.keys(lists).map(k=>['clear',k]);
    for(const k in lists) for(const x of lists[k]) ops.push(['put',k,x]);
    ops.push(['put','meta',{id:'settings',v:settings}]);
    try{ await Store.batch(ops); }catch(e){ return toast('الاسترجاع فشل — بياناتك زي ما هي'); }

    S.settings=settings;
    S.accts=accts.slice().sort((a,b)=>a.order-b.order);
    S.cats=d.cats.slice().sort((a,b)=>a.order-b.order);
    S.tx=d.tx.slice(); sortTx();
    S.recur=lists.recur; S.debts=lists.debt; S.plans=lists.plan; S.rents=lists.rent; S.stays=lists.stay; S.goals=lists.goal;
    for(const st of S.stays) if(!st.pays){
      st.pays=st.paidOn?[{id:uid(),amount:stayNet(st),date:st.paidOn,acct:st.acct,tx:st.tx}]:[];
      delete st.paidOn; delete st.tx; await Store.put('stay',st);
    }
    S.recons=lists.recon.slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(!Array.isArray(S.settings.units)) S.settings.units=[];
    await migrateRental();
    S.lastCat.exp=catsOf('exp')[0]&&catsOf('exp')[0].id;
    S.lastCat.ref=S.lastCat.exp;
    S.lastCat.inc=catsOf('inc')[0]&&catsOf('inc')[0].id;
    S.draft.cat=S.lastCat[S.draft.kind==='trf'?'exp':S.draft.kind];
    S.draft.acct=liveAccts()[0].id;
    S.draft.toAcct=(liveAccts()[1]||liveAccts()[0]).id;
    applyTheme(); applyMode();
    renderAccts(); renderCats(); renderQuick(); renderSet(); renderRail(); renderReadout(); renderLog(); renderWal();
    alert(`اترجعت البيانات ✅\n${n} حركة${S.stays.length?` · ${S.stays.length} حجز`:''}${S.accts.length?` · ${S.accts.length} حساب`:''}${skipped?`\n(${skipped} سطر بايظ في الملف اتساب)`:''}`);
    go('log');
  }
}
async function wipe(){
  if(!confirm('حذف كل الحركات؟ الحسابات والتصنيفات والبنود الثابتة والسلف والحجوزات وعقود الإيجار هتفضل — بس الدخل اللي اتسجل منها هيتمسح.')) return;
  const recur=S.recur.map(r=>({...r,lastMonth:'',lastDate:'',since:today()}));
  /* their income is gone: payments stay counted on the booking, but log nothing (like money from before the app) */
  const gone=p=>{ const q={...p,pre:true}; delete q.tx; return q; };
  for(const st of S.stays){ st.pays=(st.pays||[]).map(gone); if(st.refunds) st.refunds=st.refunds.map(gone); if(st.feePay) st.feePay=gone(st.feePay); }
  for(const r of S.rents) delete r.txs;
  await Store.batch([['clear','tx'],['clear','recon'],...recur.map(r=>['put','recur',r]),
    ...S.stays.map(st=>['put','stay',st]),...S.rents.map(r=>['put','rent',r])]);
  S.tx=[]; S.recons=[]; S.recur=recur;
  renderSet(); renderRail(); renderQuick(); renderAccts(); toast('اتمسحت كل الحركات');
}

/* the newest version on the site (read from sw.js, skipping every cache), or 0 when offline */
async function checkUpdate(){
  try{ const t=await (await fetch('sw.js',{cache:'no-store'})).text(); const m=t.match(/masareef-v(\d+)/); return m?+m[1]:0; }
  catch(e){ return 0; }
}
/* fetch the newest app now: refresh the service worker, drop the saved copy, reload. Data is untouched (it's in IndexedDB) */
async function forceUpdate(){
  if(navigator.onLine===false) return toast('محتاج نت علشان يجيب التحديث');
  toast('بيجيب آخر نسخة…');
  try{ const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(r) await r.update(); }catch(e){}
  try{ for(const k of await caches.keys()) await caches.delete(k); }catch(e){}
  location.reload();
}
/* a newer version is out but this phone still runs the old one: say so once per version */
setTimeout(async()=>{ const v=await checkUpdate(); if(v>APP_VER && S.settings.updNag!==v){
  S.settings.updNag=v; saveSettings(); toast(`فيه تحديث جديد للتطبيق`,forceUpdate,'حدّث'); } },4000);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
